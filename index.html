u will not redeem it, then you shall break its neck; and you shall redeem all the firstborn of man among your sons.","web|Exodus 12:3-13":"3 Speak to all the congregation of Israel, saying, ‘On the tenth day of this month, they shall take to them every man a lamb, according to their fathers’ houses, a lamb for a household; 4 and if the household is too little for a lamb, then he and his neighbor next to his house shall take one according to the number of the souls; according to what everyone can eat you shall make your count for the lamb. 5 Your lamb shall be without defect, a male a year old. You shall take it from the sheep, or from the goats: 6 and you shall keep it until the fourteenth day of the same month; and the whole assembly of the congregation of Israel shall kill it at evening. 7 They shall take some of the blood, and put it on the two door posts and on the lintel, on the houses in which they shall eat it. 8 They shall eat the flesh in that night, roasted with fire, and unleavened bread. They shall eat it with bitter herbs. 9 Don’t eat it raw, nor boiled at all with water, but roasted with fire; with its head, its legs and its inner parts. 10 You shall let nothing of it remain until the morning; but that which remains of it until the morning you shall burn with fire. 11 This is how you shall eat it: with your belt on your waist, your shoes on your feet, and your staff in your hand; and you shall eat it in haste: it is Yahweh’s Passover. 12 For I will go through the land of Egypt in that night, and will strike all the firstborn in the land of Egypt, both man and animal. Against all the gods of Egypt I will execute judgments: I am Yahweh. 13 The blood shall be to you for a token on the houses where you are: and when I see the blood, I will pass over you, and there shall no plague be on you to destroy you, when I strike the land of Egypt.","web|1 Peter 1:18-19":"knowing that you were redeemed, not with corruptible things, with silver or gold, from the usele n once cleansed, would have had no more consciousness of sins? 3 But in those sacrifices there is a yearly reminder of sins. 4 For it is impossible that the blood of bulls and goats should take away sins. 5 Therefore when he comes into the world, he says, “Sacrifice and offering you didn’t desire, but you prepared a body for me; 6 You had no pleasure in whole burnt offerings and sacrifices for sin. 7 Then I said, ‘Behold, I have come (in the scroll of the book it is written of me) to do your will, O God.’” 8 Previously saying, “Sacrifices and offerings and whole burnt offerings and sacrifices for sin you didn’t desire, neither had pleasure in them” (those which are offered according to the law),","web|Ephesians 2:8":"for by grace you have been saved through faith, and that not of yourselves; it is the gift of God,","web|Romans 3:20":"Because by the works of the law, no flesh will be justified in his sight. For through the law comes the knowledge of sin.","web|Ephesians 2:8-9":"for by grace you have been saved through faith, and that not of yourselves; it is the gift of God, not of works, that no one would boast.","web|Romans 5:8":"But God commends his own love toward us, in that while we were yet sinners, Christ died for us.","web|Ephesians 1:6":"to the praise of the glory of his grace, by which he freely bestowed favor on us in the Beloved,","web|2 Corinthians 11:30":"If I must boast, I will boast of the things that concern my weakness.","web|Matthew 8:4":"Jesus said to him, “See that you tell nobody, but go, show yourself to the priest, and offer the gift that Moses commanded, as a testimony to them.”","web|Luke 8:38-39":"38 But the man from whom the demons had gone out begged him that he might go with him, but Jesus sent him away, saying, 39 “Return to your house, and declare what great things God has done for you.” He went his way, proclaiming throughout the whole city what great things Jesus had done for him.","web|John 3:16":"For God so loved the world, that he gave his one and only Son, that whoever believes in him should not perish, but have eternal life.","web|Romans 3:19-20":"19 Now we know that whatever things the law says, it speaks to those who are under the law, that every mouth may be closed, and all the world may be brought under the judgment of God. 20 Because by the works of the law, no flesh will be justified in his sight. For through the law comes the knowledge of sin.","web|Hebrews 10:17-18":"17 “I will remember their sins and their iniquities no more.” 18 Now where remission of these is, there is no more offering for sin.","web|1 Corinthians 15:56":"The sting of death is sin, and the power of sin is the law.","web|Ephesians 2:9":"not of works, that no one would boast.","web|2 Corinthians 5:17":"Therefore if anyone is in Christ, he is a new creation. The old things have passed away. Behold, all things have become new.","web|John 14:13":"Whatever you will ask in my name, that will I do, that the Father may be glorified in the Son.","web|Romans 5:20":"The law came in besides, that the trespass might abound; but where sin abounded, grace abounded more exceedingly;","web|Titus 2:11-12":"11 For the grace of God has appeared, bringing salvation to all men, 12 instructing us to the intent that, denying ungodliness and worldly lusts, we would live soberly, righteously, and godly in this present world;","web|Romans 7:12-13":"12 Therefore the law indeed is holy, and the commandment holy, and righteous, and good. 13 Did then that which is good become death to me? May it never be! But sin, that it might be shown to be sin, by working death to me through that which is good; that through the commandment sin might become exceedingly sinful.","web|Romans 8:15":"For you didn’t receive the spirit of bondage again to fear, but you received the Spirit of adoption, by whom we cry, “Abba! Father!”","web|Luke 7:41-43":"41 “A certain lender had two debtors. The one owed five hundred denarii, and the other fifty. 42 When they coul s is the work of God, that you believe in him whom he has sent.”","web|John 1:18":"No one has seen God at any time. The one and only Son, who is in the bosom of the Father, he has declared him.","web|John 20:28":"Thomas answered him, “My Lord and my God!”","web|John 10:30":"I and the Father are one.","web|1 Timothy 2:5":"For there is one God, and one mediator between God and men, the man Christ Jesus,","web|Hebrews 1:2":"has at the end of these days spoken to us by his Son, whom he appointed heir of all things, through whom also he made the worlds.","web|John 12:48":"He who rejects me, and doesn’t receive my sayings, has one who judges him. The word that I spoke, the same will judge him in the last day.","web|Romans 10:17":"So faith comes by hearing, and hearing by the word of God.","web|Acts 2:1-4":"1 Now when the day of Pentecost had come, they were all with one accord in one place. 2 Suddenly there came from the sky a sound like the rushing of a mighty wind, and it filled all the house where they were sitting. 3 Tongues like fire appeared and were distributed to them, and one sat on each of them. 4 They were all filled with the Holy Spirit, and began to speak with other languages, as the Spirit gave them the ability to speak.","web|1 Corinthians 12:4-7":"4 Now there are various kinds of gifts, but the same Spirit. 5 There are various kinds of service, and the same Lord. 6 There are various kinds of workings, but the same God, who works all things in all. 7 But to each one is given the manifestation of the Spirit for the profit of all.","web|Romans 10:10":"For with the heart, one believes unto righteousness; and with the mouth confession is made unto salvation.","web|1 Corinthians 12:8-11":"8 For to one is given through the Spirit the word of wisdom, and to another the word of knowledge, according to the same Spirit; 9 to another faith, by the same Spirit; and to another gifts of healings, by the same Spirit; 10 and to another workings of miracles; and to another prophecy; and to another discerning of spirits; to another different kinds of languages; and to another the interpretation of languages. 11 But the one and the same Spirit works all of these, distributing to each one separately as he desires.","web|Matthew 24:13":"But he who endures to the end, the same will be saved.","web|Numbers 23:19":"God is not a man, that he should lie, nor the son of man, that he should repent. Has he said, and will he not do it? Or has he spoken, and will he not make it good?","web|2 Chronicles 13:5":"Ought you not to know that Yahweh, the God of Israel, gave the kingdom over Israel to David forever, even to him and to his sons by a covenant of salt?","web|Mark 16:17-20":"17 These signs will accompany those who believe: in my name they will cast out demons; they will speak with new languages; 18 they will take up serpents; and if they drink any deadly thing, it will in no way hurt them; they will lay hands on the sick, and they will recover. 19 So then the Lord, after he had spoken to them, was received up into heaven, and sat down at the right hand of God. 20 They went out, and preached everywhere, the Lord working with them, and confirming the word by the signs that followed. Amen.","web|Hebrews 12:2":"looking to Jesus, the author and perfecter of faith, who for the joy that was set before him endured the cross, despising its shame, and has sat down at the right hand of the throne of God.","web|Galatians 3:23-24":"23 But before faith came, we were kept in custody under the law, confined for the faith which should afterwards be revealed. 24 So that the law has become our tutor to bring us to Christ, that we might be justified by faith.","web|Ephesians 1:22-23":"He put all things in subjection under his feet, and gave him to be head over all things for the assembly, which is his body, the fullness of him who fills all in all.","web|John 15:5":"I am the vine. You are the branches. He who remains in me, and I in him, the same bears much fruit, for apart from me you can do nothing.","web|Hebrews 10:25":"not forsaking our own assembling together, as the custom of some is, but exhorting one another; and so much the more, as you see the Day approaching.","web|1 Corinthians 12:27":"Now you are the body of Christ, and members individually.","web|Acts 20:28":"Take heed, therefore, to yourselves, and to all the flock, in which the Holy Spirit has made you overseers, to shepherd the assembly of the Lord and God which he purchased with his own blood.","web|Romans 12:1":"Therefore I urge you, brothers, by the mercies of God, to present your bodies a living sacrifice, holy, acceptable to God, which is your spiritual service.","web|Romans 12:10-13":"10 In love of the brothers be tenderly affectionate one to another; in honor preferring one another; 11 not lagging in diligence; fervent in spirit; serving the Lord; 12 rejoicing in hope; enduring in troubles; continuing steadfastly in prayer; 13 contributing to the needs of the saints; given to hospitality.","web|1 Peter 4:10":"As each has received a gift, employ it in serving one another, as good managers of the grace of God in its various forms.","web|2 Timothy 4:2-5":"2 preach the word; be urgent in season and out of season; reprove, rebuke, and exhort, with all patience and teaching. 3 For the time will come when they will not listen to the sound doctrine, but, having itching ears, will heap up for themselves teachers after their own lusts; 4 and will turn away their ears from the truth, and turn aside to fables. 5 But you be sober in all things, suffer hardship, do the work of an evangelist, and fulfill your ministry.","web|1 Corinthians 4:17":"Because of this I have sent Timothy to you, who is my beloved and faithful child in the Lord, who will remind you of my ways which are in Christ, even as I teach everywhere in every assembly.","web|Colossians 1:24":"Now I rejoice in my sufferings for your sake, and fill up on my part that which is lacking of the afflictions of Christ in my flesh for his body’s sake, which is the assembly;","web|1 Corinthians 3:16":"Don’t you know that you are a temple of God, and that God’s Spirit lives in you?","web|Matthew 16:16-18":"16 Simon Peter answered, “You are the Christ, the Son of the living God.” 17 Jesus answered him, “Blessed are you, Simon Bar Jonah, for flesh and blood has not revealed this to you, but my Father who is in heaven. 18 I also tell you that you are Peter,and on this rock I will build my assembly, and the gates of Hadeswill not prevail against it.”","web|John 15:1-8":"1 “I am the true vine, and my Father is the farmer. 2 Every branch in me that doesn’t bear fruit, he takes away. Every branch that bears fruit, he prunes, that it may bear more fruit. 3 You are already pruned clean because of the word which I have spoken to you. 4 Remain in me, and I in you. As the branch can’t bear fruit by itself, unless it remains in the vine, so neither can you, unless you remain in me. 5 I am the vine. You are the branches. He who remains in me, and I in him, the same bears much fruit, for apart from me you can do nothing. 6 If a man doesn’t remain in me, he is thrown out as a branch, and is withered; and they gather them, throw them into the fire, and they are burned. 7 If you remain in me, and my words remain in you, you will ask whatever you desire, and it will be done for you. 8 “In this is my Father glorified, that you bear much fruit; and so you will be my disciples.””","web|Acts 20:28-31":"28 Take heed, therefore, to yourselves, and to all the flock, in which the Holy Spirit has made you overseers, to shepherd the assembly of the Lord and God which he purchased with his own blood. 29 For I know that after my departure, vicious wolves will enter in among you, not sparing the flock. 30 Men will arise from among your own selves, speaking perverse things, to draw away the disciples after them. 31 Therefore watch, remembering that for a period of three years I didn’t cease to admonish everyone night and day with tears.","web|Matthew 28:19-20":"19 Go,and make disciples of all nations, baptizing them in the name of the Father and of the Son and of the Holy Spirit, 20 teaching them to observe all things that I commanded you. Behold, I am with you always, even to the end of the age. Amen.","web|Acts 13:1-3":"1 Now in the assembly that was at Antioch there were some prophets and teachers: Barnabas, Simeon who was called Niger, Lucius of Cyrene, Manaen the foster brother of Herod the tetrarch, and Saul. 2 As they served the Lord and fasted, the Holy Spirit said, “Separate Barnabas and Saul for me, for the work to which I have called them.” 3 Then, when they had fasted and prayed and laid their hands on them, they sent them away.","web|Ephesians 4:12":"for the perfecting of the saints, to the work of serving, to the building up of the body of Christ;","web|Ephesians 1:23":"which is his body, the fullness of him who fills all in all.","web|1 Corinthians 1:2":"to the assembly of God which is at Corinth; those who are sanctified in Christ Jesus, called to be saints, with all who call on the name of our Lord Jesus Christ in every place, both theirs and ours:","web|2 Corinthians 1:1":"Paul, an apostle of Christ Jesus through the will of God, and Timothy our brother, to the assembly of God which is at Corinth, with all the saints who are in the whole of Achaia:","web|Matthew 18:15-19":"15 “If your brother sins against you, go, show him his fault between you and him alone. If he listens to you, you have gained back your brother. 16 But if he doesn’t listen, take one or two more with you, that at the mouth of two or three witnesses every word may be established. 17 If he refuses to listen to them, tell it to the assembly. If he refuses to hear the assembly also, let him be to you as a Gentile or a tax collector. 18 Most certainly I tell you, whatever things you bind on earth will have been bound in heaven, and whatever things you release on earth will have been released in heaven. 19 Again, assuredly I tell you, that if two of you will agree on earth concerning anything that they will ask, it will be done for them by my Father who is in heaven.”","web|Ephesians 5:30":"because we are members of his body, of his flesh and bones.","web|1 Timothy 3:15":"but if I wait long, that you may know how men ought to behave themselves in God’s house, which is the assembly of the living God, the pillar and ground of the truth.","web|Matthew 17:20":"He said to them, “Because of your unbelief. For most certainly I tell you, if you have faith as a grain of mustard seed, you will tell this mountain, ‘Move from here to there,’ and it will move; and nothing will be impossible for you.”","web|Matthew 13:31-32":"31 He set another parable before them, saying, “The Kingdom of Heaven is like a grain of mustard seed, which a man took, and sowed in his field; 32 which indeed is smaller than all seeds. But when it is grown, it is greater than the herbs, and becomes a tree, so that the birds of the air come and lodge in its branches.”","web|Luke 17:6":"The Lord said, “If you had faith like a grain of mustard seed, you would tell this sycamore tree, ‘Be uprooted, and be planted in the sea,’ and it would obey you.”","web|Mark 4:30-32":"30 He said, “How will we liken the Kingdom of God? Or with what parable will we illustrate it? 31 It’s like a grain of mustard seed, which, when it is sown in the earth, though it is less than all the seeds that are on the earth, 32 yet when it is sown, grows up, and becomes greater than all the herbs, and puts out great branches, so that the birds of the sky can lodge under its shadow.”","web|John 3:3-7":"3 Jesus answered him, “Most certainly, I tell you, unless one is born anew, he can’t see the Kingdom of God.” 4 Nicodemus said to him, “How can a man be born when he is old? Can he enter a second time into his mother’s womb, and be born?” 5 Jesus answered, “Most certainly I tell you, unless one is born of water and spirit, he can’t enter into the Kingdom of God! 6 That which is born of the flesh is flesh. That which is born of the Spirit is spirit. 7 Don’t marvel that I said to you, ‘You must be born anew.’”","web|1 Peter 1:23":"having been born again, not of corruptible seed, but of incorruptible, through the word of God, which lives and remains forever.","web|John 1:12-13":"12 But as many as received him, to them he gave the right to become God’s children, to those who believe in his name: 13 who were born not of blood, nor of the will of the flesh, nor of the will of man, but of God.","web|Romans 6:23":"For the wages of sin is death, but the free gift of God is eternal life in Christ Jesus our Lord.","web|1 John 3:4":"Everyone who sins also commits lawlessness. Sin is lawlessness.","web|Matthew 7:13-14":"13 “Enter in by the narrow gate; for wide is the gate and broad is the way that leads to destruction, and many are those who enter in by it. 14 Hownarrow is the gate, and restricted is the way that leads to life! Few are those who find it.”","web|Luke 13:24":"“Strive to enter in by the narrow door, for many, I tell you, will seek to enter in, and will not be able.”","web|Luke 15:11-32":"11 He said, “A certain man had two sons. 12 The younger of them said to his father, ‘Father, give me my share of your property.’ He divided his livelihood between them. 13 Not many days after, the younger son gathered all of this together and traveled into a far country. There he wasted his property with riotous living. 14 When he had spent all of it, there arose a severe famine in that country, and he began to be in need. 15 He went and joined himself to one of the citizens of that country, and he sent him into his fields to feed pigs. 16 He wanted to fill his belly with the husks that the pigs ate, but no one gave him any. 17 But when he came to himself he said, ‘How many hired servants of my father’s have bread enough to spare, and I’m dying with hunger! 18 I will get up and go to my father, and will tell him, “Father, I have sinned against heaven, and in your sight. 19 I am no more worthy to be called your son. Make me as one of your hired servants.”’ 20 “He arose, and came to his father. But while he was still far off, his father saw him, and was moved with compassion, and ran, and fell on his neck, and kissed him. 21 The son said to him, ‘Father, I have sinned against heaven, and in your sight. I am no longer worthy to be called your son.’ 22 “But the father said to his servants, ‘Bring out the best robe, and put it on him. Put a ring on his hand, and shoes on his feet. 23 Bring the fattened calf, kill it, and let us eat, and celebrate; 24 for this, my son, was dead, and is alive again. He was lost, and is found.’ They began to celebrate. 25 “Now his elder son was in the field. As he came near to the house, he heard music and dancing. 26 He called one of the servants to him, and asked what was going on. 27 He said to him, ‘Your brother has come, and your father has killed the fattened calf, because he has received him back safe and healthy.’ 28 But he was angry, and would not go in. Therefore his father came out, and begged him. 29 But he answered his father, ‘Behold, these many years I have served you, and I never disobeyed a commandment of yours, but you never gave me a goat, that I might celebrate with my friends. 30 But when this, your son, came, who has devoured your living with prostitutes, you killed the fattened calf for him.’ 31 “He said to him, ‘Son, you are always with me, and all that is mine is yours. 32 But it was appropriate to celebrate and be glad, for this, your brother, was dead, and is alive again. He was lost, and is found.’”””””","web|John 10:11-16":"11 I am the good shepherd.The good shepherd lays down his life for the sheep. 12 He who is a hired hand, and not a shepherd, who doesn’t own the sheep, sees the wolf coming, leaves the sheep, and flees. The wolf snatches the sheep, and scatters them. 13 The hired hand flees because he is a hired hand, and doesn’t care for the sheep. 14 I am the good shepherd. I know my own, and I’m known by my own; 15 even as the Father knows me, and I know the Father. I lay down my life for the sheep. 16 I have other sheep, which are not of this fold.I must bring them also, and they will hear my voice. They will become one flock with one shepherd.","web|Psalms 23":"1 Yahweh is my shepherd: I shall lack nothing. 2 He makes me lie down in green pastures. He leads me beside still waters. 3 He restores my soul. He guides me in the paths of righteousness for his name’s sake. 4 Even though I walk through the valley of the shadow of death, I will fear no evil, for you are with me. Your rod and your staff, they comfort me. 5 You prepare a table before me in the presence of my enemies. You anoint my head with oil. My cup runs over. 6 Surely goodness and loving kindness shall follow me all the days of my life, and I will dwell in Yahweh’s house forever.","web|John 4:13-14":"13 Jesus answered her, “Everyone who drinks of this water will thirst again, 14 but whoever drinks of the water that I will give him will never thirst again; but the water that I will give him will become in him a well of water springing up to eternal life.”","web|John 7:37-38":"37 Now on the last and greatest day of the feast, Jesus stood and cried out, “If anyone is thirsty, let him come to me and drink! 38 He who believes in me, as the Scripture has said, from within him will flow rivers of living water.”","web|Revelation 22:17":"The Spirit and the bride say, “Come!” He who hears, let him say, “Come!” He who is thirsty, let him come. He who desires, let him take the water of life freely.","web|John 6:48-51":"48 I am the bread of life. 49 Your fathers ate the manna in the wilderness, and they died. 50 This is the bread which comes down out of heaven, that anyone may eat of it and not die. 51 I am the living bread which came down out of heaven. If anyone eats of this bread, he will live forever. Yes, the bread which I will give for the life of the world is my flesh.","web|John 8:12":"Again, therefore, Jesus spoke to them, saying, “I am the light of the world.He who follows me will not walk in the darkness, but will have the light of life.”","web|Matthew 5:14-16":"14 You are the light of the world. A city located on a hill can’t be hidden. 15 Neither do you light a lamp, and put it under a measuring basket, but on a stand; and it shines to all who are in the house. 16 Even so, let your light shine before men; that they may see your good works, and glorify your Father who is in heaven.","web|John 14:6":"Jesus said to him, “I am the way, the truth, and the life. No one comes to the Father, except through me.”","web|Acts 4:12":"There is salvation in none other, for neither is there any other name under heaven, that is given among men, by which we must be saved!","web|Matthew 6:14-15":"14 “For if you forgive men their trespasses, your heavenly Father will also forgive you. 15 But if you don’t forgive men their trespasses, neither will your Father forgive your trespasses.”","web|Acts 3:19":"“Repent therefore, and turn again, that your sins may be blotted out, so that there may come times of refreshing from the presence of the Lord,”","web|2 Corinthians 7:10":"For godly sorrow works repentance to salvation, which brings no regret. But the sorrow of the world works death.","web|Romans 6:3-4":"3 Or don’t you know that all we who were baptized into Christ Jesus were baptized into his death? 4 We were buried therefore with him through baptism to death, that just like Christ was raised from the dead through the glory of the Father, so we also might walk in newness of life.","web|Matthew 28:19":"Go,and make disciples of all nations, baptizing them in the name of the Father and of the Son and of the Holy Spirit,","web|Acts 19:6":"When Paul had laid his hands on them, the Holy Spirit came on them, and they spoke with other languages and prophesied.","web|1 Corinthians 12:4-11":"4 Now there are various kinds of gifts, but the same Spirit. 5 There are various kinds of service, and the same Lord. 6 There are various kinds of workings, but the same God, who works all things in all. 7 But to each one is given the manifestation of the Spirit for the profit of all. 8 For to one is given through the Spirit the word of wisdom, and to another the word of knowledge, according to the same Spirit; 9 to another faith, by the same Spirit; and to another gifts of healings, by the same Spirit; 10 and to another workings of miracles; and to another prophecy; and to another discerning of spirits; to another different kinds of languages; and to another the interpretation of languages. 11 But the one and the same Spirit works all of these, distributing to each one separately as he desires.","web|John 14:16-17":"16 I will pray to the Father, and he will give you another Counselor, that he may be with you forever,— 17 the Spirit of truth, whom the world can’t receive; for it doesn’t see him, neither knows him. You know him, for he lives with you, and will be in you.","web|1 Peter 2:24":"who his own self bore our sins in his body on the tree, that we, having died to sins, might live to righteousness; by whose stripes you were healed.","web|Psalms 22":"1 My God, my God, why have you forsaken me? Why are you so far from helping me, and from the words of my groaning? 2 My God, I cry in the daytime, but you don’t answer; in the night season, and am not silent. 3 But you are holy, you who inhabit the praises of Israel. 4 Our fathers trusted in you. They trusted, and you delivered them. 5 They cried to you, and were delivered. They trusted in you, and were not disappointed. 6 But I am a worm, and no man; a reproach of men, and despised by the people. 7 All those who see me mock me. They insult me with their lips. They shake their heads, saying, 8 “He trusts in Yahweh; let him deliver him. Let him rescue him, since he delights in him.” 9 But you brought me out of the womb. You made me trust at my mother’s breasts. 10 I was thrown on you from my mother’s womb. You are my God since my mother bore me. 11 Don’t be far from me, for trouble is near. For there is no one to help. 12 Many bulls have surrounded me. Strong bulls of Bashan have encircled me. 13 They open their mouths wide against me, lions tearing prey and roaring. 14 I am poured out like water. All my bones are out of joint. My heart is like wax; it is melted within me. 15 My strength is dried up like a potsherd. My tongue sticks to the roof of my mouth. You have brought me into the dust of death. 16 For dogs have surrounded me. A company of evildoers have enclosed me. They have pierced my hands and feet. 17 I can count all of my bones. They look and stare at me. 18 They divide my garments among them. They cast lots for my clothing. 19 But don’t be far off, Yahweh. You are my help: hurry to help me. 20 Deliver my soul from the sword, my precious life from the power of the dog. 21 Save me from the lion’s mouth! Yes, from the horns of the wild oxen, you have answered me. 22 I will declare your name to my brothers. In the midst of the assembly, I will praise you. 23 You who fear Yahweh, praise him! All you descendants of Jacob, glorify him! Stand in awe of him, all you descendants of Israel! 24 For he has not despised nor abhorred the affliction of the afflicted, Neither has he hidden his face from him; but when he cried to him, he heard. 25 Of you comes my praise in the great assembly. I will pay my vows before those who fear him. 26 The humble shall eat and be satisfied. They shall praise Yahweh who seek after him. Let your hearts live forever. 27 All the ends of the earth shall remember and turn to Yahweh. All the relatives of the nations shall worship before you. 28 For the kingdom is Yahweh’s. He is the ruler over the nations. 29 All the rich ones of the earth shall eat and worship. All those who go down to the dust shall bow before him, even he who can’t keep his soul alive. 30 Posterity shall serve him. Future generations shall be told about the Lord. 31 They shall come and shall declare his righteousness to a people that shall be born, for he has done it.","web|1 Corinthians 15:3-8":"3 For I delivered to you first of all that which I also received: that Christ died for our sins according to the Scriptures, 4 that he was buried, that he was raised on the third day according to the Scriptures, 5 and that he appeared to Cephas, then to the twelve. 6 Then he appeared to over five hundred brothers at once, most of whom remain until now, but some have also fallen asleep. 7 Then he appeared to James, then to all the apostles, 8 and last of all, as to the child born at the wrong time, he appeared to me also.","web|Revelation 20:4-6":"4 I saw thrones, and they sat on them, and judgment was given to them. I saw the souls of those who had been beheaded for the testimony of Jesus, and for the word of God, and such as didn’t worship the beast nor his image, and didn’t receive the mark on their forehead and on their hand. They lived, and reigned with Christ for a thousand years. 5 The rest of the dead didn’t live until the thousand years were finished. This is the first resurrection. 6 Blessed and holy is he who has part in the first resurrection. Over these, the second death has no power, but they will be priests of God and of Christ, and will reign with him one thousand years.","web|Matthew 24:30":"and then the sign of the Son of Man will appear in the sky. Then all the tribes of the earth will mourn, and they will see the Son of Man coming on the clouds of the sky with power and great glory.","web|1 Thessalonians 4:16-17":"16 For the Lord himself will descend from heaven with a shout, with the voice of the archangel, and with God’s trumpet. The dead in Christ will rise first, 17 then we who are alive, who are left, will be caught up together with them in the clouds, to meet the Lord in the air. So we will be with the Lord forever.","web|Revelation 22:12":"“Behold, I come quickly. My reward is with me, to repay to each man according to his work.”","web|Revelation 21:1-4":"1 I saw a new heaven and a new earth: for the first heaven and the first earth have passed away, and the sea is no more. 2 I saw the holy city, New Jerusalem, coming down out of heaven from God, prepared like a bride adorned for her husband. 3 I heard a loud voice out of heaven saying, “Behold, God’s dwelling is with people, and he will dwell with them, and they will be his people, and God himself will be with them as their God. 4 He will wipe away from them every tear from their eyes. Death will be no more; neither will there be mourning, nor crying, nor pain, any more. The first things have passed away.”","web|Revelation 21:10":"He carried me away in the Spirit to a great and high mountain, and showed me the holy city, Jerusalem, coming down out of heaven from God,","web|Mark 9:47-48":"47 If your eye causes you to stumble, cast it out. It is better for you to enter into the Kingdom of God with one eye, rather than having two eyes to be cast into the Gehennaof fire, 48 ‘where their worm doesn’t die, and the fire is not quenched.’","web|1 Thessalonians 5:23":"May the God of peace himself sanctify you completely. May your whole spirit, soul, and body be preserved blameless at the coming of our Lord Jesus Christ.","web|Hebrews 4:12":"For the word of God is living, and active, and sharper than any two-edged sword, and piercing even to the dividing of soul and spirit, of both joints and marrow, and is able to discern the thoughts and intentions of the heart.","web|Hebrews 9:27":"Inasmuch as it is appointed for men to die once, and after this, judgment,","web|Luke 16:19-31":"19 “Now there was a certain rich man, and he was clothed in purple and fine linen, living in luxury every day. 20 A certain beggar, named Lazarus, was laid at his gate, full of sores, 21 and desiring to be fed with the crumbs that fell from the rich man’s table. Yes, even the dogs came and licked his sores. 22 The beggar died, and he was carried away by the angels to Abraham’s bosom. The rich man also died, and was buried. 23 In Hades, he lifted up his eyes, being in torment, and saw Abraham far off, and Lazarus at his bosom. 24 He cried and said, ‘Father Abraham, have mercy on me, and send Lazarus, that he may dip the tip of his finger in water, and cool my tongue! For I am in anguish in this flame.’ 25 “But Abraham said, ‘Son, remember that you, in your lifetime, received your good things, and Lazarus, in the same way, bad things. But now here he is comforted and you are in anguish. 26 Besides all this, between us and you there is a great gulf fixed, that those who want to pass from here to you are not able, and that no one may cross over from there to us.’ 27 “He said, ‘I ask you therefore, father, that you would send him to my father’s house; 28 for I have five brothers, that he may testify to them, so they won’t also come into this place of torment.’ 29 “But Abraham said to him, ‘They have Moses and the prophets. Let them listen to them.’ 30 “He said, ‘No, father Abraham, but if one goes to them from the dead, they will repent.’ 31 “He said to him, ‘If they don’t listen to Moses and the prophets, neither will they be persuaded if one rises from the dead.’””””””","web|1 Corinthians 15:26":"The last enemy that will be abolished is death.","web|Genesis 1:1":"In the beginning, God created the heavens and the earth.","web|John 1:1-3":"1 In the beginning was the Word, and the Word was with God, and the Word was God. 2 The same was in the beginning with God. 3 All things were made through him. Without him was not anything made that has been made.","web|1 Corinthians 13:4-7":"4 Love is patient and is kind; love doesn’t envy. Love doesn’t brag, is not proud, 5 doesn’t behave itself inappropriately, doesn’t seek its own way, is not provoked, takes no account of evil; 6 doesn’t rejoice in unrighteousness, but rejoices with the truth ntos ardiendo serán deshechos, y la tierra y las obras que en ella están serán quemadas.","rv|Matthew 25:41":"Entonces dirá también á los que estarán á la izquierda: Apartaos de mí, malditos, al fuego eterno preparado para el diablo y para sus ángeles:","rv|Revelation 20:14-15":"14 Y el infierno y la muerte fueron lanzados en el lago de fuego. Esta es la muerte segunda. 15 Y el que no fué hallado escrito en el libro de la vida, fué lanzado en el lago de fuego.","rv|Genesis 2:7":"Formó, pues, Jehová Dios al hombre del polvo de la tierra, y alentó en su nariz soplo de vida; y fué el hombre en alma viviente.","rv|Matthew 10:28":"Y no temáis á los que matan el cuerpo, mas al alma no pueden matar: temed antes á aquel que puede destruir el alma y el cuerpo en el infierno.","rv|Mark 8:36":"Porque ¿qué aprovechará al hombre, si granjeare todo el mundo, y pierde su alma?","rv|Matthew 6:25-33":"25 Por tanto os digo: No os congojéis por vuestra vida, qué habéis de comer, ó qué habéis de beber; ni por vuestro cuerpo, qué habéis de vestir: ¿no es la vida más que el alimento, y el cuerpo que el vestido? 26 Mirad las aves del cielo, que no siembran, ni siegan, ni allegan en alfolíes; y vuestro Padre celestial las alimenta. ¿No sois vosotros mucho mejores que ellas? 27 Mas ¿quién de vosotros podrá, congojándose, añadir á su estatura un codo? 28 Y por el vestido ¿por qué os congojáis? Reparad los lirios del campo, cómo crecen; no trabajan ni hilan; 29 Mas os digo, que ni aun Salomón con toda su gloria fué vestido así como uno de ellos. 30 Y si la hierba del campo que hoy es, y mañana es echada en el horno, Dios la viste así, ¿no hará mucho más á vosotros, hombres de poca fe? 31 No os congojéis pues, diciendo: ¿Qué comeremos, ó qué beberemos, ó con qué nos cubriremos? 32 Porque los Gentiles buscan todas estas cosas: que vuestro Padre celestial sabe que de todas estas cosas habéis menester. 33 Mas buscad primeramente el reino de Dios y su justicia, y todas estas cosas os serán añadidas.","rv|John 6:63":"El espíritu es el que da vida; la carne nada aprovecha: las palabras que yo os he hablado, son espíritu, y son vida.","rv|Luke 9:59-62":"59 Y dijo á otro: Sígueme. Y él dijo: Señor, déjame que primero vaya y entierre á mi padre. 60 Y Jesús le dijo: Deja los muertos que entierren á sus muertos; y tú, ve, y anuncia el reino de Dios. 61 Entonces también dijo otro: Te seguiré, Señor; mas déjame que me despida primero de los que están en mi casa. 62 Y Jesús le dijo: Ninguno que poniendo su mano al arado mira atrás, es apto para el reino de Dios.","rv|Romans 8:12-13":"12 Así que, hermanos, deudores somos, no á la carne, para que vivamos conforme á la carne: 13 Porque si viviereis conforme á la carne, moriréis; mas si por el espíritu mortificáis las obras de la carne, viviréis.","rv|Psalms 1:1":"BIENAVENTURADO el varón que no anduvo en consejo de malos, ni estuvo en camino de pecadores, ni en silla de escarnecedores se ha sentado;","rv|1 John 2:16":"Porque todo lo que hay en el mundo, la concupiscencia de la carne, y la concupiscencia de los ojos, y la soberbia de la vida, no es del Padre, mas es del mundo.","rv|Matthew 4:4":"Mas él respondiendo, dijo: Escrito está: No con solo el pan vivirá el hombre, mas con toda palabra que sale de la boca de Dios.","rv|Genesis 1:27":"Y crió Dios al hombre á su imagen, á imagen de Dios lo crió; varón y hembra los crió.","rv|Luke 8:26-31":"26 Y navegaron á la tierra de los Gadarenos, que está delante de Galilea. 27 Y saliendo él á tierra, le vino al encuentro de la ciudad un hombre que tenía demonios ya de mucho tiempo; y no vestía vestido, ni estaba en casa, sino por los sepulcros. 28 El cual, como vió á Jesús, exclamó y se postró delante de él, y dijo á gran voz: ¿Qué tengo yo contigo, Jesús, Hijo del Dios Altísimo? Ruégote que no me atormentes. 29 (Porque mandaba al espíritu inmundo que saliese del hombre: porque ya de mucho tiempo le arrebataba; y le guardaban preso con cadenas y grillos; mas rompiendo las prisiones, era agitado del demonio por los desiertos.) 30 Y le preguntó Jesús, diciendo: ¿Qué nombre tienes? Y él dijo: Legión. Porque muchos demonios habían entrado en él. 31 Y le rogaban que no les mandase ir al abismo.","rv|1 Corinthians 15:23":"Mas cada uno en su orden: Cristo las primicias; luego los que son de Cristo, en su venida.","rv|Revelation 20:4-5":"4 Y vi tronos, y se sentaron sobre ellos, y les fué dado juicio; y vi las almas de los degollados por el testimonio de Jesús, y por la palabra de Dios, y que no habían adorado la bestia, ni á su imagen, y que no recibieron la señal en sus frentes, ni en sus manos; y vivieron y reinaron con Cristo mil años. 5 Mas los otros muertos no tornaron á vivir hasta que sean cumplidos mil años. Esta es la primera resurrección.","rv|Revelation 20:12-15":"12 Y vi los muertos, grandes y pequeños, que estaban delante de Dios; y los libros fueron abiertos: y otro libro fué abierto, el cual es de la vida: y fueron juzgados los muertos por las cosas que estaban escritas en los libros, según sus obras. 13 Y el mar dió los muertos que estaban en él; y la muerte y el infierno dieron los muertos que estaban en ellos; y fué hecho juicio de cada uno según sus obras. 14 Y el infierno y la muerte fueron lanzados en el lago de fuego. Esta es la muerte segunda. 15 Y el que no fué hallado escrito en el libro de la vida, fué lanzado en el lago de fuego.","rv|Acts 3:15":"Y matasteis al Autor de la vida, al cual Dios ha resucitado de los muertos; de lo que nosotros somos testigos.","rv|John 1:4":"En él estaba la vida, y la vida era la luz de los hombres.","rv|John 12:50":"Y sé que su mandamiento es vida eterna: así que, lo que yo hablo, como el Padre me lo ha dicho, así hablo.","rv|Romans 3:23":"Por cuanto todos pecaron, y están destituídos de la gloria de Dios;","rv|Genesis 2:17":"Mas del árbol de ciencia del bien y del mal no comerás de él; porque el día que de él comieres, morirás.","rv|Genesis 3:12":"Y el hombre respondió: La mujer que me diste por compañera me dió del árbol, y yo comí.","rv|Genesis 3:19":"En el sudor de tu rostro comerás el pan hasta que vuelvas á la tierra; porque de ella fuiste tomado: pues polvo eres, y al polvo serás tornado.","rv|Isaiah 59:2":"Mas vuestras iniquidades han hecho división entre vosotros y vuestro Dios, y vuestros pecados han hecho ocultar su rostro de vosotros, para no oir.","rv|1 John 1:9":"Si confesamos nuestros pecados, él es fiel y justo para que nos perdone nuestros pecados, y nos limpie de toda maldad.","rv|1 John 3:8":"El que hace pecado, es del diablo; porque el diablo peca desde el principio. Para esto apareció el Hijo de Dios, para deshacer las obras del diablo.","rv|Isaiah 14:12-15":"12 ¡Cómo caiste del cielo, oh Lucero, hijo de la mañana! Cortado fuiste por tierra, tú que debilitabas las gentes. 13 Tú que decías en tu corazón: Subiré al cielo, en lo alto junto á las estrellas de Dios ensalzaré mi solio, y en el monte del testimonio me sentaré, á los lados del aquilón; 14 Sobre las alturas de las nubes subiré, y seré semejante al Altísimo. 15 Mas tú derribado eres en el sepulcro, á los lados de la huesa.","rv|John 8:44":"Vosotros de vuestro padre el diablo sois, y los deseos de vuestro padre queréis cumplir. El, homicida ha sido desde el principio, y no permaneció en la verdad, porque no hay verdad en él. Cuando habla mentira, de suyo habla; porque es mentiroso, y padre de mentira.","rv|1 John 3:12":"No como Caín, que era del maligno, y mató á su hermano. ¿Y por qué causa le mató? Porque sus obras eran malas, y las de su hermano justas.","rv|Genesis 3:17":"Y al hombre dijo: Por cuanto obedeciste á la voz de tu mujer, y comiste del árbol de que te mandé diciendo, No comerás de él; maldita será la tierra por amor de ti; con dolor comerás de ella todos los días de tu vida;","rv|Genesis 4:8":"Y habló Caín á su hermano Abel: y aconteció que estando ellos en el campo, Caín se levantó contra su hermano Abel, y le mató.","rv|Revelation 12:9":"Y fué lanzado fuera aquel gran dragón, la serpiente antigua, que se llama Diablo y Satanás, el cual engaña á todo el mundo; fué arrojado en tierra, y sus ángeles fueron arrojados con él.","rv|Psalms 51:5":"He aquí, en maldad he sido formado, y en pecado me concibió mi madre.","rv|Romans 5:12-14":"12 De consiguiente, vino la reconciliación por uno, así como el pecado entró en el mundo por un hombre, y por el pecado la muerte, y la muerte así pasó á todos los hombres, pues que todos pecaron. 13 Porque hasta la ley, el pecado estaba en el mundo; pero no se imputa pecado no habiendo ley. 14 No obstante, reinó la muerte desde Adam hasta Moisés, aun en los que no pecaron á la manera de la rebelión de Adam; el cual es figura del que había de venir.","rv|Genesis 4:7":"Si bien hicieres, ¿no serás ensalzado? y si no hicieres bien, el pecado está á la puerta: con todo esto, á ti será su deseo, y tú te enseñorearás de él.","rv|Matthew 5:22":"Mas yo os digo, que cualquiera que se enojare locamente con su hermano, será culpado del juicio; y cualquiera que dijere á su hermano, Raca, será culpado del concejo; y cualquiera que dijere, Fatuo, será culpado del infierno del fuego.","rv|Romans 5:12":"De consiguiente, vino la reconciliación por uno, así como el pecado entró en el mundo por un hombre, y por el pecado la muerte, y la muerte así pasó á todos los hombres, pues que todos pecaron.","rv|Galatians 5:19-21":"19 Y manifiestas son las obras de la carne, que son: adulterio, fornicación, inmundicia, disolución, 20 Idolatría, hechicerías, enemistades, pleitos, celos, iras, contiendas, disensiones, herejías, 21 Envidias, homicidios, borracheras, banqueteos, y cosas semejantes á éstas: de las cuales os denuncio, como ya os he anunciado, que los que hacen tales cosas no heredarán el reino de Dios.","rv|2 Timothy 3:2-5":"2 Que habrá hombres amadores de sí mismos, avaros, vanagloriosos, soberbios, detractores, desobedientes á los padres, ingratos, sin santidad, 3 Sin afecto, desleales, calumniadores, destemplados, crueles, aborrecedores de lo bueno, 4 Traidores, arrebatados, hinchados, amadores de los deleites más que de Dios; 5 Teniendo apariencia de piedad, mas habiendo negado la eficacia de ella: y á éstos evita.","rv|Ephesians 1:7":"En el cual tenemos redención por su sangre, la remisión de pecados por las riquezas de su gracia,","rv|John 19:30":"Y como Jesús tomó el vinagre, dijo: Consumado es. Y habiendo inclinado la cabeza, dió el espíritu.","rv|Leviticus 6:7":"Y el sacerdote hará expiación por él delante de Jehová, y obtendrá perdón de cualquiera de todas las cosas en que suele ofender.","rv|Leviticus 4:27-28":"27 Y si alguna persona del común del pueblo pecare por yerro, haciendo algo contra alguno de los mandamientos de Jehová en cosas que no se han de hacer, y delinquiere; 28 Luego que le fuere conocido su pecado que cometió, traerá por su ofrenda una hembra de las cabras, una cabra sin defecto, por su pecado que habrá cometido:","rv|Leviticus 16:33-34":"33 Y expiará el santuario santo, y el tabernáculo del testimonio; expiará también el altar, y á los sacerdotes, y á todo el pueblo de la congregación. 34 Y esto tendréis por estatuto perpetuo, para expiar á los hijos de Israel de todos sus pecados una vez en el año. Y Moisés lo hizo como Jehová le mandó.","rv|Exodus 13:13":"Mas todo primogénito de asno redimirás con un cordero; y si no lo redimieres, le degollarás: asimismo redimirás todo humano primogénito de tus hijos.","rv|Exodus 12:3-13":"3 Hablad á toda la congregación de Israel, diciendo: En el diez de aqueste mes tómese cada uno un cordero por las familias de los padres, un cordero por familia: 4 Mas si la familia fuere pequeña que no baste á comer el cordero, entonces tomará á su vecino inmediato á su casa, y según el número de las personas, cada uno conforme á su comer, echaréis la cuenta sobre el cordero. 5 El cordero será sin defecto, macho de un año: tomaréislo de las ovejas ó de las cabras: 6 Y habéis de guardarlo hasta el día catorce de este mes; y lo inmolará toda la congregación del pueblo de Israel entre las dos tardes. 7 Y tomarán de la sangre, y pondrán en los dos postes y en el dintel de las casas en que lo han de comer. 8 Y aquella noche comerán la carne asada al fuego, y panes sin levadura: con hierbas amargas lo comerán. 9 Ninguna cosa comeréis de él cruda, ni cocida en agua, sino asada al fuego; su cabeza con sus pies y sus intestinos. 10 Ninguna cosa dejaréis de él hasta la mañana; y lo que habrá quedado hasta la mañana, habéis de quemarlo en el fuego. 11 Y así habéis de comerlo: ceñidos vuestros lomos, vuestros zapatos en vuestros pies, y vuestro bordón en vuestra mano; y lo comeréis apresuradamente: es la Pascua de Jehová. 12 Pues yo pasaré aquella noche por la tierra de Egipto, y heriré á todo primogénito en la tierra de Egipto, así en los hombres como en las bestias: y haré juicios en todos los dioses de Egipto. Yo JEHOVÁ. 13 Y la sangre os será por señal en las casas donde vosotros estéis; y veré la sangre, y pasaré de vosotros, y no habrá en vosotros plaga de mortandad, cuando heriré la tierra de Egipto.","rv|1 Peter 1:18-19":"Sabiendo que habéis sido rescatados de vuestra vana conversación, la cual recibisteis de vuestros padres, no con cosas corruptibles, como oro ó plata; Sino con la sangre preciosa de Cristo, como de un cordero sin mancha y sin contaminación:","rv|Exodus 30:10":"Y sobre sus cuernos hará Aarón expiación una vez en el año con la sangre de la expiación para las reconciliaciones: una vez en el año hará expiación sobre él en vuestras edades: será muy santo á Jehová.","rv|Leviticus 5:6":"Y para su expiación traerá á Jehová por su pecado que ha cometido, una hembra de los rebaños, una cordera ó una cabra como ofrenda de expiación; y el sacerdote hará expiación por él de su pecado.","rv|Isaiah 53:5":"Mas él herido fué por nuestras rebeliones, molido por nuestros pecados: el castigo de nuestra paz sobre él; y por su llaga fuimos nosotros curados.","rv|Hebrews 9:22":"Y casi todo es purificado según la ley con sangre; y sin derramamiento de sangre no se hace remisión.","rv|Romans 6:18":"Y libertados del pecado, sois hechos siervos de la justicia.","rv|Hebrews 9:18-22":"18 De donde vino que ni aun el primero fué consagrado sin sangre. 19 Porque habiendo leído Moisés todos los mandamientos de la ley á todo el pueblo, tomando la sangre de los becerros y de los machos cabríos, con agua, y lana de grana, é hisopo, roció al mismo libro, y también á todo el pueblo, 20 Diciendo: Esta es la sangre del testamento que Dios os ha mandado. 21 Y además de esto roció también con la sangre el tabernáculo y todos los vasos del ministerio. 22 Y casi todo es purificado según la ley con sangre; y sin derramamiento de sangre no se hace remisión.","rv|Leviticus 16:30":"Porque en este día se os reconciliará para limpiaros; y seréis limpios de todos vuestros pecados delante de Jehová.","rv|Leviticus 17:11":"Porque la vida de la carne en la sangre está: y yo os la he dado para expiar vuestras personas sobre el altar: por lo cual la misma sangre expiará la persona.","rv|Ephesians 5:2":"Y andad en amor, como también Cristo nos amó, y se entregó á sí mismo por nosotros, ofrenda y sacrificio á Dios en olor suave.","rv|John 6:35":"Y Jesús les dijo: Yo soy el pan de vida: el que á mí viene, nunca tendrá hambre; y el que en mí cree, no tendrá sed jamás.","rv|Romans 5:1":"JUSTIFICADOS pues por la fe, tenemos paz para con Dios por medio de nuestro Señor Jesucristo:","rv|Hebrews 13:11-12":"Porque los cuerpos de aquellos animales, la sangre de los cuales es metida por el pecado en el santuario por el pontífice, son quemados fuera del real. Por lo cual también Jesús, para santificar al pueblo por su propia sangre, padeció fuera de la puerta.","rv|Isaiah 53:10":"Con todo eso Jehová quiso quebrantarlo, sujetándole á padecimiento. Cuando hubiere puesto su vida en expiación por el pecado, verá linaje, vivirá por largos días, y la voluntad de Jehová será en su mano prosperada.","rv|Hebrews 9:12":"Y no por sangre de machos cabríos ni de becerros, mas por su propia sangre, entró una sola vez en el santuario, habiendo obtenido eterna redención.","rv|Hebrews 9:1-3":"1 TENÍA empero también el primer pacto reglamentos del culto, y santuario mundano. 2 Porque el tabernáculo fué hecho: el primero, en que estaban las lámparas, y la mesa, y los panes de la proposición; lo que llaman el Santuario. 3 Tras el segundo velo estaba el tabernáculo, que llaman el Lugar Santísimo;","rv|Hebrews 10:20":"Por el camino que él nos consagró nuevo y vivo, por el velo, esto es, por su carne;","rv|Hebrews 9:23":"Fué, pues, necesario que las figuras de las cosas celestiales fuesen purificadas con estas cosas; empero las mismas cosas celestiales con mejores sacrificios que éstos.","rv|Exodus 28:1":"Y TÚ allega á ti á Aarón tu hermano, y á sus hijos consigo, de entre los hijos de Israel, para que sean mis sacerdotes; á Aarón, Nadab y Abiú, Eleazar é Ithamar, hijos de Aarón.","rv|Hebrews 9:11":"Mas estando ya presente Cristo, pontífice de los bienes que habían de venir, por el más amplio y más perfecto tabernáculo, no hecho de manos, es á saber, no de esta creación;","rv|Hebrews 10:10":"En la cual voluntad somos santificados por la ofrenda del cuerpo de Jesucristo hecha una sola vez.","rv|2 Corinthians 5:21":"Al que no conoció pecado, hizo pecado por nosotros, para que nosotros fuésemos hechos justicia de Dios en él.","rv|Hebrews 9:11-12":"11 Mas estando ya presente Cristo, pontífice de los bienes que habían de venir, por el más amplio y más perfecto tabernáculo, no hecho de manos, es á saber, no de esta creación; 12 Y no por sangre de machos cabríos ni de becerros, mas por su propia sangre, entró una sola vez en el santuario, habiendo obtenido eterna redención.","rv|1 Corinthians 15:45":"Así también está escrito: Fué hecho el primer hombre Adam en ánima viviente; el postrer Adam en espíritu vivificante.","rv|Romans 5:18":"Así que, de la manera que por un delito vino la culpa á todos los hombres para condenación, así por una justicia vino la gracia á todos los hombres para justificación de vida.","rv|Deuteronomy 32:43":"Alabad, gentes, á su pueblo, porque él vengará la sangre de sus siervos, y volverá la venganza á sus enemigos, y expiará su tierra, á su pueblo.","rv|Leviticus 16:33":"Y expiará el santuario santo, y el tabernáculo del testimonio; expiará también el altar, y á los sacerdotes, y á todo el pueblo de la congregación.","rv|Leviticus 16:6":"Y hará allegar Aarón el becerro de la expiación, que es suyo, y hará la reconciliación por sí y por su casa.","rv|Hebrews 10:1-8":"1 PORQUE la ley, teniendo la sombra de los bienes venideros, no la imagen misma de las cosas, nunca puede, por los mismos sacrificios que ofrecen continuamente cada año, hacer perfectos á los que se allegan. 2 De otra manera cesarían de ofrecerse; porque los que tributan este culto, limpios de una vez, no tendrían más conciencia de pecado. 3 Empero en estos sacrificios cada año se hace conmemoración de los pecados. 4 Porque la sangre de los toros y de los machos cabríos no puede quitar los pecados. 5 Por lo cual, entrando en el mundo, dice: Sacrificio y presente no quisiste; mas me apropiaste cuerpo: 6 Holocaustos y expiaciones por el pecado no te agradaron. 7 Entonces dije: Heme aquí (en la cabecera del libro está escrito de mí) para que haga, oh Dios, tu voluntad. 8 Diciendo arriba: Sacrificio y presente, y holocaustos y expiaciones por el pecado no quisiste, ni te agradaron, (las cuales cosas se ofrecen según la ley,)","rv|Ephesians 2:8":"Porque por gracia sois salvos por la fe; y esto no de vosotros, pues es don de Dios:","rv|Romans 3:20":"Porque por las obras de la ley ninguna carne se justificará delante de él; porque por la ley es el conocimiento del pecado.","rv|Ephesians 2:8-9":"Porque por gracia sois salvos por la fe; y esto no de vosotros, pues es don de Dios: No por obras, para que nadie se gloríe.","rv|Romans 5:8":"Mas Dios encarece su caridad para con nosotros, porque siendo aún pecadores, Cristo murió por nosotros.","rv|Ephesians 1:6":"Para alabanza de la gloria de su gracia, con la cual nos hizo aceptos en el Amado:","rv|2 Corinthians 11:30":"Si es menester gloriarse, me gloriaré yo de lo que es de mi flaqueza.","rv|Matthew 8:4":"Entonces Jesús le dijo: Mira, no lo digas á nadie; mas ve, muéstrate al sacerdote, y ofrece el presente que mandó Moisés, para testimonio á ellos.","rv|Luke 8:38-39":"38 Y aquel hombre, de quien habían salido los demonios, le rogó para estar con él; mas Jesús le despidió, diciendo: 39 Vuélvete á tu casa, y cuenta cuán grandes cosas ha hecho Dios contigo. Y él se fué, publicando por toda la ciudad cuán grandes cosas había hecho Jesús con él.","rv|John 3:16":"Porque de tal manera amó Dios al mundo, que ha dado á su Hijo unigénito, para que todo aquel que en él cree, no se pierda, mas tenga vida eterna.","rv|Romans 3:19-20":"19 Empero sabemos que todo lo que la ley dice, á los que están en la ley lo dice, para que toda boca se tape, y que todo el mundo se sujete á Dios: 20 Porque por las obras de la ley ninguna carne se justificará delante de él; porque por la ley es el conocimiento del pecado.","rv|Hebrews 10:17-18":"17 Añade: Y nunca más me acordaré de sus pecados é iniquidades. 18 Pues donde hay remisión de éstos, no hay más ofrenda por pecado.","rv|1 Corinthians 15:56":"Ya que el aguijón de la muerte es el pecado, y la potencia del pecado, la ley.","rv|Ephesians 2:9":"No por obras, para que nadie se gloríe.","rv|2 Corinthians 5:17":"De modo que si alguno está en Cristo, nueva criatura es: las cosas viejas pasaron; he aquí todas son hechas nuevas.","rv|John 14:13":"Y todo lo que pidiereis al Padre en mi nombre, esto haré, para que el Padre sea glorificado en el Hijo.","rv|Romans 5:20":"La ley empero entró para que el pecado creciese; mas cuando el pecado creció, sobrepujó la gracia;","rv|Titus 2:11-12":"11 Porque la gracia de Dios que trae salvación á todos los hombres, se manifestó, 12 Enseñándonos que, renunciando á la impiedad y á los deseos mundanos, vivamos en este siglo templada, y justa, y píamente,","rv|Romans 7:12-13":"12 De manera que la ley á la verdad es santa, y el mandamiento santo, y justo, y bueno. 13 ¿Luego lo que es bueno, á mí me es hecho muerte? No; sino que el pecado, para mostrarse pecado, por lo bueno me obró la muerte, haciéndose pecado sobremanera pecante por el mandamiento.","rv|Romans 8:15":"Porque no habéis recibido el espíritu de servidumbre para estar otra vez en temor; mas habéis recibido el espíritu de adopción, por el cual clamamos, Abba, Padre.","rv|Luke 7:41-43":"41 Un acreedor tenía dos deudores: el uno le debía quinientos denarios, y el otro cincuenta; 42 Y no teniendo ellos de qué pagar, perdonó á ambos. Di, pues, ¿cuál de éstos le amará más? 43 Y respondiendo Simón, dijo: Pienso que aquél al cual perdonó más. Y él le dijo: Rectamente has juzgado.","rv|2 Corinthians 8:9":"Porque ya sabéis la gracia de nuestro Señor Jesucristo, que por amor de vosotros se hizo pobre, siendo rico; para que vosotros con su pobreza fueseis enriquecidos.","rv|Matthew 9:2":"Y he aquí le trajeron un paralítico, echado en una cama: y viendo Jesús la fe de ellos, dijo al paralítico: Confía, hijo; tus pecados te son perdonados.","rv|John 1:12":"Mas á todos los que le recibieron, dióles potestad de ser hechos hijos de Dios, á los que creen en su nombre:","rv|Acts 2:38":"Y Pedro les dice: Arrepentíos, y bautícese cada uno de vosotros en el nombre de Jesucristo para perdón de los pecados; y recibiréis el don del Espíritu Santo.","rv|Hebrews 11:1":"ES pues la fe la sustancia de las cosas que se esperan, la demostración de las cosas que no se ven.","rv|Mark 16:16":"El que creyere y fuere bautizado, será salvo; mas el que no creyere, será condenado.","rv|Acts 2:4":"Y fueron todos llenos del Espíritu Santo, y comenzaron á hablar en otras lenguas, como el Espíritu les daba que hablasen.","rv|1 John 3:20":"Porque si nuestro corazón nos reprendiere, mayor es Dios que nuestro corazón, y conoce todas las cosas.","rv|Revelation 1:8":"Yo soy el Alpha y la Omega, principio y fin, dice el Señor, que es y que era y que ha de venir, el Todopoderoso.","rv|Psalms 139:7-10":"7 ¿Adónde me iré de tu espíritu? ¿y adónde huiré de tu presencia? 8 Si subiere á los cielos, allí estás tú: y si en abismo hiciere mi estrado, he aquí allí tú estás. 9 Si tomare las alas del alba, y habitare en el extremo de la mar, 10 Aun allí me guiará tu mano, y me asirá tu diestra.","rv|Acts 17:24":"El Dios que hizo el mundo y todas las cosas que en él hay, éste, como sea Señor del cielo y de la tierra, no habita en templos hechos de manos,","rv|John 6:29":"Respondió Jesús, y díjoles: Esta es la obra de Dios, que creáis en el que él ha enviado.","rv|John 1:18":"A Dios nadie le vió jamás: el unigénito Hijo, que está en el seno del Padre, él le declaró.","rv|John 20:28":"Entonces Tomás respondió, y díjole: ¡Señor mío, y Dios mío!","rv|John 10:30":"Yo y el Padre una cosa somos.","rv|1 Timothy 2:5":"Porque hay un Dios, asimismo un mediador entre Dios y los hombres, Jesucristo hombre;","rv|Hebrews 1:2":"En estos postreros días nos ha hablado por el Hijo, al cual constituyó heredero de todo, por el cual asimismo hizo el universo:","rv|John 12:48":"El que me desecha, y no recibe mis palabras, tiene quien le juzgue: la palabra que he hablado, ella le juzgará en el día postrero.","rv|Romans 10:17":"Luego la fe es por el oir; y el oir por la palabra de Dios.","rv|Acts 2:1-4":"1 Y COMO se cumplieron los días de Pentecostés, estaban todos unánimes juntos; 2 Y de repente vino un estruendo del cielo como de un viento recio que corría, el cual hinchió toda la casa donde estaban sentados; 3 Y se les aparecieron lenguas repartidas, como de fuego, que se asentó sobre cada uno de ellos. 4 Y fueron todos llenos del Espíritu Santo, y comenzaron á hablar en otras lenguas, como el Espíritu les daba que hablasen.","rv|1 Corinthians 12:4-7":"4 Empero hay repartimiento de dones; mas el mismo Espíritu es. 5 Y hay repartimiento de ministerios; mas el mismo Señor es. 6 Y hay repartimiento de operaciones; mas el mismo Dios es el que obra todas las cosas en todos. 7 Empero á cada uno le es dada manifestación del Espíritu para provecho.","rv|Romans 10:10":"Porque con el corazón se cree para justicia; mas con la boca se hace confesión para salud.","rv|1 Corinthians 12:8-11":"8 Porque á la verdad, á éste es dada por el Espíritu palabra de sabiduría; á otro, palabra de ciencia según el mismo Espíritu; 9 A otro, fe por el mismo Espíritu; y á otro, dones de sanidades por el mismo Espíritu; 10 A otro, operaciones de milagros; y á otro, profecía; y á otro, discreción de espíritus; y á otro, géneros de lenguas; y á otro, interpretación de lenguas. 11 Mas todas estas cosas obra uno y el mismo Espíritu, repartiendo particularmente á cada uno como quiere.","rv|Matthew 24:13":"Mas el que perseverare hasta el fin, éste será salvo.","rv|Numbers 23:19":"Dios no es hombre, para que mienta; ni hijo de hombre para que se arrepienta: el dijo, ¿y no hará?; habló, ¿y no lo ejecutará?","rv|2 Chronicles 13:5":"¿No sabéis vosotros, que Jehová Dios de Israel dió el reino á David sobre Israel para siempre, á él y á sus hijos en alianza de sal?","rv|Mark 16:17-20":"17 Y estas señales seguirán á los que creyeren: En mi nombre echarán fuera demonios; hablarán nuevas lenguas; 18 Quitarán serpientes, y si bebieren cosa mortífera, no les dañará; sobre los enfermos pondrán sus manos, y sanarán. 19 Y el Señor, después que les habló, fué recibido arriba en el cielo, y sentóse á la diestra de Dios. 20 Y ellos, saliendo, predicaron en todas partes, obrando con ellos el Señor, y confirmando la palabra con las señales que se seguían. Amén.","rv|Hebrews 12:2":"Puestos los ojos en al autor y consumador de la fe, en Jesús; el cual, habiéndole sido propuesto gozo, sufrió la cruz, menospreciando la vergüenza, y sentóse á la diestra del trono de Dios.","rv|Galatians 3:23-24":"23 Empero antes que viniese la fe, estábamos guardados bajo la ley, encerrados para aquella fe que había de ser descubierta. 24 De manera que la ley nuestro ayo fué para llevarnos á Cristo, para que fuésemos justificados por la fe.","rv|Ephesians 1:22-23":"Y sometió todas las cosas debajo de sus pies, y diólo por cabeza sobre todas las cosas á la iglesia, La cual es su cuerpo, la plenitud de Aquel que hinche todas las cosas en todos.","rv|John 15:5":"Yo soy la vid, vosotros los pámpanos: el que está en mí, y yo en él, éste lleva mucho fruto; porque sin mí nada podéis hacer.","rv|Hebrews 10:25":"No dejando nuestra congregación, como algunos tienen por costumbre, mas exhortándonos; y tanto más, cuanto veis que aquel día se acerca.","rv|1 Corinthians 12:27":"Pues vosotros sois el cuerpo de Cristo, y miembros en parte.","rv|Acts 20:28":"Por tanto mirad por vosotros, y por todo el rebaño en que el Espíritu Santo os ha puesto por obispos, para apacentar la iglesia del Señor, la cual ganó por su sangre.","rv|Romans 12:1":"ASÍ que, hermanos, os ruego por las misericordias de Dios, que presentéis vuestros cuerpos en sacrificio vivo, santo, agradable á Dios, que es vuestro racional culto.","rv|Romans 12:10-13":"10 Amándoos los unos á los otros con caridad fraternal; previniéndoos con honra los unos á los otros; 11 En el cuidado no perezosos; ardientes en espíritu; sirviendo al Señor; 12 Gozosos en la esperanza; sufridos en la tribulación; constantes en la oración; 13 Comunicando á las necesidades de los santos; siguiendo la hospitalidad.","rv|1 Peter 4:10":"Cada uno según el don que ha recibido, adminístrelo á los otros, como buenos dispensadores de las diferentes gracias de Dios.","rv|2 Timothy 4:2-5":"2 Que prediques la palabra; que instes á tiempo y fuera de tiempo; redarguye, reprende, exhorta con toda paciencia y doctrina. 3 Porque vendrá tiempo cuando no sufrirán la sana doctrina; antes, teniendo comezón de oir, se amontonarán maestros conforme á sus concupiscencias, 4 Y apartarán de la verdad el oído, y se volverán á las fábulas. 5 Pero tú vela en todo, soporta las aflicciones, haz la obra de evangelista, cumple tu ministerio.","rv|1 Corinthians 4:17":"Por lo cual os he enviado á Timoteo, que es mi hijo amado y fiel en el Señor, el cual os amonestará de mis caminos cuáles sean en Cristo, de la manera que enseño en todas partes en todas las iglesias.","rv|Colossians 1:24":"Que ahora me gozo en lo que padezco por vosotros, y cumplo en mi carne lo que falta de las aflicciones de Cristo por su cuerpo, que es la iglesia;","rv|1 Corinthians 3:16":"¿No sabéis que sois templo de Dios, y que el Espíritu de Dios mora en vosotros?","rv|Matthew 16:16-18":"16 Y respondiendo Simón Pedro, dijo: Tú eres el Cristo, el Hijo del Dios viviente. 17 Entonces, respondiendo Jesús, le dijo: Bienaventurado eres, Simón, hijo de Jonás; porque no te lo reveló carne ni sangre, mas mi Padre que está en los cielos. 18 Mas yo también te digo, que tú eres Pedro, y sobre esta piedra edificaré mi iglesia; y las puertas del infierno no prevalecerán contra ella.","rv|John 15:1-8":"1 YO soy la vid verdadera, y mi Padre es el labrador. 2 Todo pámpano que en mí no lleva fruto, le quitará: y todo aquel que lleva fruto, le limpiará, para que lleve más fruto. 3 Ya vosotros sois limpios por la palabra que os he hablado. 4 Estad en mí, y yo en vosotros. Como el pámpano no puede llevar fruto de sí mismo, si no estuviere en la vid; así ni vosotros, si no estuviereis en mí. 5 Yo soy la vid, vosotros los pámpanos: el que está en mí, y yo en él, éste lleva mucho fruto; porque sin mí nada podéis hacer. 6 El que en mí no estuviere, será echado fuera como mal pámpano, y se secará; y los cogen, y los echan en el fuego, y arden. 7 Si estuviereis en mí, y mis palabras estuvieren en vosotros, pedid todo lo que quisiereis, y os será hecho. 8 En esto es glorificado mi Padre, en que llevéis mucho fruto, y seáis así mis discípulos.","rv|Acts 20:28-31":"28 Por tanto mirad por vosotros, y por todo el rebaño en que el Espíritu Santo os ha puesto por obispos, para apacentar la iglesia del Señor, la cual ganó por su sangre. 29 Porque yo sé que después de mi partida entrarán en medio de vosotros lobos rapaces, que no perdonarán al ganado; 30 Y de vosotros mismos se levantarán hombres que hablen cosas perversas, para llevar discípulos tras sí. 31 Por tanto, velad, acordándoos que por tres años de noche y de día, no he cesado de amonestar con lágrimas á cada uno.","rv|Matthew 28:19-20":"19 Por tanto, id, y doctrinad á todos los Gentiles, bautizándolos en el nombre del Padre, y del Hijo, y del Espíritu Santo: 20 Enseñándoles que guarden todas las cosas que os he mandado: y he aquí, yo estoy con vosotros todos los días, hasta el fin del mundo. Amén.","rv|Acts 13:1-3":"1 HABÍA entonces en la iglesia que estaba en Antioquía, profetas y doctores: Bernabé, y Simón el que se llamaba Niger, y Lucio Cireneo, y Manahén, que había sido criado con Herodes el tetrarca, y Saulo. 2 Ministrando pues éstos al Señor, y ayunando, dijo el Espíritu Santo: Apartadme á Bernabé y á Saulo para la obra para la cual los he llamado. 3 Entonces habiendo ayunado y orado, y puesto las manos encima de ellos, despidiéronlos.","rv|Ephesians 4:12":"Para perfección de los santos, para la obra del ministerio, para edificación del cuerpo de Cristo;","rv|Ephesians 1:23":"La cual es su cuerpo, la plenitud de Aquel que hinche todas las cosas en todos.","rv|1 Corinthians 1:2":"A la iglesia de Dios que está en Corinto, santificados en Cristo Jesús, llamados santos, y á todos los que invocan el nombre de nuestro Señor Jesucristo en cualquier lugar, Señor de ellos y nuestro:","rv|2 Corinthians 1:1":"PABLO, apóstol de Jesucristo por la voluntad de Dios, y Timoteo el hermano, á la iglesia de Dios que está en Corinto, juntamente con todos los santos que están por toda la Acaya:","rv|Matthew 18:15-19":"15 Por tanto, si tu hermano pecare contra ti, ve, y redargúyele entre ti y él solo: si te oyere, has ganado á tu hermano. 16 Mas si no te oyere, toma aún contigo uno ó dos, para que en boca de dos ó de tres testigos conste toda palabra. 17 Y si no oyere á ellos, dilo á la iglesia: y si no oyere á la iglesia, tenle por étnico y publicano. 18 De cierto os digo que todo lo que ligareis en la tierra, será ligado en el cielo; y todo lo que desatareis en la tierra, será desatado en el cielo. 19 Otra vez os digo, que si dos de vosotros se convinieren en la tierra, de toda cosa que pidieren, les será hecho por mi Padre que está en los cielos.","rv|Ephesians 5:30":"Porque somos miembros de su cuerpo, de su carne y de sus huesos.","rv|1 Timothy 3:15":"Y si no fuere tan presto, para que sepas cómo te conviene conversar en la casa de Dios, que es la iglesia del Dios vivo, columna y apoyo de la verdad.","rv|Matthew 17:20":"Y Jesús les dijo: Por vuestra incredulidad; porque de cierto os digo, que si tuviereis fe como un grano de mostaza, diréis á este monte: Pásate de aquí allá: y se pasará: y nada os será imposible.","rv|Matthew 13:31-32":"31 Otra parábola les propuso, diciendo: El reino de los cielos es semejante al grano de mostaza, que tomándolo alguno lo sembró en su campo: 32 El cual á la verdad es la más pequeña de todas las simientes; mas cuando ha crecido, es la mayor de las hortalizas, y se hace árbol, que vienen las aves del cielo y hacen nidos en sus ramas.","rv|Luke 17:6":"Entonces el Señor dijo: Si tuvieseis fe como un grano de mostaza, diréis á este sicómoro: Desarráigate, y plántate en el mar; y os obedecerá.","rv|Mark 4:30-32":"30 Y decía: ¿A qué haremos semejante el reino de Dios? ¿ó con qué parábola le compararemos? 31 Es como el grano de mostaza, que, cuando se siembra en tierra, es la más pequeña de todas las simientes que hay en la tierra; 32 Mas después de sembrado, sube, y se hace la mayor de todas las legumbres, y echa grandes ramas, de tal manera que las aves del cielo puedan morar bajo su sombra.","rv|John 3:3-7":"3 Respondió Jesús, y díjole: De cierto, de cierto te digo, que el que no naciere otra vez, no puede ver el reino de Dios. 4 Dícele Nicodemo: ¿Cómo puede el hombre nacer siendo viejo? ¿puede entrar otra vez en el vientre de su madre, y nacer? 5 Respondió Jesús: De cierto, de cierto te digo, que el que no naciere de agua y del Espíritu, no puede entrar en el reino de Dios. 6 Lo que es nacido de la carne, carne es; y lo que es nacido del Espíritu, espíritu es. 7 No te maravilles de que te dije: Os es necesario nacer otra vez.","rv|1 Peter 1:23":"Siendo renacidos, no de simiente corruptible, sino de incorruptible, por la palabra de Dios, que vive y permanece para siempre.","rv|John 1:12-13":"12 Mas á todos los que le recibieron, dióles potestad de ser hechos hijos de Dios, á los que creen en su nombre: 13 Los cuales no son engendrados de sangre, ni de voluntad de carne, ni de voluntad de varón, mas de Dios.","rv|Romans 6:23":"Porque la paga del pecado es muerte: mas la dádiva de Dios es vida eterna en Cristo Jesús Señor nuestro.","rv|1 John 3:4":"Cualquiera que hace pecado, traspasa también la ley; pues el pecado es transgresión de la ley.","rv|Matthew 7:13-14":"13 Entrad por la puerta estrecha: porque ancha es la puerta, y espacioso el camino que lleva á perdición, y muchos son los que entran por ella. 14 Porque estrecha es la puerta, y angosto el camino que lleva á la vida, y pocos son los que la hallan.","rv|Luke 13:24":"Porfiad á entrar por la puerta angosta; porque os digo que muchos procurarán entrar, y no podrán.","rv|Luke 15:11-32":"11 Y dijo: Un hombre tenía dos hijos; 12 Y el menor de ellos dijo á su padre: Padre, dame la parte de la hacienda que me pertenece: y les repartió la hacienda. 13 Y no muchos días después, juntándolo todo el hijo menor, partió lejos á una provincia apartada; y allí desperdició su hacienda viviendo perdidamente. 14 Y cuando todo lo hubo malgastado, vino una grande hambre en aquella provincia, y comenzóle á faltar. 15 Y fué y se llegó á uno de los ciudadanos de aquella tierra, el cual le envió á su hacienda para que apacentase los puercos. 16 Y deseaba henchir su vientre de las algarrobas que comían los puercos; mas nadie se las daba. 17 Y volviendo en sí, dijo: ¡Cuántos jornaleros en casa de mi padre tienen abundancia de pan, y yo aquí perezco de hambre! 18 Me levantaré, é iré á mi padre, y le diré: Padre, he pecado contra el cielo, y contra ti; 19 Ya no soy digno de ser llamado tu hijo; hazme como á uno de tus jornaleros. 20 Y levantándose, vino á su padre. Y como aun estuviese lejos, viólo su padre, y fué movido á misericordia, y corrió, y echóse sobre su cuello, y besóle. 21 Y el hijo le dijo: Padre, he pecado contra el cielo, y contra ti, y ya no soy digno de ser llamado tu hijo. 22 Mas el padre dijo á sus siervos: Sacad el principal vestido, y vestidle; y poned un anillo en su mano, y zapatos en sus pies. 23 Y traed el becerro grueso, y matadlo, y comamos, y hagamos fiesta: 24 Porque este mi hijo muerto era, y ha revivido; habíase perdido, y es hallado. Y comenzaron á regocijarse. 25 Y su hijo el mayor estaba en el campo; el cual como vino, y llegó cerca de casa, oyó la sinfonía y las danzas; 26 Y llamando á uno de los criados, preguntóle qué era aquello. 27 Y él le dijo: Tu hermano ha venido; y tu padre ha muerto el becerro grueso, por haberle recibido salvo. 28 Entonces se enojó, y no quería entrar. Salió por tanto su padre, y le rogaba que entrase. 29 Mas él respondiendo, dijo al padre: He aquí tantos años te sirvo, no habiendo traspasado jamás tu mandamiento, y nunca me has dado un cabrito para gozarme con mis amigos: 30 Mas cuando vino éste tu hijo, que ha consumido tu hacienda con rameras, has matado para él el becerro grueso. 31 El entonces le dijo: Hijo, tú siempre estás conmigo, y todas mis cosas son tuyas. 32 Mas era menester hacer fiesta y holgarnos, porque este tu hermano muerto era, y ha revivido; habíase perdido, y es hallado.","rv|John 10:11-16":"11 Yo soy el buen pastor: el buen pastor su vida da por las ovejas. 12 Mas el asalariado, y que no es el pastor, de quien no son propias las ovejas, ve al lobo que viene, y deja las ovejas, y huye, y el lobo las arrebata, y esparce las ovejas. 13 Así que, el asalariado, huye, porque es asalariado, y no tiene cuidado de las ovejas. 14 Yo soy el buen pastor; y conozco mis ovejas, y las mías me conocen. 15 Como el Padre me conoce, y yo conozco al Padre; y pongo mi vida por las ovejas. 16 También tengo otras ovejas que no son de este redil; aquéllas también me conviene traer, y oirán mi voz; y habrá un rebaño, y un pastor.","rv|Psalms 23":"1 JEHOVÁ es mi pastor; nada me faltará. 2 En lugares de delicados pastos me hará yacer: junto á aguas de reposo me pastoreará. 3 Confortará mi alma; guiaráme por sendas de justicia por amor de su nombre. 4 Aunque ande en valle de sombra de muerte, no temeré mal alguno; porque tú estarás conmigo: tu vara y tu cayado me infundirán aliento. 5 Aderezarás mesa delante de mí, en presencia de mis angustiadores: ungiste mi cabeza con aceite: mi copa está rebosando. 6 Ciertamente el bien y la misericordia me seguirán todos los días de mi vida: y en la casa de Jehová moraré por largos días.","rv|John 4:13-14":"13 Respondió Jesús y díjole: Cualquiera que bebiere de esta agua, volverá á tener sed; 14 Mas el que bebiere del agua que yo le daré, para siempre no tendrá sed: mas el agua que yo le daré, será en él una fuente de agua que salte para vida eterna.","rv|John 7:37-38":"37 Mas en el postrer día grande de la fiesta, Jesús se ponía en pie y clamaba, diciendo: Si alguno tiene sed, venga á mí y beba. 38 El que cree en mí, como dice la Escritura, ríos de agua viva correrán de su vientre.","rv|Revelation 22:17":"Y el Espíritu y la Esposa dicen: Ven. Y el que oye, diga: Ven. Y el que tiene sed, venga: y el que quiere, tome del agua de la vida de balde.","rv|John 6:48-51":"48 Yo soy el pan de vida. 49 Vuestros padres comieron el maná en el desierto, y son muertos. 50 Este es el pan que desciende del cielo, para que el que de él comiere, no muera. 51 Yo soy el pan vivo que he descendido del cielo: si alguno comiere de este pan, vivirá para siempre; y el pan que yo daré es mi carne, la cual yo daré por la vida del mundo.","rv|John 8:12":"Y hablóles Jesús otra vez, diciendo: Yo soy la luz del mundo: el que me sigue, no andará en tinieblas, mas tendrá la lumbre de la vida.","rv|Matthew 5:14-16":"14 Vosotros sois la luz del mundo: una ciudad asentada sobre un monte no se puede esconder. 15 Ni se enciende una lámpara y se pone debajo de un almud, mas sobre el candelero, y alumbra á todos los que están en casa. 16 Así alumbre vuestra luz delante de los hombres, para que vean vuestras obras buenas, y glorifiquen á vuestro Padre que está en los cielos.","rv|John 14:6":"Jesús le dice: Yo soy el camino, y la verdad, y la vida: nadie viene al Padre, sino por mí.","rv|Acts 4:12":"Y en ningún otro hay salud; porque no hay otro nombre debajo del cielo, dado á los hombres, en que podamos ser salvos.","rv|Matthew 6:14-15":"14 Porque si perdonareis á los hombres sus ofensas, os perdonará también á vosotros vuestro Padre celestial. 15 Mas si no perdonareis á los hombres sus ofensas, tampoco vuestro Padre os perdonará vuestras ofensas.","rv|Acts 3:19":"Así que, arrepentíos y convertíos, para que sean borrados vuestros pecados; pues que vendrán los tiempos del refrigerio de la presencia del Señor,","rv|2 Corinthians 7:10":"Porque el dolor que es según Dios, obra arrepentimiento saludable, de que no hay que arrepentirse; mas el dolor del siglo obra muerte.","rv|Romans 6:3-4":"3 ¿O no sabéis que todos los que somos bautizados en Cristo Jesús, somos bautizados en su muerte? 4 Porque somos sepultados juntamente con él á muerte por el bautismo; para que como Cristo resucitó de los muertos por la gloria del Padre, así también nosotros andemos en novedad de vida.","rv|Matthew 28:19":"Por tanto, id, y doctrinad á todos los Gentiles, bautizándolos en el nombre del Padre, y del Hijo, y del Espíritu Santo:"
