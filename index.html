,"rv|Acts 19:6":"Y habiéndoles impuesto Pablo las manos, vino sobre ellos el Espíritu Santo; y hablaban en lenguas, y profetizaban.","rv|1 Corinthians 12:4-11":"4 Empero hay repartimiento de dones; mas el mismo Espíritu es. 5 Y hay repartimiento de ministerios; mas el mismo Señor es. 6 Y hay repartimiento de operaciones; mas el mismo Dios es el que obra todas las cosas en todos. 7 Empero á cada uno le es dada manifestación del Espíritu para provecho. 8 Porque á la verdad, á éste es dada por el Espíritu palabra de sabiduría; á otro, palabra de ciencia según el mismo Espíritu; 9 A otro, fe por el mismo Espíritu; y á otro, dones de sanidades por el mismo Espíritu; 10 A otro, operaciones de milagros; y á otro, profecía; y á otro, discreción de espíritus; y á otro, géneros de lenguas; y á otro, interpretación de lenguas. 11 Mas todas estas cosas obra uno y el mismo Espíritu, repartiendo particularmente á cada uno como quiere.","rv|John 14:16-17":"16 Y yo rogaré al Padre, y os dará otro Consolador, para que esté con vosotros para siempre: 17 Al Espíritu de verdad, al cual el mundo no puede recibir, porque no le ve, ni le conoce: mas vosotros le conocéis; porque está con vosotros, y será en vosotros.","rv|1 Peter 2:24":"El cual mismo llevó nuestros pecados en su cuerpo sobre el madero, para que nosotros siendo muertos á los pecados, vivamos á la justicia: por la herida del cual habéis sido sanados.","rv|Psalms 22":"1 DIOS mío, Dios mío, ¿por qué me has dejado? ¿por qué estás lejos de mi salud, y de las palabras de mi clamor? 2 Dios mío, clamo de día, y no oyes; y de noche, y no hay para mí silencio. 3 Tú empero eres santo, tú que habitas entre las alabanzas de Israel. 4 En ti esperaron nuestros padres: esperaron, y tú los libraste. 5 Clamaron á ti, y fueron librados: esperaron en ti, y no se avergonzaron. 6 Mas yo soy gusano, y no hombre; oprobio de los hombres, y desecho del pueblo. 7 Todos los que me ven, escarnecen de mí; estiran los labios, menean la cabeza, diciendo: 8 Remítese á Jehová, líbrelo; sálvele, puesto que en él se complacía. 9 Empero tú eres el que me sacó del vientre, el que me haces esperar desde que estaba á los pechos de mi madre. 10 Sobre ti fuí echado desde la matriz: desde el vientre de mi madre, tú eres mi Dios. 11 No te alejes de mí, porque la angustia está cerca; porque no hay quien ayude. 12 Hanme rodeado muchos toros; fuertes toros de Basán me han cercado. 13 Abrieron sobre mí su boca, como león rapante y rugiente. 14 Heme escurrido como aguas, y todos mis huesos se descoyuntaron: mi corazón fué como cera, desliéndose en medio de mis entrañas. 15 Secóse como un tiesto mi vigor, y mi lengua se pegó á mi paladar; y me has puesto en el polvo de la muerte. 16 Porque perros me han rodeado, hame cercado cuadrilla de malignos: horadaron mis manos y mis pies. 17 Contar puedo todos mis huesos; ellos miran, considéranme. 18 Partieron entre sí mis vestidos, y sobre mi ropa echaron suertes. 19 Mas tú, Jehová, no te alejes; fortaleza mía, apresúrate para mi ayuda. 20 Libra de la espada mi alma; del poder del perro mi única. 21 Sálvame de la boca del león, y óyeme librándome de los cuernos de los unicornios. 22 Anunciaré tu nombre á mis hermanos: en medio de la congregación te alabaré. 23 Los que teméis á Jehová, alabadle; glorificadle, simiente toda de Jacob; y temed de él, vosotros, simiente toda de Israel. 24 Porque no menospreció ni abominó la aflicción del pobre, ni de él escondió su rostro; sino que cuando clamó á él, oyóle. 25 De ti será mi alabanza en la grande congregación; mis votos pagaré delante de los que le temen. 26 Comerán los pobres, y serán saciados: alabarán á Jehová los que le buscan: vivirá vuestro corazón para siempre. 27 Acordarse han, y volveránse á Jehová todos los términos de la tierra; y se humillarán delante de ti todas las familias de las gentes. 28 Porque de Jehová es el reino; y él se enseñoreará de las gentes. 29 Comerán y adorarán todos los poderosos de la tierra: postraránse delante de él todos los que descienden al polvo, si bien ninguno puede conservar la vida á su propia alma. 30 La posteridad le servirá; será ella contada por una generación de Jehová. 31 Vendrán, y anunciarán al pueblo que naciere, su justicia que él hizo.","rv|1 Corinthians 15:3-8":"3 Porque primeramente os he enseñado lo que asimismo recibí: Que Cristo fué muerto por nuestros pecados, conforme á las Escrituras; 4 Y que fué sepultado, y que resucitó al tercer día, conforme á las Escrituras; 5 Y que apareció á Cefas, y después á los doce. 6 Después apareció á más de quinientos hermanos juntos; de los cuales muchos viven aún, y otros son muertos. 7 Después apareció á Jacobo; después á todos los apóstoles. 8 Y el postrero de todos, como á un abortivo, me apareció á mí.","rv|Revelation 20:4-6":"4 Y vi tronos, y se sentaron sobre ellos, y les fué dado juicio; y vi las almas de los degollados por el testimonio de Jesús, y por la palabra de Dios, y que no habían adorado la bestia, ni á su imagen, y que no recibieron la señal en sus frentes, ni en sus manos; y vivieron y reinaron con Cristo mil años. 5 Mas los otros muertos no tornaron á vivir hasta que sean cumplidos mil años. Esta es la primera resurrección. 6 Bienaventurado y santo el que tiene parte en la primera resurrección: la segunda muerte no tiene potestad en éstos; antes serán sacerdotes de Dios y de Cristo, y reinarán con él mil años.","rv|Matthew 24:30":"Y entonces se mostrará la señal del Hijo del hombre en el cielo; y entonces lamentarán todas las tribus de la tierra, y verán al Hijo del hombre que vendrá sobre las nubes del cielo, con grande poder y gloria.","rv|1 Thessalonians 4:16-17":"16 Porque el mismo Señor con aclamación, con voz de arcángel, y con trompeta de Dios, descenderá del cielo; y los muertos en Cristo resucitarán primero: 17 Luego nosotros, los que vivimos, los que quedamos, juntamente con ellos seremos arrebatados en las nubes á recibir al Señor en el aire, y así estaremos siempre con el Señor.","rv|Revelation 22:12":"Y he aquí, yo vengo presto, y mi galardón conmigo, para recompensar á cada uno según fuere su obra.","rv|Revelation 21:1-4":"1 Y VI un cielo nuevo, y una tierra nueva: porque el primer cielo y la primera tierra se fueron, y el mar ya no es. 2 Y yo Juan vi la santa ciudad, Jerusalem nueva, que descendía del cielo, de Dios, dispuesta como una esposa ataviada para su marido. 3 Y oí una gran voz del cielo que decía: He aquí el tabernáculo de Dios con los hombres, y morará con ellos; y ellos serán su pueblo, y el mismo Dios será su Dios con ellos. 4 Y limpiará Dios toda lágrima de los ojos de ellos; y la muerte no será más; y no habrá más llanto, ni clamor, ni dolor: porque las primeras cosas son pasadas.","rv|Revelation 21:10":"Y llevóme en Espíritu á un grande y alto monte, y me mostró la grande ciudad santa de Jerusalem, que descendía del cielo de Dios,","rv|Mark 9:47-48":"47 Y si tu ojo te fuere ocasión de caer, sácalo: mejor te es entrar al reino de Dios con un ojo, que teniendo dos ojos ser echado á la Gehenna; 48 Donde el gusano de ellos no muere, y el fuego nunca se apaga.","rv|1 Thessalonians 5:23":"Y el Dios de paz os santifique en todo; para que vuestro espíritu y alma y cuerpo sea guardado entero sin reprensión para la venida de nuestro Señor Jesucristo.","rv|Hebrews 4:12":"Porque la palabra de Dios es viva y eficaz, y más penetrante que toda espada de dos filos: y que alcanza hasta partir el alma, y aun el espíritu, y las coyunturas y tuétanos, y discierne los pensamientos y las intenciones del corazón.","rv|Hebrews 9:27":"Y de la manera que está establecido á los hombres que mueran una vez, y después el juicio;","rv|Luke 16:19-31":"19 Había un hombre rico, que se vestía de púrpura y de lino fino, y hacía cada día banquete con esplendidez. 20 Había también un mendigo llamado Lázaro, el cual estaba echado á la puerta de él, lleno de llagas, 21 Y deseando hartarse de las migajas que caían de la mesa del rico; y aun los perros venían y le lamían las llagas. 22 Y aconteció que murió el mendigo, y fué llevado por los ángeles al seno de Abraham: y murió también el rico, y fué sepultado. 23 Y en el infierno alzó sus ojos, estando en los tormentos, y vió á Abraham de lejos, y á Lázaro en su seno. 24 Entonces él, dando voces, dijo: Padre Abraham, ten misericordia de mí, y envía á Lázaro que moje la punta de su dedo en agua, y refresque mi lengua; porque soy atormentado en esta llama. 25 Y díjole Abraham: Hijo, acuérdate que recibiste tus bienes en tu vida, y Lázaro también males; mas ahora éste es consolado aquí, y tú atormentado. 26 Y además de todo esto, una grande sima está constituída entre nosotros y vosotros, que los que quisieren pasar de aquí á vosotros, no pueden, ni de allá pasar acá. 27 Y dijo: Ruégote pues, padre, que le envíes á la casa de mi padre; 28 Porque tengo cinco hermanos; para que les testifique, porque no vengan ellos también á este lugar de tormento. 29 Y Abraham le dice: A Moisés y á los profetas tienen: óiganlos. 30 El entonces dijo: No, padre Abraham: mas si alguno fuere á ellos de los muertos, se arrepentirán. 31 Mas Abraham le dijo: Si no oyen á Moisés y á los profetas, tampoco se persuadirán, si alguno se levantare de los muertos.","rv|1 Corinthians 15:26":"Y el postrer enemigo que será deshecho, será la muerte.","rv|Genesis 1:1":"EN el principio crió Dios los cielos y la tierra.","rv|John 1:1-3":"1 EN el principio era el Verbo, y el Verbo era con Dios, y el Verbo era Dios. 2 Este era en el principio con Dios. 3 Todas las cosas por él fueron hechas; y sin él nada de lo que es hecho, fué hecho.","rv|1 Corinthians 13:4-7":"4 La caridad es sufrida, es benigna; la caridad no tiene envidia, la caridad no hace sinrazón, no se ensancha; 5 No es injuriosa, no busca lo suyo, no se irrita, no piensa el mal; 6 No se huelga de la injusticia, mas se huelga de la verdad; 7 Todo lo sufre, todo lo cree, todo lo espera, todo lo soporta.","rv|1 John 4:9-10":"9 En esto se mostró el amor de Dios para con nosotros, en que Dios envió á su Hijo unigénito al mundo, para que vivamos por él. 10 En esto consiste el amor: no que nosotros hayamos amado á Dios, sino que él nos amó á nosotros, y ha enviado á su Hijo en propiciación por nuestros pecados.","rv|John 15:13":"Nadie tiene mayor amor que este, que ponga alguno su vida por sus amigos.","rv|Hebrews 11:6":"Empero sin fe es imposible agradar á Dios; porque es menester que el que á Dios se allega, crea que le hay, y que es galardonador de los que le buscan.","rv|Romans 10:9-10":"9 Que si confesares con tu boca al Señor Jesús, y creyeres en tu corazón que Dios le levantó de los muertos, serás salvo. 10 Porque con el corazón se cree para justicia; mas con la boca se hace confesión para salud.","rv|Matthew 6:9-13":"9 Vosotros pues, oraréis así: Padre nuestro que estás en los cielos, santificado sea tu nombre. 10 Venga tu reino. Sea hecha tu voluntad, como en el cielo, así también en la tierra. 11 Danos hoy nuestro pan cotidiano. 12 Y perdónanos nuestras deudas, como también nosotros perdonamos á nuestros deudores. 13 Y no nos metas en tentación, mas líbranos del mal: porque tuyo es el reino, y el poder, y la gloria, por todos los siglos. Amén.","rv|John 14:13-14":"13 Y todo lo que pidiereis al Padre en mi nombre, esto haré, para que el Padre sea glorificado en el Hijo. 14 Si algo pidiereis en mi nombre, yo lo haré.","rv|Philippians 4:6-7":"6 Por nada estéis afanosos; sino sean notorias vuestras peticiones delante de Dios en toda oración y ruego, con hacimiento de gracias. 7 Y la paz de Dios, que sobrepuja todo entendimiento, guardará vuestros corazones y vuestros entendimientos en Cristo Jesús.","rv|Galatians 3:24":"De manera que la ley nuestro ayo fué para llevarnos á Cristo, para que fuésemos justificados por la fe.","rv|Matthew 22:37-40":"37 Y Jesús le dijo: Amarás al Señor tu Dios de todo tu corazón, y de toda tu alma, y de toda tu mente. 38 Este es el primero y el grande mandamiento. 39 Y el segundo es semejante á éste: Amarás á tu prójimo como á ti mismo. 40 De estos dos mandamientos depende toda la ley y los profetas.","rv|Mark 16:15-18":"15 Y les dijo: Id por todo el mundo; predicad el evangelio á toda criatura. 16 El que creyere y fuere bautizado, será salvo; mas el que no creyere, será condenado. 17 Y estas señales seguirán á los que creyeren: En mi nombre echarán fuera demonios; hablarán nuevas lenguas; 18 Quitarán serpientes, y si bebieren cosa mortífera, no les dañará; sobre los enfermos pondrán sus manos, y sanarán.","rv|Acts 1:8":"Mas recibiréis la virtud del Espíritu Santo que vendrá sobre vosotros; y me sereís testigos en Jerusalem, y en toda Judea, y Samaria, y hasta lo último de la tierra.","rv|Matthew 6:25-34":"25 Por tanto os digo: No os congojéis por vuestra vida, qué habéis de comer, ó qué habéis de beber; ni por vuestro cuerpo, qué habéis de vestir: ¿no es la vida más que el alimento, y el cuerpo que el vestido? 26 Mirad las aves del cielo, que no siembran, ni siegan, ni allegan en alfolíes; y vuestro Padre celestial las alimenta. ¿No sois vosotros mucho mejores que ellas? 27 Mas ¿quién de vosotros podrá, congojándose, añadir á su estatura un codo? 28 Y por el vestido ¿por qué os congojáis? Reparad los lirios del campo, cómo crecen; no trabajan ni hilan; 29 Mas os digo, que ni aun Salomón con toda su gloria fué vestido así como uno de ellos. 30 Y si la hierba del campo que hoy es, y mañana es echada en el horno, Dios la viste así, ¿no hará mucho más á vosotros, hombres de poca fe? 31 No os congojéis pues, diciendo: ¿Qué comeremos, ó qué beberemos, ó con qué nos cubriremos? 32 Porque los Gentiles buscan todas estas cosas: que vuestro Padre celestial sabe que de todas estas cosas habéis menester. 33 Mas buscad primeramente el reino de Dios y su justicia, y todas estas cosas os serán añadidas. 34 Así que, no os congojéis por el día de mañana; que el día de mañana traerá su fatiga: basta al día su afán.","rv|Isaiah 41:10":"No temas, que yo soy contigo; no desmayes, que yo soy tu Dios que te esfuerzo: siempre te ayudaré, siempre te sustentaré con la diestra de mi justicia.","rv|2 Timothy 1:7":"Porque no nos ha dado Dios el espíritu de temor, sino el de fortaleza, y de amor, y de templanza.","rv|1 Thessalonians 4:3":"Porque la voluntad de Dios es vuestra santificación: que os apartéis de fornicación;","rv|Hebrews 12:14":"Seguid la paz con todos, y la santidad, sin la cual nadie verá al Señor:","rv|Ephesians 5:26":"Para santificarla limpiándola en el lavacro del agua por la palabra,","rv|Mark 10:45":"Porque el Hijo del hombre tampoco vino para ser servido, mas para servir, y dar su vida en rescate por muchos.","rv|John 1:29":"El siguiente día ve Juan á Jesús que venía á él, y dice: He aquí el Cordero de Dios, que quita el pecado del mundo.","rv|1 Corinthians 5:7":"Limpiad pues la vieja levadura, para que seáis nueva masa, como sois sin levadura: porque nuestra pascua, que es Cristo, fué sacrificada por nosotros.","rv|Hebrews 9:1-12":"1 TENÍA empero también el primer pacto reglamentos del culto, y santuario mundano. 2 Porque el tabernáculo fué hecho: el primero, en que estaban las lámparas, y la mesa, y los panes de la proposición; lo que llaman el Santuario. 3 Tras el segundo velo estaba el tabernáculo, que llaman el Lugar Santísimo; 4 El cual tenía un incensario de oro, y el arca del pacto cubierta de todas partes alrededor de oro; en la que estaba una urna de oro que contenía el maná, y la vara de Aarón que reverdeció, y las tablas del pacto; 5 Y sobre ella los querubines de gloria que cubrían el propiciatorio; de las cuales cosas no se puede ahora hablar en particular. 6 Y estas cosas así ordenadas, en el primer tabernáculo siempre entraban los sacerdotes para hacer los oficios del culto; 7 Mas en el segundo, sólo el pontífice una vez en el año, no sin sangre, la cual ofrece por sí mismo, y por los pecados de ignorancia del pueblo: 8 Dando en esto á entender el Espíritu Santo, que aun no estaba descubierto el camino para el santuario, entre tanto que el primer tabernáculo estuviese en pie. 9 Lo cual era figura de aquel tiempo presente, en el cual se ofrecían presentes y sacrificios que no podían hacer perfecto, cuanto á la conciencia, al que servía con ellos; 10 Consistiendo sólo en viandas y en bebidas, y en diversos lavamientos, y ordenanzas acerca de la carne, impuestas hasta el tiempo de la corrección. 11 Mas estando ya presente Cristo, pontífice de los bienes que habían de venir, por el más amplio y más perfecto tabernáculo, no hecho de manos, es á saber, no de esta creación; 12 Y no por sangre de machos cabríos ni de becerros, mas por su propia sangre, entró una sola vez en el santuario, habiendo obtenido eterna redención.","rv|Hebrews 10:19-20":"19 Así que, hermanos, teniendo libertad para entrar en el santuario por la sangre de Jesucristo, 20 Por el camino que él nos consagró nuevo y vivo, por el velo, esto es, por su carne;","rv|Matthew 27:51":"Y he aquí, el velo del templo se rompió en dos, de alto á bajo: y la tierra tembló, y las piedras se hendieron;","rv|Romans 5:17-19":"17 Porque, si por un delito reinó la muerte por uno, mucho más reinarán en vida por un Jesucristo los que reciben la abundancia de la gracia, y del don de la justicia. 18 Así que, de la manera que por un delito vino la culpa á todos los hombres para condenación, así por una justicia vino la gracia á todos los hombres para justificación de vida. 19 Porque como por la desobediencia de un hombre los muchos fueron constituídos pecadores, así por la obediencia de uno los muchos serán constituídos justos.","rv|John 17:3":"Esta empero es la vida eterna: que te conozcan el solo Dios verdadero, y á Jesucristo, al cual has enviado.","rv|1 John 5:11-13":"11 Y este es el testimonio: Que Dios nos ha dado vida eterna; y esta vida está en su Hijo. 12 El que tiene al Hijo, tiene la vida: el que no tiene al Hijo de Dios, no tiene la vida. 13 Estas cosas he escrito á vosotros que creéis en el nombre del Hijo de Dios, para que sepáis que tenéis vida eterna, y para que creáis en el nombre del Hijo de Dios.","rv|John 10:28":"Y yo les doy vida eterna: y no perecerán para siempre, ni nadie las arrebatará de mi mano.","rv|2 Corinthians 5:10":"Porque es menester que todos nosotros parezcamos ante el tribunal de Cristo, para que cada uno reciba según lo que hubiere hecho por medio del cuerpo, ora sea bueno ó malo.","rv|Matthew 11:28-30":"28 Venid á mí todos los que estáis trabajados y cargados, que yo os haré descansar. 29 Llevad mi yugo sobre vosotros, y aprended de mí, que soy manso y humilde de corazón; y hallaréis descanso para vuestras almas. 30 Porque mi yugo es fácil, y ligera mi carga.","rv|John 14:27":"La paz os dejo, mi paz os doy: no como el mundo la da, yo os la doy. No se turbe vuestro corazón, ni tenga miedo.","rv|Philippians 4:7":"Y la paz de Dios, que sobrepuja todo entendimiento, guardará vuestros corazones y vuestros entendimientos en Cristo Jesús.","rv|John 15:6":"El que en mí no estuviere, será echado fuera como mal pámpano, y se secará; y los cogen, y los echan en el fuego, y arden.","rv|Hebrews 10:1":"PORQUE la ley, teniendo la sombra de los bienes venideros, no la imagen misma de las cosas, nunca puede, por los mismos sacrificios que ofrecen continuamente cada año, hacer perfectos á los que se allegan.","web|1 Corinthians 15:24":"Then the end comes, when he will deliver up the Kingdom to God, even the Father; when he will have abolished all rule and all authority and power.","cuv|1 Corinthians 15:24":"再后，末期到了，那时基督既将一切执政的、掌权的、有能的都毁灭了，就把国交与父 神。","rv|1 Corinthians 15:24":"Luego el fin; cuando entregará el reino á Dios y al Padre, cuando habrá quitado todo imperio, y toda potencia y potestad.","web|1 Corinthians 3:15":"If any man’s work is burned, he will suffer loss, but he himself will be saved, but as through fire.","cuv|1 Corinthians 3:15":"人的工程若被烧了，他就要受亏损，自己却要得救；虽然得救，乃像从火里经过的一样。","rv|1 Corinthians 3:15":"Si la obra de alguno fuere quemada, será perdida: él empero será salvo, mas así como por fuego.","web|2 Corinthians 4:16":"Therefore we don’t faint, but though our outward man is decaying, yet our inward man is renewed day by day.","cuv|2 Corinthians 4:16":"所以，我们不丧胆。外体虽然毁坏，内心却一天新似一天。","rv|2 Corinthians 4:16":"Por tanto, no desmayamos: antes aunque este nuestro hombre exterior se va desgastando, el interior empero se renueva de día en día.","web|Acts 20:24":"But these things don’t count; nor do I hold my life dear to myself, so that I may finish my race with joy, and the ministry which I received from the Lord Jesus, to fully testify to the Good News of the grace of God.","cuv|Acts 20:24":"我却不以性命为念，也不看为宝贵，只要行完我的路程，成就我从主耶稣所领受的职事，证明 神恩惠的福音。","rv|Acts 20:24":"Mas de ninguna cosa hago caso, ni estimo mi vida preciosa para mí mismo; solamente que acabe mi carrera con gozo, y el ministerio que recibí del Señor Jesús, para dar testimonio del evangelio de la gracia de Dios.","web|Acts 24:15":"having hope toward God, which these also themselves look for, that there will be a resurrection of the dead, both of the just and unjust.","cuv|Acts 24:15":"并且靠着 神，盼望死人，无论善恶，都要复活，就是他们自己也有这个盼望。","rv|Acts 24:15":"Teniendo esperanza en Dios que ha de haber resurrección de los muertos, así de justos como de injustos, la cual también ellos esperan.","web|Deuteronomy 8:3":"He humbled you, and allowed you to be hungry, and fed you with manna, which you didn’t know, neither did your fathers know; that he might teach you that man does not live by bread only, but man lives by every word that proceeds out of Yahweh’s mouth.","cuv|Deuteronomy 8:3":"他苦炼你，任你饥饿，将你和你列祖所不认识的吗哪赐给你吃，使你知道，人活着不是单靠食物，乃是靠耶和华口里所出的一切话。","rv|Deuteronomy 8:3":"Y te afligió, é hízote tener hambre, y te sustentó con maná, comida que no conocías tú, ni tus padres la habían conocido; para hacerte saber que el hombre no vivirá de solo pan, mas de todo lo que sale de la boca de Jehová vivirá el hombre.","web|Genesis 1:30":"To every animal of the earth, and to every bird of the sky, and to everything that creeps on the earth, in which there is life, I have given every green herb for food;” and it was so.","cuv|Genesis 1:30":"至于地上的走兽和空中的飞鸟，并各样爬在地上有生命的物，我将青草赐给它们作食物。」事就这样成了。","rv|Genesis 1:30":"Y á toda bestia de la tierra, y á todas las aves de los cielos, y á todo lo que se mueve sobre la tierra, en que hay vida, toda hierba verde les será para comer: y fué así.","web|Genesis 2:16-17":"16 Yahweh God commanded the man, saying, “You may freely eat of every tree of the garden; 17 but you shall not eat of the tree of the knowledge of good and evil; for in the day that you eat of it, you will surely die.”","cuv|Genesis 2:16-17":"16 耶和华 神吩咐他说：「园中各样树上的果子，你可以随意吃， 17 只是分别善恶树上的果子，你不可吃，因为你吃的日子必定死！」","rv|Genesis 2:16-17":"16 Y mandó Jehová Dios al hombre, diciendo: De todo árbol del huerto comerás; 17 Mas del árbol de ciencia del bien y del mal no comerás de él; porque el día que de él comieres, morirás.","web|James 4:14":"Whereas you don’t know what your life will be like tomorrow. For what is your life? For you are a vapor, that appears for a little time, and then vanishes away.","cuv|James 4:14":"其实明天如何，你们还不知道。你们的生命是甚么呢？你们原来是一片云雾，出现少时就不见了。","rv|James 4:14":"Y no sabéis lo que será mañana. Porque ¿qué es vuestra vida? Ciertamente es un vapor que se aparece por un poco de tiempo, y luego se desvanece.","web|Job 7:7":"Oh remember that my life is a breath. My eye shall no more see good.","cuv|Job 7:7":"求你想念，我的生命不过是一口气；我的眼睛必不再见福乐。","rv|Job 7:7":"Acuérdate que mi vida es viento, y que mis ojos no volverán á ver el bien.","web|John 10:10":"The thief only comes to steal, kill, and destroy. I came that they may have life, and may have it abundantly.","cuv|John 10:10":"盗贼来，无非要偷窃，杀害，毁坏；我来了，是要叫羊得生命，并且得的更丰盛。","rv|John 10:10":"El ladrón no viene sino para hurtar, y matar, y destruir: yo he venido para que tengan vida, y para que la tengan en abundancia.","web|John 15:7":"If you remain in me, and my words remain in you, you will ask whatever you desire, and it will be done for you.","cuv|John 15:7":"你们若常在我里面，我的话也常在你们里面，凡你们所愿意的，祈求，就给你们成就。","rv|John 15:7":"Si estuviereis en mí, y mis palabras estuvieren en vosotros, pedid todo lo que quisiereis, y os será hecho.","web|John 5:29":"and will come out; those who have done good, to the resurrection of life; and those who have done evil, to the resurrection of judgment.","cuv|John 5:29":"行善的，复活得生；作恶的，复活定罪。","rv|John 5:29":"Y los que hicieron bien, saldrán á resurrección de vida; mas los que hicieron mal, á resurrección de condenación.","web|Luke 16:19-21":"19 “Now there was a certain rich man, and he was clothed in purple and fine linen, living in luxury every day. 20 A certain beggar, named Lazarus, was laid at his gate, full of sores, 21 and desiring to be fed with the crumbs that fell from the rich man’s table. Yes, even the dogs came and licked his sores.","cuv|Luke 16:19-21":"19 「有一个财主穿着紫色袍和细麻布衣服，天天奢华宴乐。 20 又有一个讨饭的，名叫拉撒路，浑身生疮，被人放在财主门口， 21 要得财主桌子上掉下来的零碎充饥；并且狗来舔他的疮。","rv|Luke 16:19-21":"19 Había un hombre rico, que se vestía de púrpura y de lino fino, y hacía cada día banquete con esplendidez. 20 Había también un mendigo llamado Lázaro, el cual estaba echado á la puerta de él, lleno de llagas, 21 Y deseando hartarse de las migajas que caían de la mesa del rico; y aun los perros venían y le lamían las llagas.","web|Luke 16:22":"The beggar died, and he was carried away by the angels to Abraham’s bosom. The rich man also died, and was buried.","cuv|Luke 16:22":"后来那讨饭的死了，被天使带去放在亚伯拉罕的怀里。财主也死了，并且埋葬了。","rv|Luke 16:22":"Y aconteció que murió el mendigo, y fué llevado por los ángeles al seno de Abraham: y murió también el rico, y fué sepultado.","web|Luke 16:23":"In Hades, he lifted up his eyes, being in torment, and saw Abraham far off, and Lazarus at his bosom.","cuv|Luke 16:23":"他在阴间受痛苦，举目远远地望见亚伯拉罕，又望见拉撒路在他怀里，","rv|Luke 16:23":"Y en el infierno alzó sus ojos, estando en los tormentos, y vió á Abraham de lejos, y á Lázaro en su seno.","web|Luke 16:23-25":"23 In Hades, he lifted up his eyes, being in torment, and saw Abraham far off, and Lazarus at his bosom. 24 He cried and said, ‘Father Abraham, have mercy on me, and send Lazarus, that he may dip the tip of his finger in water, and cool my tongue! For I am in anguish in this flame.’ 25 “But Abraham said, ‘Son, remember that you, in your lifetime, received your good things, and Lazarus, in the same way, bad things. But now here he is comforted and you are in anguish.","cuv|Luke 16:23-25":"23 他在阴间受痛苦，举目远远地望见亚伯拉罕，又望见拉撒路在他怀里， 24 就喊着说：『我祖亚伯拉罕哪，可怜我吧！打发拉撒路来，用指头尖蘸点水，凉凉我的舌头；因为我在这火焰里，极其痛苦。』 25 亚伯拉罕说：『儿啊，你该回想你生前享过福，拉撒路也受过苦；如今他在这里得安慰，你倒受痛苦。","rv|Luke 16:23-25":"23 Y en el infierno alzó sus ojos, estando en los tormentos, y vió á Abraham de lejos, y á Lázaro en su seno. 24 Entonces él, dando voces, dijo: Padre Abraham, ten misericordia de mí, y envía á Lázaro que moje la punta de su dedo en agua, y refresque mi lengua; porque soy atormentado en esta llama. 25 Y díjole Abraham: Hijo, acuérdate que recibiste tus bienes en tu vida, y Lázaro también males; mas ahora éste es consolado aquí, y tú atormentado.","web|Luke 16:26-31":"26 Besides all this, between us and you there is a great gulf fixed, that those who want to pass from here to you are not able, and that no one may cross over from there to us.’ 27 “He said, ‘I ask you therefore, father, that you would send him to my father’s house; 28 for I have five brothers, that he may testify to them, so they won’t also come into this place of torment.’ 29 “But Abraham said to him, ‘They have Moses and the prophets. Let them listen to them.’ 30 “He said, ‘No, father Abraham, but if one goes to them from the dead, they will repent.’ 31 “He said to him, ‘If they don’t listen to Moses and the prophets, neither will they be persuaded if one rises from the dead.’”","cuv|Luke 16:26-31":"26 不但这样，并且在你我之间，有深渊限定，以致人要从这边过到你们那边是不能的；要从那边过到我们这边也是不能的。』 27 财主说：『我祖啊！既是这样，求你打发拉撒路到我父家去； 28 因为我还有五个弟兄，他可以对他们作见证，免得他们也来到这痛苦的地方。』 29 亚伯拉罕说：『他们有摩西和先知的话可以听从。』 30 他说：『我祖亚伯拉罕哪，不是的，若有一个从死里复活的，到他们那里去的，他们必要悔改。』 31 亚伯拉罕说：『若不听从摩西和先知的话，就是有一个从死里复活的，他们也是不听劝。』」","rv|Luke 16:26-31":"26 Y además de todo esto, una grande sima está constituída entre nosotros y vosotros, que los que quisieren pasar de aquí á vosotros, no pueden, ni de allá pasar acá. 27 Y dijo: Ruégote pues, padre, que le envíes á la casa de mi padre; 28 Porque tengo cinco hermanos; para que les testifique, porque no vengan ellos también á este lugar de tormento. 29 Y Abraham le dice: A Moisés y á los profetas tienen: óiganlos. 30 El entonces dijo: No, padre Abraham: mas si alguno fuere á ellos de los muertos, se arrepentirán. 31 Mas Abraham le dijo: Si no oyen á Moisés y á los profetas, tampoco se persuadirán, si alguno se levantare de los muertos.","web|Luke 22:30":"that you may eat and drink at my table in my Kingdom. You will sit on thrones, judging the twelve tribes of Israel.”","cuv|Luke 22:30":"叫你们在我国里，坐在我的席上吃喝，并且坐在宝座上，审判以色列十二个支派。」","rv|Luke 22:30":"Para que comáis y bebáis en mi mesa en mi reino, y os sentéis sobre tronos juzgando á las doce tribus de Israel.","web|Luke 23:43":"Jesus said to him, “Assuredly I tell you, today you will be with me in Paradise.”","cuv|Luke 23:43":"耶稣对他说：「我实在告诉你，今日你要同我在乐园里了。」","rv|Luke 23:43":"Entonces Jesús le dijo: De cierto te digo, que hoy estarás conmigo en el paraíso.","web|Luke 8:31":"They begged him that he would not command them to go into the abyss.","cuv|Luke 8:31":"鬼就央求耶稣，不要吩咐他们到无底坑里去。","rv|Luke 8:31":"Y le rogaban que no les mandase ir al abismo.","web|Matthew 25:30":"Throw out the unprofitable servant into the outer darkness, where there will be weeping and gnashing of teeth.’","cuv|Matthew 25:30":"把这无用的仆人丢在外面黑暗里；在那里必要哀哭切齿了。』」","rv|Matthew 25:30":"Y al siervo inútil echadle en las tinieblas de afuera: allí será el lloro y el crujir de dientes.","web|Revelation 12:11":"They overcame him because of the Lamb’s blood, and because of the word of their testimony. They didn’t love their life, even to death.","cuv|Revelation 12:11":"弟兄胜过它，是因羔羊的血和自己所见证的道。他们虽至于死，也不爱惜性命。","rv|Revelation 12:11":"Y ellos le han vencido por la sangre del Cordero, y por la palabra de su testimonio; y no han amado sus vidas hasta la muerte.","web|Revelation 20:14":"Death and Hades were thrown into the lake of fire. This is the second death, the lake of fire.","cuv|Revelation 20:14":"死亡和阴间也被扔在火湖里；这火湖就是第二次的死。","rv|Revelation 20:14":"Y el infierno y la muerte fueron lanzados en el lago de fuego. Esta es la muerte segunda.","web|Revelation 20:5":"The rest of the dead didn’t live until the thousand years were finished. This is the first resurrection.","cuv|Revelation 20:5":"这是头一次的复活。（其余的死人还没有复活，直等那一千年完了。）","rv|Revelation 20:5":"Mas los otros muertos no tornaron á vivir hasta que sean cumplidos mil años. Esta es la primera resurrección.","web|Revelation 20:6":"Blessed and holy is he who has part in the first resurrection. Over these, the second death has no power, but they will be priests of God and of Christ, and will reign with him one thousand years.","cuv|Revelation 20:6":"在头一次复活有分的有福了，圣洁了！第二次的死在他们身上没有权柄。他们必作 神和基督的祭司，并要与基督一同作王一千年。","rv|Revelation 20:6":"Bienaventurado y santo el que tiene parte en la primera resurrección: la segunda muerte no tiene potestad en éstos; antes serán sacerdotes de Dios y de Cristo, y reinarán con él mil años.","web|Revelation 22:15":"Outside are the dogs, the sorcerers, the sexually immoral, the murderers, the idolaters, and everyone who loves and practices falsehood.","cuv|Revelation 22:15":"城外有那些犬类、行邪术的、淫乱的、杀人的、拜偶像的，并一切喜好说谎言、编造虚谎的。","rv|Revelation 22:15":"Mas los perros estarán fuera, y los hechiceros, y los disolutos, y los homicidas, y los idólatras, y cualquiera que ama y hace mentira.","web|Romans 8:5":"For those who live according to the flesh set their minds on the things of the flesh, but those who live according to the Spirit, the things of the Spirit.","cuv|Romans 8:5":"因为，随从肉体的人体贴肉体的事；随从圣灵的人体贴圣灵的事。","rv|Romans 8:5":"Porque los que viven conforme á la carne, de las cosas que son de la carne se ocupan; mas los que conforme al espíritu, de las cosas del espíritu.","web|2 Peter 2:4":"For if God didn’t spare angels when they sinned, but cast them down to Tartarus, and committed them to pits of darkness, to be reserved for judgment;","cuv|2 Peter 2:4":"就是天使犯了罪， 神也没有宽容，曾把他们丢在地狱，交在黑暗坑中，等候审判。","rv|2 Peter 2:4":"Porque si Dios no perdonó á los ángeles que habían pecado, sino que habiéndolos despeñado en el infierno con cadenas de oscuridad, los entregó para ser reservados al juicio;","web|2 Peter 3:9":"The Lord is not slow concerning his promise, as some count slowness; but is patient with us, not wishing that any should perish, but that all should come to repentance.","cuv|2 Peter 3:9":"主所应许的尚未成就，有人以为他是耽延，其实不是耽延，乃是宽容你们，不愿有一人沉沦，乃愿人人都悔改。","rv|2 Peter 3:9":"El Señor no tarda su promesa, como algunos la tienen por tardanza; sino que es paciente para con nosotros, no queriendo que ninguno perezca, sino que todos procedan al arrepentimiento.","web|Genesis 1:3":"God said, “Let there be light,” and there was light.","cuv|Genesis 1:3":"神说：「要有光」，就有了光。","rv|Genesis 1:3":"Y dijo Dios: Sea la luz: y fué la luz.","web|John 1:1":"In the beginning was the Word, and the Word was with God, and the Word was God.","cuv|John 1:1":"太初有道，道与 神同在，道就是 神。","rv|John 1:1":"EN el principio era el Verbo, y el Verbo era con Dios, y el Verbo era Dios.","web|Matthew 18:8-9":"8 If your hand or your foot causes you to stumble, cut it off, and cast it from you. It is better for you to enter into life maimed or crippled, rather than having two hands or two feet to be cast into the eternal fire. 9 If your eye causes you to stumble, pluck it out, and cast it from you. It is better for you to enter into life with one eye, rather than having two eyes to be cast into the Gehennaof fire.","cuv|Matthew 18:8-9":"8 倘若你一只手，或是一只脚，叫你跌倒，就砍下来丢掉。你缺一只手，或是一只脚，进入永生，强如有两手两脚被丢在永火里。 9 倘若你一只眼叫你跌倒，就把它剜出来丢掉。你只有一只眼进入永生，强如有两只眼被丢在地狱的火里。」","rv|Matthew 18:8-9":"8 Por tanto, si tu mano ó tu pie te fuere ocasión de caer, córtalo y échalo de ti: mejor te es entrar cojo ó manco en la vida, que teniendo dos manos ó dos pies ser echado en el fuego eterno. 9 Y si tu ojo te fuere ocasión de caer, sácalo y échalo de ti: mejor te es entrar con un solo ojo en la vida, que teniendo dos ojos ser echado en el infierno del fuego.","web|Nehemiah 9:5":"Then the Levites, Jeshua, and Kadmiel, Bani, Hashabneiah, Sherebiah, Hodiah, Shebaniah, and Pethahiah, said, “Stand up and bless Yahweh your God from everlasting to everlasting! Blessed be your glorious name, which is exalted above all blessing and praise!","cuv|Nehemiah 9:5":"利未人耶书亚、甲篾、巴尼、哈沙尼、示利比、荷第雅、示巴尼、毗他希雅说：「你们要站起来称颂耶和华―你们的 神，永世无尽。耶和华啊，你荣耀之名是应当称颂的！超乎一切称颂和赞美。」","rv|Nehemiah 9:5":"Y dijeron los Levitas, Jesuá y Cadmiel, Bani, Hosabnías, Serebías, Odaías, Sebanías y Pethaía: Levantaos, bendecid á Jehová vuestro Dios desde el siglo hasta el siglo: y bendigan el nombre tuyo, glorioso y alto sobre toda bendición y alabanza.","web|1 Corinthians 15:51-52":"51 Behold, I tell you a mystery. We will not all sleep, but we will all be changed, 52 in a moment, in the twinkling of an eye, at the last trumpet. For the trumpet will sound, and the dead will be raised incorruptible, and we will be changed.","cuv|1 Corinthians 15:51-52":"51 我如今把一件奥秘的事告诉你们：我们不是都要睡觉，乃是都要改变， 52 就在一霎时，眨眼之间，号筒末次吹响的时候。因号筒要响，死人要复活成为不朽坏的，我们也要改变。","rv|1 Corinthians 15:51-52":"51 He aquí, os digo un misterio: Todos ciertamente no dormiremos, mas todos seremos transformados, 52 En un momento, en un abrir de ojo, á la final trompeta; porque será tocada la trompeta, y los muertos serán levantados sin corrupción, y nosotros seremos transformados.","web|Deuteronomy 30:19":"I call heaven and earth to witness against you this day, that I have set before you life and death, the blessing and the curse. Therefore choose life, that you may live, you and your descendants;","cuv|Deuteronomy 30:19":"我今日呼天唤地向你作见证；我将生死祸福陈明在你面前，所以你要拣选生命，使你和你的后裔都得存活；","rv|Deuteronomy 30:19":"A los cielos y la tierra llamo por testigos hoy contra vosotros, que os he puesto delante la vida y la muerte, la bendición y la maldición: escoge pues la vida, porque vivas tú y tu simiente:","web|Matthew 13:47-50":"47 “Again, the Kingdom of Heaven is like a dragnet, that was cast into the sea, and gathered some fish of every kind, 48 which, when it was filled, they drew up on the beach. They sat down, and gathered the good into containers, but the bad they threw away. 49 So will it be in the end of the world. The angels will come and separate the wicked from among the righteous, 50 and will cast them into the furnace of fire. There will be the weeping and the gnashing of teeth.”","cuv|Matthew 13:47-50":"47 天国又好像网撒在海里，聚拢各样水族， 48 网既满了，人就拉上岸来，坐下，拣好的收在器具里，将不好的丢弃了。 49 世界的末了也要这样。天使要出来，从义人中把恶人分别出来， 50 丢在火炉里；在那里必要哀哭切齿了。」","rv|Matthew 13:47-50":"47 Asimismo el reino de los cielos es semejante á la red, que echada en la mar, coge de todas suertes de peces: 48 La cual estando llena, la sacaron á la orilla; y sentados, cogieron lo bueno en vasos, y lo malo echaron fuera. 49 Así será al fin del siglo: saldrán los ángeles, y apartarán á los malos de entre los justos, 50 Y los echarán en el horno del fuego: allí será el lloro y el crujir de dientes.","web|Revelation 20:13-14":"13 The sea gave up the dead who were in it. Death and Hades gave up the dead who were in them. They were judged, each one according to his works. 14 Death and Hades were thrown into the lake of fire. This is the second death, the lake of fire.","cuv|Revelation 20:13-14":"13 于是海交出其中的死人；死亡和阴间也交出其中的死人；他们都照各人所行的受审判。 14 死亡和阴间也被扔在火湖里；这火湖就是第二次的死。","rv|Revelation 20:13-14":"13 Y el mar dió los muertos que estaban en él; y la muerte y el infierno dieron los muertos que estaban en ellos; y fué hecho juicio de cada uno según sus obras. 14 Y el infierno y la muerte fueron lanzados en el lago de fuego. Esta es la muerte segunda.","web|1 Corinthians 15:22":"For as in Adam all die, so also in Christ all will be made alive.","cuv|1 Corinthians 15:22":"在亚当里众人都死了；照样，在基督里众人也都要复活。","rv|1 Corinthians 15:22":"Porque así como en Adam todos mueren, así también en Cristo todos serán vivificados.","web|2 Corinthians 12:20":"For I am afraid that by any means, when I come, I might find you not the way I want to, and that I might be found by you as you don’t desire; that by any means there would be strife, jealousy, outbursts of anger, factions, slander, whisperings, proud thoughts, riots;","cuv|2 Corinthians 12:20":"我怕我再来的时候，见你们不合我所想望的，你们见我也不合你们所想望的；又怕有纷争、嫉妒、恼怒、结党、毁谤、谗言、狂傲、混乱的事。","rv|2 Corinthians 12:20":"Porque temo que cuando llegare, no os halle tales como quiero, y yo sea hallado de vosotros cual no queréis; que haya entre vosotros contiendas, envidias, iras, disensiones, detracciones, murmuraciones, elaciones, bandos:","web|2 Corinthians 4:4":"in whom the god of this world has blinded the minds of the unbelieving, that the light of the Good News of the glory of Christ, who is the image of God, should not dawn on them.","cuv|2 Corinthians 4:4":"此等不信之人被这世界的神弄瞎了心眼，不叫基督荣耀福音的光照着他们。基督本是 神的像。","rv|2 Corinthians 4:4":"En los cuales el dios de este siglo cegó los entendimientos de los incrédulos, para que no les resplandezca la lumbre del evangelio de la gloria de Cristo, el cual es la imagen de Dios.","web|Deuteronomy 6:13":"You shall fear Yahweh your God; and you shall serve him, and shall swear by his name.","cuv|Deuteronomy 6:13":"你要敬畏耶和华―你的 神，事奉他，指着他的名起誓。","rv|Deuteronomy 6:13":"A Jehová tu Dios temerás, y á él servirás, y por su nombre jurarás.","web|Deuteronomy 6:16":"You shall not tempt Yahweh your God, as you tempted him in Massah.","cuv|Deuteronomy 6:16":"「你们不可试探耶和华―你们的 神，像你们在玛撒那样试探他。","rv|Deuteronomy 6:16":"No tentaréis á Jehová vuestro Dios, como lo tentasteis en Massa.","web|Exodus 20:12":"“Honor your father and your mother, that your days may be long in the land which Yahweh your God gives you.","cuv|Exodus 20:12":"「当孝敬父母，使你的日子在耶和华―你 神所赐你的地上得以长久。","rv|Exodus 20:12":"Honra á tu padre y á tu madre, porque tus días se alarguen en la tierra que Jehová tu Dios te d 10":"For whoever keeps the whole law, and yet stumbles in one point, he has become guilty of all.","cuv|James 2:10":"因为凡遵守全律法的，只在一条上跌倒，他就是犯了众条。","rv|James 2:10":"Porque cualquiera que hubiere guardado toda la ley, y ofendiere en un punto, es hecho culpado de todos.","web|Job 1:8-11":"8 Yahweh said to Satan, “Have you considered my servant, Job? For there is no one like him in the earth, a blameless and an upright man, one who fears God, and turns away from evil.” 9 Then Satan answered Yahweh, and said, “Does Job fear God for nothing? 10 Haven’t you made a hedge around him, and around his house, and around all that he has, on every side? You have blessed the work of his hands, and his substance is increased in the land. 11 But stretch out your hand now, and touch all that he has, and he will renounce you to your face.”","cuv|Job 1:8-11":"8 耶和华问撒但说：「你曾用心察看我的仆人约伯没有？地上再没有人像他完全正直，敬畏 神，远离恶事。」 9 撒但回答耶和华说：「约伯敬畏 神，岂是无故呢？ 10 你岂不是四面圈上篱笆围护他和他的家，并他一切所有的吗？他手所做的都蒙你赐福；他的家产也在地上增多。 11 你且伸手毁他一切所有的；他必当面弃掉你。」","rv|Job 1:8-11":"8 Y Jehová dijo á Satán: ¿No has considerado á mi siervo Job, que no hay otro como él en la tierra, varón perfecto y recto, temeroso de Dios, y apartado de mal? 9 Y respondiendo Satán á Jehová, dijo: ¿Teme Job á Dios de balde? 10 ¿No le has tú cercado á él, y á su casa, y á todo lo que tiene en derredor? Al trabajo de sus manos has dado bendición; por tanto su hacienda ha crecido sobre la tierra. 11 Mas extiende ahora tu mano, y toca á todo lo que tiene, y verás si no te blasfema en tu rostro.","web|Job 2:4-5":"4 Satan answered Yahweh, and said, “Skin for skin. Yes, all that a man has he will give for his life. 5 But stretch out your hand now, and touch his bone and his flesh, and he will renounce you to your face.”","cuv|Job 2:4-5":"4 撒但回答耶和华说：「人以皮代皮，情愿舍去一切所有的，保全性命。 5 你且伸手伤他的骨头和他的肉，他必当面弃掉你。」","rv|Job 2:4-5":"4 Y respondiendo Satán dijo á Jehová: Piel por piel, todo lo que el hombre tiene dará por su vida. 5 Mas extiende ahora tu mano, y toca á su hueso y á su car 「经上记着说：人活着，不是单靠食物，乃是靠 神口里所出的一切话。」 5 魔鬼就带他进了圣城，叫他站在殿顶（顶：原文是翅）上， 6 对他说：「你若是 神的儿子，可以跳下去，因为经上记着说：主要为你吩咐他的使者用手托着你，免得你的脚碰在石头上。」 7 耶稣对他说：「经上又记着说：『不可试探主―你的 神。』」 8 魔鬼又带他上了一座最高的山，将世上的万国与万国的荣华都指给他看， 9 对他说：「你若俯伏拜我，我就把这一切都赐给你。」 10 耶稣说：「撒但（就是抵挡的意思，乃魔鬼的别名），退去吧！因为经上记着说：当拜主－你的 神，单要事奉他。」 11 于是，魔鬼离了耶稣，有天使来伺候他。","rv|Matthew 4:3-11":"3 Y llegándose á él el tentador, dijo: Si eres Hijo de Dios, di que estas piedras se hagan pan. 4 Mas él respondiendo, dijo: Escrito está: No con solo el pan vivirá el hombre, mas con toda palabra que sale de la boca de Dios. 5 Entonces el diablo le pasa á la santa ciudad, y le pone sobre las almenas del templo, 6 Y le dice: Si eres Hijo de Dios, échate abajo; que escrito está: A sus ángeles mandará por ti, y te alzarán en las manos, para que nunca tropieces con tu pie en piedra. 7 Jesús le dijo: Escrito está además: No tentarás al Señor tu Dios. 8 Otra vez le pasa el diablo á un monte muy alto, y le muestra todos los reinos del mundo, y su gloria, 9 Y dícele: Todo esto te daré, si postrado me adorares. 10 Entonces Jesús le dice: Vete, Satanás, que escrito está: Al Señor tu Dios adorarás y á él solo servirás. 11 El diablo entonces le dejó: y he aquí los ángeles llegaron y le servían.","web|Matthew 5:28":"but I tell you that everyone who gazes at a woman to lust after her has committed adultery with her already in his heart.","cuv|Matthew 5:28":"只是我告诉你们，凡看见妇女就动淫念的，这人心里已经与她犯奸淫了。","rv|Matthew 5:28":"Mas yo os digo, que cualquiera que mira á una mujer para codiciarla, ya adulteró con ella en su corazón.","web|Revelation 20:12-13":"12 I saw the dead, the great and the small, standing before the throne, and they opened books. Another book was opened, which is the book of life. The dead were judged out of the things which were written in the books, according to their works. 13 The sea gave up the dead who were in it. Death and Hades gave up the dead who were in them. They were judged, each one according to his works.","cuv|Revelation 20:12-13":"12 我又看见死了的人，无论大小，都站在宝座前。案卷展开了，并且另有一卷展开，就是生命册。死了的人都凭着这些案卷所记载的，照他们所行的受审判。 13 于是海交出其中的死人；死亡和阴间也交出其中的死人；他们都照各人所行的受审判。","rv|Revelation 20:12-13":"12 Y vi los muertos, grandes y pequeños, que estaban delante de Dios; y los libros fueron abiertos: y otro libro fué abierto, el cual es de la vida: y fueron juzgados los muertos por las cosas que estaban escritas en los libros, según sus obras. 13 Y el mar dió los muertos que estaban en él; y la muerte y el infierno dieron los muertos que estaban en ellos; y fué hecho juicio de cada uno según sus obras.","web|Revelation 20:4":"I saw thrones, and they sat on them, and judgment was given to them. I saw the souls of those who had been beheaded for the testimony of Jesus, and for the word of God, and such as didn’t worship the beast nor his image, and didn’t receive the mark on their forehead and on their hand. They lived, and reigned with Christ for a thousand years.","cuv|Revelation 20:4":"我又看见几个宝座，也有坐在上面的，并有审判的权柄赐给他们。我又看见那些因为给耶稣作见证，并为 神之道被斩者的灵魂，和那没有拜过兽与兽像，也没有在额上和手上受过他印记之人的灵魂，他们都复活了，与基督一同作王一千年。","rv|Revelation 20:4":"Y vi tronos, y se sentaron sobre ellos, y les fué dado juicio; y vi las almas de los degollados por el testimonio de Jesús, y por la palabra de Dios, y que no habían adorado la bestia, ni á su imagen, y que no recibieron la señal en sus frentes, ni en sus manos; y vivieron y reinaron con Cristo mil años.","web|Matthew 22:37-38":"37 Jesus said to him, “‘You shall love the Lord your God with all your heart, with all your soul, and with all your mind.’ 38 This is the first and great commandment.","cuv|Matthew 22:37-38":"37 耶稣对他说：「你要尽心、尽性、尽意爱主―你的 神。 38 这是诫命中的第一，且是最大的。","rv|Matthew 22:37-38":"37 Y Jesús le dijo: Amarás al Señor tu Dios de todo tu corazón, y de toda tu alma, y de toda tu mente. 38 Este es el primero y el grande mandamiento.","web|Matthew 22:39":"A second likewise is this, ‘You shall love your neighbor as yourself.’","cuv|Matthew 22:39":"其次也相仿，就是要爱人如己。","rv|Matthew 22:39":"Y el segundo es semejante á éste: Amarás á tu prójim var ACC={a:'[aáàâä]',e:'[eéèêë]',i:'[iíìîï]',o:'[oóòôö]',u:'[uúùûü]',n:'[nñ]'};
function termRx(t){return t.replace(/[.*+?^${}()|[\]\\]/g,'\\$&').replace(/[aeioun]/gi,function(c){return ACC[c.toLowerCase()]||c})}
function makeMatcher(q,tr){q=String(q).trim();var phrase=/^".+"$/.test(q);q=q.replace(/^"|"$/g,'').trim();
if(tr=='cuv'||/[\u4e00-\u9fff]/.test(q)){var terms=phrase?[q]:q.split(/\s+/).filter(Boolean);
return{test:function(t){for(var k=0;k<terms.length;k++)if(t.indexOf(terms[k])<0)return false;return true},
mark:function(t){var h=esc(t);terms.forEach(function(x){h=h.split(esc(x)).join('<mark>'+esc(x)+'</mark>')});return h}}}
var parts=phrase?[q]:q.split(/\s+/).filter(Boolean);
var rxs=parts.map(function(p){return new RegExp('(^|[^\\p{L}\\p{N}])('+termRx(p).replace(/\s+/g,'\\s+')+')','iu')});
var all=new RegExp('(^|[^\\p{L}\\p{N}])('+parts.map(function(p){return termRx(p).replace(/\s+/g,'\\s+')}).join('|')+')','giu');
return{test:function(t){for(var k=0;k<rxs.length;k++)if(!rxs[k].test(t))return false;return true},
mark:function(t){return esc(t).replace(all,'$1<mark>$2</mark>')}}}
function searchBible(d,q,tr){var m=makeMatcher(q,tr),hits=[];
for(var b=0;b<d.b.length;b++){var bk=d.b[b];if(!bk)continue;for(var c=0;c<bk.length;c++){var ch=bk[c];if(!ch)continue;for(var v=0;v<ch.length;v++){var t=ch[v];if(t&&m.test(t))hits.push([b,c,v])}}}
return{hits:hits,m:m}}
