<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Yeshua Died for You</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#f3f3f8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0a0c19" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Yeshua">
<meta name="format-detection" content="telephone=no">
<meta name="description" content="The gospel in 7 stages: an interactive walk from the unseen world to a life in Christ. English, 中文, Español.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<style>
/* Layout: "from darkness to light" — a night hero that the reader walks out of, a 7-colour journey track,
   reading column + sticky concordance on the right. Stage colour (--ac) is reassigned per stage by paint(). */
:root{
--bg:#f3f3f8;--fg:#15182b;--mut:#5b5f78;--card:#ffffff;--ln:#e2e2ec;--soft:#ecebf4;--chip:#e6e4f5;
--ac:#3b3a8f;--on:#ffffff;
--night:#0b0e22;--night2:#171b3d;--star:#f6e7bf;--gold:#d8a945;--gold2:#f3d58a;
--f-display:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,"Noto Serif","Liberation Serif","DejaVu Serif","Songti SC","STSong","Noto Serif CJK SC","Source Han Serif SC",Georgia,serif;
--f-label:Optima,Candara,"Palatino Linotype",Georgia,"Noto Serif","Liberation Serif","DejaVu Serif","Songti SC","STSong",serif;
--f-body:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif;
--r:20px;--shadow:0 1px 2px rgba(20,22,50,.05),0 10px 30px -12px rgba(20,22,50,.18);
color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){
--bg:#0a0c19;--fg:#ebecf7;--mut:#a3a7c4;--card:#13162a;--ln:#262a48;--soft:#181c33;--chip:#21264a;--on:#0a0c19;
--shadow:0 1px 2px rgba(0,0,0,.3),0 14px 34px -14px rgba(0,0,0,.6);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0a0c19;--fg:#ebecf7;--mut:#a3a7c4;--card:#13162a;--ln:#262a48;--soft:#181c33;--chip:#21264a;--on:#0a0c19;
--shadow:0 1px 2px rgba(0,0,0,.3),0 14px 34px -14px rgba(0,0,0,.6);color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:120px;scroll-behavior:smooth}
body{margin:0;color:var(--fg);font:1.03rem/1.65 var(--f-body);background:var(--bg);
background-image:radial-gradient(1100px 520px at 100% -10%,color-mix(in srgb,var(--ac) 13%,transparent),transparent 70%),
 radial-gradient(800px 420px at -10% 30%,color-mix(in srgb,var(--ac) 7%,transparent),transparent 70%);
background-attachment:fixed;transition:background-color .5s}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:45;background:var(--bg)}
h1,h2,h3{text-wrap:balance}
button,select,input{font:inherit;color:var(--fg);background:var(--card);border:1px solid var(--ln);border-radius:12px;padding:9px 14px}
button{cursor:pointer;transition:transform .18s ease,background .25s,color .25s,box-shadow .25s,border-color .25s}
button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
input:focus{border-color:var(--ac);box-shadow:0 0 0 4px color-mix(in srgb,var(--ac) 16%,transparent);outline:none}
.on{background:var(--ac);color:var(--on);border-color:var(--ac)}
.w{max-width:1360px;margin:0 auto;padding-block:0 70px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#c{container-type:inline-size;min-width:0}
@media(min-width:960px){.w{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:0 28px;grid-template-rows:auto auto 1fr auto auto}
.top{grid-column:1/-1}#c{grid-column:1;grid-row:2/4}.sidebar{grid-column:2;grid-row:2;position:sticky;top:calc(env(safe-area-inset-top,0px) + 128px);align-self:start;max-height:calc(100vh - 148px);overflow-y:auto;scrollbar-width:thin}
#nav{grid-column:1;grid-row:4}#ft{grid-column:1/-1;grid-row:5}}

/* ---------- top bar ---------- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;margin:0 calc(-1 * max(16px,env(safe-area-inset-left,0px))) 22px;
padding:10px max(16px,env(safe-area-inset-left,0px)) 0;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(14px) saturate(1.3);-webkit-backdrop-filter:blur(14px) saturate(1.3);border-bottom:1px solid var(--ln)}
.row{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;background:none;border:0;padding:4px 0;font:600 1.35rem/1 var(--f-display);color:var(--fg);letter-spacing:.01em}
.brand .cross{position:relative;display:grid;place-items:center;width:34px;height:34px;border-radius:10px;background:var(--night);color:var(--gold2);font-size:1rem;flex:none;
box-shadow:0 0 0 1px color-mix(in srgb,var(--gold) 40%,transparent),0 0 18px -2px color-mix(in srgb,var(--gold) 60%,transparent)}
.brand:hover{transform:none}.brand:hover .cross{box-shadow:0 0 0 1px var(--gold),0 0 26px 0 color-mix(in srgb,var(--gold) 75%,transparent)}
.mini{padding:6px 11px;font-size:.84rem;border-radius:999px;font-weight:600}
.mini:hover{border-color:var(--ac)}
.steps{display:flex;gap:4px;margin-top:10px;overflow-x:auto;scrollbar-width:none;padding-bottom:10px}
.steps::-webkit-scrollbar{display:none}
.steps button{flex:1 0 auto;min-width:44px;padding:7px 8px 6px;border-radius:10px;font:600 .82rem/1.1 var(--f-label);letter-spacing:.06em;text-align:center;position:relative;
border:1px solid var(--ln);background:var(--card);color:var(--mut)}
.steps button span{display:block;font:500 .7rem/1.2 var(--f-body);letter-spacing:0;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:16ch;margin-inline:auto}
@media(max-width:820px){.steps button span{display:none}}
.steps button::after{content:"";position:absolute;left:10px;right:10px;bottom:-1px;height:3px;border-radius:3px;background:var(--sc);opacity:.35;transition:opacity .25s}
.steps button.done::after{opacity:.9}
.steps button:hover{color:var(--fg);border-color:var(--sc)}
.steps button.on{background:var(--sc);border-color:var(--sc);color:#fff}
.steps button.on span{color:#fff}
.prog{position:absolute;left:0;bottom:-1px;height:2px;width:0;background:linear-gradient(90deg,var(--ac),var(--gold));transition:width .1s linear}

/* ---------- hero ---------- */
.hero{position:relative;overflow:hidden;border-radius:28px;color:#eef0ff;padding:56px 48px 44px;isolation:isolate;
background:radial-gradient(600px 400px at 78% 30%,rgba(216,169,69,.22),transparent 70%),radial-gradient(900px 500px at 10% 120%,rgba(90,80,210,.35),transparent 70%),linear-gradient(160deg,var(--night2),var(--night) 60%);
box-shadow:0 30px 60px -30px rgba(10,12,40,.55)}
.hero canvas{position:absolute;inset:0;width:100%;height:100%;z-index:-1}
.hero .beam{position:absolute;z-index:-1;top:-30%;right:14%;width:220px;height:160%;transform:rotate(14deg);
background:linear-gradient(180deg,rgba(243,213,138,.0),rgba(243,213,138,.16) 40%,rgba(243,213,138,0));filter:blur(18px);animation:beam 9s ease-in-out infinite alternate}
@keyframes beam{from{opacity:.55;transform:rotate(12deg) translateX(-10px)}to{opacity:1;transform:rotate(16deg) translateX(14px)}}
.hero .crossart{position:absolute;right:7%;top:50%;transform:translateY(-50%);width:min(210px,24%);z-index:-1;opacity:.95}
.crossart path{fill:none;stroke:var(--gold2);stroke-width:2.2;stroke-linecap:round;stroke-dasharray:420;stroke-dashoffset:0;animation:draw 2.6s cubic-bezier(.6,.1,.2,1) both}
.crossart .glow{stroke:var(--gold);stroke-width:10;opacity:.28;filter:blur(6px)}
@keyframes draw{from{stroke-dashoffset:420}to{stroke-dashoffset:0}}
.hero-in{max-width:620px;position:relative}
.eyebrow{display:inline-flex;align-items:center;gap:10px;font:600 .74rem/1 var(--f-label);letter-spacing:.24em;text-transform:uppercase;color:var(--gold2)}
.eyebrow::before{content:"";width:28px;height:1px;background:currentColor}
h1{font:600 clamp(2.4rem,5.2cqi,4.1rem)/1.04 var(--f-display);margin:18px 0 16px;letter-spacing:-.01em}
h1 em{font-style:italic;color:var(--gold2)}
.lede{color:#c6c9e6;font-size:1.08rem;max-width:36em;margin:0 0 26px}
.cta{display:flex;gap:12px;flex-wrap:wrap}
.cta .go{background:linear-gradient(135deg,var(--gold2),var(--gold));color:#1b1606;border:0;font-weight:700;padding:14px 26px;border-radius:14px;box-shadow:0 10px 30px -8px rgba(216,169,69,.6)}
.cta .go:hover{transform:translateY(-2px);box-shadow:0 16px 34px -8px rgba(216,169,69,.75)}
.cta .ghost{background:rgba(255,255,255,.06);color:#eef0ff;border:1px solid rgba(255,255,255,.2);padding:14px 22px;border-radius:14px}
.cta .ghost:hover{background:rgba(255,255,255,.12)}
.hero .jn{margin:34px 0 0;padding-top:18px;border-top:1px solid rgba(255,255,255,.12);font:italic 500 1.12rem/1.45 var(--f-display);color:#dfe1f6;max-width:34em}
.hero .jn b{display:block;font:600 .7rem/1 var(--f-label);letter-spacing:.2em;color:var(--gold2);margin-top:8px;font-style:normal}
@container (max-width:640px){.hero{padding:40px 24px 30px}.hero .crossart{right:-20px;top:24px;transform:none;width:120px;opacity:.5}}

/* ---------- journey track ---------- */
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:44px 0 18px}
.sec-h h2{font:600 1.9rem/1.1 var(--f-display);margin:0}
.sec-h small{color:var(--mut);font-size:.9rem}
.journey{position:relative;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:10px}
.journey::before{content:"";position:absolute;left:7%;right:7%;top:31px;height:3px;border-radius:3px;background:linear-gradient(90deg,var(--j0),var(--j1),var(--j2),var(--j3),var(--j4),var(--j5),var(--j6));opacity:.55}
.jn-node{position:relative;display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;background:none;border:0;padding:0 2px 6px;border-radius:16px;min-width:0}
.jn-node .dot{display:grid;place-items:center;width:64px;height:64px;border-radius:50%;background:var(--card);border:2px solid var(--tc);color:var(--tc);font:700 1.05rem/1 var(--f-label);letter-spacing:.04em;
box-shadow:0 0 0 6px var(--bg);transition:transform .3s cubic-bezier(.2,.9,.3,1.3),box-shadow .3s,background .3s,color .3s}
.jn-node.seen .dot{background:var(--tc);color:#fff}
.jn-node .ttl{display:block;font:600 1.08rem/1.15 var(--f-display);margin-top:6px}
.jn-node .q{display:block;font-size:.8rem;color:var(--mut);line-height:1.35;margin-top:4px}
.jn-node:hover{transform:none}
.jn-node:hover .dot{transform:scale(1.12);box-shadow:0 0 0 6px var(--bg),0 0 0 8px color-mix(in srgb,var(--tc) 35%,transparent),0 10px 30px -4px var(--tc)}
.jn-node .chk{position:absolute;top:-2px;left:calc(50% + 18px);width:20px;height:20px;border-radius:50%;background:var(--gold);color:#1b1606;font-size:.7rem;font-weight:800;display:grid;place-items:center;box-shadow:0 0 0 3px var(--bg)}
@container (max-width:760px){
.journey{grid-template-columns:1fr;gap:4px}
.journey::before{left:31px;right:auto;top:20px;bottom:20px;width:3px;height:auto;background:linear-gradient(180deg,var(--j0),var(--j1),var(--j2),var(--j3),var(--j4),var(--j5),var(--j6))}
.jn-node{flex-direction:row;text-align:left;gap:16px;padding:6px 8px 6px 0;align-items:center}
.jn-node .dot{width:58px;height:58px;flex:none;margin-left:3px}
.jn-node .ttl{margin:0}.jn-node .chk{left:44px;top:2px}}

/* ---------- shared surfaces ---------- */
.glow{position:relative;isolation:isolate}
.glow::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:-1;opacity:0;transition:opacity .3s;
background:radial-gradient(260px circle at var(--mx,50%) var(--my,50%),color-mix(in srgb,var(--ac) 18%,transparent),transparent 70%)}
.glow:hover::after{opacity:1}
.ex{margin-top:38px}
.ex>h3{display:flex;align-items:center;gap:12px;font:600 .78rem/1 var(--f-label);letter-spacing:.2em;margin:0 0 16px;color:var(--ac);text-transform:uppercase}
.ex>h3::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,color-mix(in srgb,var(--ac) 40%,transparent),transparent)}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.cards>div{background:var(--card);border:1px solid var(--ln);border-radius:18px;padding:18px 18px 16px;font-size:.93rem;box-shadow:var(--shadow);transition:transform .25s,border-color .25s}
.cards>div:hover{border-color:color-mix(in srgb,var(--ac) 45%,var(--ln))}
.cards b{display:block;font:600 1.18rem/1.2 var(--f-display);color:var(--ac);margin-bottom:6px}
.lb{display:block;color:var(--mut);font:600 .64rem/1 var(--f-label);text-transform:uppercase;letter-spacing:.14em;margin-top:10px;margin-bottom:2px}
.hint{color:var(--mut);font-size:.85rem;margin:8px 0 0}

/* ---------- stage ---------- */
.sheet{background:var(--card);border:1px solid var(--ln);border-radius:28px;overflow:hidden;box-shadow:0 30px 70px -40px color-mix(in srgb,var(--ac) 60%,transparent)}
.head{position:relative;overflow:hidden;padding:40px 40px 34px;color:#fff;isolation:isolate;
background:radial-gradient(500px 300px at 85% 0%,rgba(255,255,255,.22),transparent 70%),linear-gradient(135deg,color-mix(in srgb,var(--ac) 88%,#000),color-mix(in srgb,var(--ac) 55%,var(--night)))}
.head .numeral{position:absolute;right:28px;bottom:-40px;font:700 13rem/1 var(--f-label);color:#fff;opacity:.1;z-index:-1;letter-spacing:-.02em;pointer-events:none}
.head .sweep{position:absolute;inset:0;z-index:-1;background:linear-gradient(105deg,transparent 30%,rgba(255,255,255,.14) 45%,transparent 60%);transform:translateX(-100%);animation:sweep 2.4s .3s ease-out forwards}
@keyframes sweep{to{transform:translateX(100%)}}
.head .k{display:flex;align-items:center;gap:10px;font:600 .74rem/1 var(--f-label);letter-spacing:.22em;text-transform:uppercase;opacity:.9}
.head .k i{font-style:normal;display:flex;gap:4px}
.head .k i u{display:block;width:16px;height:4px;border-radius:2px;background:rgba(255,255,255,.3);text-decoration:none}
.head .k i u.y{background:#fff}
.head h2{font:600 clamp(2.3rem,5cqi,3.6rem)/1.02 var(--f-display);margin:14px 0 10px;letter-spacing:-.01em}
.head .q{font:italic 500 1.3rem/1.35 var(--f-display);margin:0;opacity:.92}
.body{padding:30px 40px 40px}
@container (max-width:640px){.head{padding:30px 22px 26px}.body{padding:22px 20px 28px}.head .numeral{font-size:8rem;right:10px;bottom:-26px}}
.lead{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}
.rem{position:relative;background:color-mix(in srgb,var(--ac) 9%,var(--card));border:1px solid color-mix(in srgb,var(--ac) 25%,var(--ln));border-radius:20px;padding:22px 22px 20px}
.rem small,.keyv small{display:block;font:600 .68rem/1 var(--f-label);letter-spacing:.2em;text-transform:uppercase;color:var(--ac);margin-bottom:10px}
.rem p{margin:0;font:600 1.32rem/1.32 var(--f-display)}
.keyv{position:relative;background:var(--night);color:#eef0ff;border-radius:20px;padding:22px 22px 18px;overflow:hidden;cursor:pointer;border:1px solid transparent;text-align:left;width:100%;font:inherit}
.keyv::before{content:"\201C";position:absolute;right:14px;top:-26px;font:700 8rem/1 var(--f-display);color:var(--ac);opacity:.35;pointer-events:none}
.keyv small{color:var(--gold2)}
.keyv .vtx{display:block;font:italic 500 1.2rem/1.42 var(--f-display);margin:0 0 12px;color:#f2f3ff}
.keyv .ref{font:600 .78rem/1 var(--f-label);letter-spacing:.12em;color:var(--gold2)}
.keyv:hover{transform:translateY(-2px);box-shadow:0 18px 40px -16px var(--ac)}
ol.pts{list-style:none;padding:0;margin:34px 0 0;counter-reset:p;position:relative;display:grid;gap:12px}
ol.pts li{counter-increment:p;display:grid;grid-template-columns:52px minmax(0,1fr);gap:16px;padding:18px 20px 18px 16px;border:1px solid var(--ln);border-radius:18px;background:var(--card);transition:border-color .25s,box-shadow .25s}
ol.pts li:hover{border-color:color-mix(in srgb,var(--ac) 40%,var(--ln));box-shadow:var(--shadow)}
.num::before{content:counter(p);display:grid;place-items:center;width:46px;height:46px;border-radius:14px;background:color-mix(in srgb,var(--ac) 12%,var(--card));color:var(--ac);font:700 1.5rem/1 var(--f-display)}
.v{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.v button{background:var(--chip);color:var(--ac);border:1px solid transparent;border-radius:999px;padding:4px 12px;font-size:.82rem;font-weight:600}
.v button:hover{background:var(--ac);color:var(--on);transform:translateY(-1px)}

/* verse banner */
.verse-banner{position:relative;margin:38px -40px 0;padding:44px 64px 40px;text-align:center;overflow:hidden;isolation:isolate;
background:radial-gradient(500px 200px at 50% 0%,color-mix(in srgb,var(--ac) 22%,transparent),transparent 70%),color-mix(in srgb,var(--ac) 7%,var(--card));
border-block:1px solid color-mix(in srgb,var(--ac) 22%,var(--ln))}
.verse-banner::before{content:"\201C";position:absolute;left:50%;top:-34px;transform:translateX(-50%);font:700 9rem/1 var(--f-display);color:var(--ac);opacity:.16;z-index:-1}
.verse-banner .vb-text{font:italic 500 clamp(1.35rem,2.6cqi,1.85rem)/1.38 var(--f-display);max-width:30em;margin:0 auto;color:var(--fg)}
.verse-banner .vb-ref{display:inline-flex;align-items:center;gap:12px;margin-top:16px;font:600 .78rem/1 var(--f-label);letter-spacing:.18em;color:var(--ac);text-transform:uppercase}
.verse-banner .vb-ref::before,.verse-banner .vb-ref::after{content:"";width:30px;height:1px;background:currentColor;opacity:.5}
@container (max-width:640px){.verse-banner{margin-inline:-20px;padding:36px 24px 30px}}

/* icon cards with verse text */
.icon-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px;margin-top:38px}
.icon-card{display:flex;flex-direction:column;text-align:left;gap:0;background:var(--card);border:1px solid var(--ln);border-radius:20px;padding:20px 20px 18px;font:inherit;color:var(--fg);box-shadow:var(--shadow);transition:transform .3s cubic-bezier(.2,.9,.3,1.2),border-color .3s}
.icon-card:hover{border-color:color-mix(in srgb,var(--ac) 50%,var(--ln))}
.icon-card .ic-emoji{display:grid;place-items:center;width:52px;height:52px;border-radius:16px;font-size:1.65rem;line-height:1;background:color-mix(in srgb,var(--ac) 12%,var(--card));margin-bottom:14px;transition:transform .35s}
.icon-card:hover .ic-emoji{transform:rotate(-6deg) scale(1.08)}
.icon-card .ic-label{font:600 1.22rem/1.2 var(--f-display);color:var(--fg)}
.icon-card .ic-desc{font:600 .7rem/1 var(--f-label);letter-spacing:.14em;color:var(--ac);margin-top:8px;text-transform:uppercase}
.icon-card .ic-verse{font:italic 500 1.04rem/1.45 var(--f-display);color:var(--mut);margin-top:12px;padding-top:12px;border-top:1px dashed var(--ln)}
.icon-card .ic-verse.ld{opacity:.6}

/* flow */
.flow{display:flex;flex-wrap:wrap;gap:0;counter-reset:f}
.flow div{counter-increment:f;flex:1 1 150px;position:relative;padding:16px 26px 16px 16px;font-size:.92rem;background:color-mix(in srgb,var(--ac) calc(6% + var(--i,0) * 3%),var(--card));border:1px solid var(--ln);margin:0 -1px -1px 0;transition:background .25s}
.flow div::before{content:counter(f);display:block;font:700 1.4rem/1 var(--f-display);color:var(--ac);margin-bottom:6px}
.flow div:not(:last-child)::after{content:"";position:absolute;right:-9px;top:50%;width:16px;height:16px;transform:translateY(-50%) rotate(45deg);background:inherit;border-top:1px solid var(--ln);border-right:1px solid var(--ln);z-index:1}
.flow div:first-child{border-radius:16px 0 0 16px}.flow div:last-child{border-radius:0 16px 16px 0}
.flow div:hover{background:color-mix(in srgb,var(--ac) 22%,var(--card))}
@container (max-width:640px){.flow{flex-direction:column}.flow div{border-radius:0!important;margin:0 0 -1px}.flow div:first-child{border-radius:16px 16px 0 0!important}.flow div:last-child{border-radius:0 0 16px 16px!important}.flow div:not(:last-child)::after{right:auto;left:24px;top:auto;bottom:-9px;transform:rotate(135deg)}}

/* two-column compare */
.vsg{display:grid;grid-template-columns:1fr 1fr;gap:0;border:1px solid var(--ln);border-radius:18px;overflow:hidden}
.vh{padding:14px 16px;font:600 1.15rem/1.2 var(--f-display);background:var(--soft);color:var(--fg)}
.vh1{background:var(--ac);color:var(--on)}
.vr{padding:12px 16px;border-top:1px solid var(--ln);font-size:.92rem;background:var(--card)}
.vr1{background:color-mix(in srgb,var(--ac) 8%,var(--card));border-left:1px solid color-mix(in srgb,var(--ac) 25%,var(--ln))}
.vsg>div:nth-child(2n+1):not(.vh){border-right:0}

/* stairs: ascending */
.stairs{display:flex;align-items:flex-end;gap:6px;min-height:260px;padding-top:10px}
.stairs div{flex:1 1 0;min-width:0;display:flex;flex-direction:column;justify-content:flex-start;gap:8px;padding:12px 8px;border-radius:14px 14px 4px 4px;font-size:.82rem;font-weight:600;line-height:1.25;text-align:center;transition:transform .3s;transform-origin:bottom}
.stairs div:hover{transform:scaleY(1.03)}
.stairs b{display:grid;place-items:center;width:28px;height:28px;margin:0 auto;border-radius:50%;background:var(--card);color:var(--ac);font:700 .95rem/1 var(--f-display)}
@container (max-width:560px){.stairs{flex-direction:column;align-items:stretch;min-height:0}.stairs div{height:auto!important;flex-direction:row;align-items:center;text-align:left;border-radius:12px;margin-left:var(--ml)!important}.stairs b{margin:0}}

/* timeline */
.tl{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));position:relative;gap:8px}
.tl::before{content:"";position:absolute;left:0;right:0;top:11px;height:2px;background:color-mix(in srgb,var(--ac) 30%,var(--ln))}
.tl div{position:relative;padding-top:34px;font-size:.88rem;color:var(--mut)}
.tl div::before{content:"";position:absolute;left:0;top:3px;width:18px;height:18px;border-radius:50%;background:var(--card);border:3px solid color-mix(in srgb,var(--ac) 45%,var(--ln))}
.tl .now{color:var(--fg);font-weight:700}
.tl .now::before{background:var(--ac);border-color:var(--ac);box-shadow:0 0 0 6px color-mix(in srgb,var(--ac) 22%,transparent);animation:pulse 2s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 11px color-mix(in srgb,var(--ac) 6%,transparent)}}
@container (max-width:620px){.tl{grid-template-columns:1fr}.tl::before{left:8px;right:auto;top:0;bottom:0;width:2px;height:auto}.tl div{padding:4px 0 10px 32px}.tl div::before{top:6px}}

/* stories + ask */
.stories{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.story{background:var(--soft);border-radius:20px;padding:22px 22px 20px;font-size:.94rem;border:1px solid var(--ln)}
.story b{display:block;font:600 1.3rem/1.2 var(--f-display);color:var(--fg);margin-bottom:8px}
.ask{display:grid;gap:12px;padding:22px;border-radius:22px;background:linear-gradient(160deg,var(--night2),var(--night));}
.ask div{position:relative;max-width:84%;padding:14px 18px;border-radius:20px 20px 20px 6px;background:rgba(255,255,255,.08);color:#eef0ff;font:italic 500 1.2rem/1.38 var(--f-display);border:1px solid rgba(255,255,255,.1)}
.ask div:nth-child(even){justify-self:end;border-radius:20px 20px 6px 20px;background:color-mix(in srgb,var(--ac) 60%,var(--night));border-color:transparent}

/* svg art */
svg.art{display:block;width:100%;max-width:460px;margin:4px auto}
.rings text{text-anchor:middle;fill:var(--fg);font-family:var(--f-body)}
.rg0{fill:color-mix(in srgb,var(--ac) 8%,var(--card));stroke:var(--ac);stroke-width:1.5}
.rg1{fill:color-mix(in srgb,var(--ac) 20%,var(--card));stroke:var(--ac);stroke-width:1.5}
.rg2{fill:color-mix(in srgb,var(--ac) 38%,var(--card));stroke:var(--ac);stroke-width:1.5}
.rings circle{transition:filter .3s}.rings circle:hover{filter:drop-shadow(0 0 10px var(--ac))}
.t1{font-size:15px;font-weight:700}.t2{font-size:12px}
.tabs .z{fill:var(--card);stroke:var(--ac);stroke-width:1.5}
.tabs .h{fill:color-mix(in srgb,var(--ac) 18%,var(--card));stroke:var(--ac)}
.tabs .m{fill:color-mix(in srgb,var(--ac) 40%,var(--card));stroke:var(--ac)}
.tabs .vl{stroke:var(--ac);stroke-width:4;stroke-dasharray:4 3}
.tabs text{fill:var(--fg);font-size:11px;text-anchor:middle;font-family:var(--f-body)}
.tabs .s{font-size:10px;fill:var(--mut)}

/* nav */
.nav{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:20px}
.nav button{display:flex;flex-direction:column;align-items:flex-start;gap:4px;padding:18px 20px;border-radius:20px;text-align:left;background:var(--card)}
.nav button small{font:600 .68rem/1 var(--f-label);letter-spacing:.18em;text-transform:uppercase;color:var(--mut)}
.nav button strong{font:600 1.4rem/1.15 var(--f-display)}
.nav button:hover{transform:translateY(-2px);border-color:var(--tc,var(--ac));box-shadow:var(--shadow)}
.nav .next{grid-column:2;align-items:flex-end;text-align:right;background:var(--tc,var(--ac));border-color:var(--tc,var(--ac));color:#fff}
.nav .next small{color:rgba(255,255,255,.8)}

/* overview */
.ov{display:grid;gap:12px}
.ov button{display:grid;grid-template-columns:64px minmax(0,1fr);gap:18px;align-items:start;text-align:left;padding:18px 20px;border-radius:20px;background:var(--card)}
.ov button:hover{border-color:var(--tc);transform:translateX(4px)}
.ov .dot{display:grid;place-items:center;width:56px;height:56px;border-radius:50%;background:var(--tc);color:#fff;font:700 1rem/1 var(--f-label)}
.ov h3{margin:0;font:600 1.45rem/1.15 var(--f-display)}
.ov p{margin:4px 0 0;color:var(--mut);font-size:.94rem}
.ov .kv{margin-top:8px;font:600 .72rem/1 var(--f-label);letter-spacing:.14em;color:var(--tc);text-transform:uppercase}

/* sidebar concordance */
.sidebar{background:var(--card);border:1px solid var(--ln);border-radius:24px;padding:22px 20px;box-shadow:var(--shadow)}
@media(max-width:959px){.sidebar{margin-top:28px}}
.sidebar h4{margin:0 0 4px;font:600 1.55rem/1.1 var(--f-display)}
.sidebar .sub{color:var(--mut);font-size:.84rem;margin:0 0 14px}
.sidebar .srch{position:relative;display:flex;gap:8px;margin:0 0 12px}
.sidebar .srch input{flex:1;min-width:0;border-radius:14px;padding-left:38px;background:var(--soft)}
.sidebar .srch::before{content:"";position:absolute;left:14px;top:50%;width:11px;height:11px;border:2px solid var(--mut);border-radius:50%;transform:translateY(-62%)}
.sidebar .srch::after{content:"";position:absolute;left:25px;top:57%;width:6px;height:2px;background:var(--mut);transform:rotate(45deg)}
.sidebar .srch button{border-radius:14px;font-weight:600}
.lbl{display:block;font:600 .66rem/1 var(--f-label);letter-spacing:.2em;text-transform:uppercase;color:var(--mut);margin:18px 0 10px}
.sidebar .sug,.tps{display:flex;flex-wrap:wrap;gap:6px}
.sidebar .sug button,.tps button{background:var(--soft);color:var(--fg);border:1px solid var(--ln);border-radius:999px;padding:5px 12px;font-size:.8rem;text-align:left}
.sidebar .sug button:hover,.tps button:hover,.tps button.on{background:var(--ac);color:var(--on);border-color:var(--ac)}
.tps{max-height:220px;overflow-y:auto;scrollbar-width:thin;padding-right:2px}
.res{margin-top:4px}
.res button{display:block;width:100%;text-align:left;background:var(--soft);border:1px solid var(--ln);border-radius:14px;padding:11px 14px;margin-bottom:8px;font-size:.9rem}
.res button:hover{border-color:var(--ac);transform:translateX(2px)}
.res b{display:block;font:600 .74rem/1.2 var(--f-label);letter-spacing:.08em;color:var(--ac);margin-bottom:4px}

/* verse panel */
.back{position:fixed;inset:0;background:rgba(5,7,20,.55);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);z-index:50;display:none}
.back.open{display:block;animation:fd .25s}
.panel{position:fixed;z-index:51;left:50%;transform:translateX(-50%);bottom:0;width:min(600px,100%);max-height:84vh;overflow:auto;background:var(--card);border:1px solid var(--ln);border-radius:26px 26px 0 0;
padding:26px max(24px,env(safe-area-inset-right,0px)) calc(26px + env(safe-area-inset-bottom,0px)) max(24px,env(safe-area-inset-left,0px));display:none;box-shadow:0 40px 80px -20px rgba(0,0,0,.5)}
.panel.open{display:block;animation:up .32s cubic-bezier(.2,.9,.3,1)}
@media(min-width:640px){.panel{bottom:auto;top:50%;transform:translate(-50%,-50%);border-radius:26px}.panel.open{animation:pop .3s cubic-bezier(.2,.9,.3,1.2)}}
@keyframes fd{from{opacity:0}}@keyframes up{from{transform:translate(-50%,40px);opacity:0}}@keyframes pop{from{transform:translate(-50%,-46%) scale(.96);opacity:0}}
.panel h4{margin:0 40px 0 0;font:600 1.9rem/1.1 var(--f-display);color:var(--fg)}
.panel .x{position:absolute;top:16px;right:16px;border:0;background:var(--soft);border-radius:50%;width:36px;height:36px;padding:0}
.vtext{position:relative;background:var(--soft);border-radius:18px;padding:20px 22px;margin:16px 0 12px;font:italic 500 1.28rem/1.5 var(--f-display);white-space:pre-wrap}
.vsrc{color:var(--mut);font-size:.8rem;margin:-4px 0 14px}
.vlinks{display:flex;flex-wrap:wrap;gap:8px}
.vlinks a{text-decoration:none;background:var(--chip);color:var(--ac);border-radius:999px;padding:8px 14px;font-size:.86rem;font-weight:600;transition:background .2s,color .2s}
.vlinks a:hover{background:var(--ac);color:var(--on)}
.tgl{display:flex;gap:6px;margin-top:14px}
.tgl button{padding:5px 12px;font-size:.78rem;border-radius:999px;font-weight:700;letter-spacing:.06em}
small.ft{display:block;color:var(--mut);margin-top:40px;font-size:.8rem;text-align:center}
/* tooltip */
.vtip{position:fixed;z-index:60;width:min(380px,88vw);background:var(--night);color:#eef0ff;border:1px solid rgba(255,255,255,.1);border-radius:18px;
padding:16px 18px;box-shadow:0 20px 50px -10px rgba(0,0,0,.45);font:italic 500 1.08rem/1.45 var(--f-display);
pointer-events:none;opacity:0;transform:translateY(6px);transition:opacity .2s,transform .2s;white-space:pre-wrap}
.vtip.show{opacity:1;transform:none}
.vtip .vt-ref{display:block;font:600 .7rem/1 var(--f-label);letter-spacing:.14em;color:var(--gold2);margin-bottom:8px;font-style:normal}
.vtip .vt-ld{opacity:.6}
.srch{display:flex;gap:8px;margin:14px 0 10px}.srch input{flex:1;min-width:0}
.sug{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.sug button{background:var(--chip);color:var(--ac);border:0;border-radius:999px;padding:6px 12px;font-size:.84rem}
.set label{display:block;font-size:.85rem;color:var(--mut);margin:12px 0 4px}
.set input,.set select{width:100%}
.warn{background:color-mix(in srgb,#c2344d 12%,var(--card));border-left:4px solid #c2344d;border-radius:12px;padding:11px 13px;font-size:.86rem;margin-top:12px}
.ok{color:#1a8a52;font-weight:600;font-size:.86rem}.bad{color:#c2344d;font-weight:600;font-size:.86rem}


/* ===== motion + interaction layer ===== */
.js .rv{opacity:0;transform:translateY(26px);transition:opacity .8s cubic-bezier(.2,.8,.2,1),transform .8s cubic-bezier(.2,.8,.2,1)}
.js .rv.in{opacity:1;transform:none}
.js .rv .st{opacity:0;transform:translateY(16px) scale(.98);transition:opacity .6s ease,transform .6s cubic-bezier(.2,.9,.3,1.15);transition-delay:calc(var(--d,0) * 90ms + .12s)}
.js .rv.in .st{opacity:1;transform:none}
.js .rv .ask>.st{transition-delay:calc(var(--d,0) * 520ms + .25s)}
.js .rv .stairs>.st{transform:scaleY(.15);transform-origin:bottom;transition-duration:.7s}
.js .rv.in .stairs>.st{transform:none}
.js .rv .tl::before{transform:scaleX(0);transform-origin:left;transition:transform 1.2s .2s cubic-bezier(.6,.1,.2,1)}
.js .rv.in .tl::before{transform:none}
.ex>h3{position:relative}
.js .rv>h3::after{transform:scaleX(0);transform-origin:left;transition:transform 1s .25s cubic-bezier(.6,.1,.2,1)}
.js .rv.in>h3::after{transform:none}

/* stage head: drifting light + parallax numeral */
.head::after{content:"";position:absolute;inset:-40%;z-index:-1;pointer-events:none;opacity:.55;
background:radial-gradient(2px 2px at 20% 30%,#fff,transparent 60%),radial-gradient(1.5px 1.5px at 70% 60%,#fff,transparent 60%),radial-gradient(2px 2px at 40% 80%,#fff,transparent 60%),radial-gradient(1.5px 1.5px at 85% 20%,#fff,transparent 60%),radial-gradient(1px 1px at 55% 45%,#fff,transparent 60%);
background-size:260px 200px;animation:drift 38s linear infinite}
@keyframes drift{to{transform:translate(260px,-200px)}}
.head .numeral{transform:translateY(var(--py,0px));transition:transform .1s linear}
.head .orb{position:absolute;z-index:-1;width:260px;height:260px;border-radius:50%;filter:blur(40px);opacity:.45;background:color-mix(in srgb,var(--ac) 40%,#fff);left:-60px;top:-120px;animation:orb 12s ease-in-out infinite alternate;pointer-events:none}
@keyframes orb{to{transform:translate(120px,60px) scale(1.2)}}

/* key verse typewriter caret */
.keyv .vtx.typing::after{content:"";display:inline-block;width:2px;height:1.05em;margin-left:3px;vertical-align:-.15em;background:var(--gold2);animation:blink .8s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
.keyv{transition:transform .3s,box-shadow .3s}
.keyv::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:linear-gradient(115deg,transparent 35%,rgba(243,213,138,.14) 50%,transparent 65%);background-size:250% 100%;animation:shine 5s 1.5s ease-in-out infinite}
@keyframes shine{0%{background-position:120% 0}40%,100%{background-position:-60% 0}}

/* tilt cards */
.icon-card,.cards>div,.story{transform:perspective(800px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg)) translateY(var(--ty,0px));will-change:transform}
.icon-card:hover,.cards>div:hover{--ty:-4px}
.js .rv.in .icon-card.st,.js .rv.in .cards>div.st,.js .rv.in .story.st{transform:perspective(800px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg)) translateY(var(--ty,0px))}
.icon-card .ic-verse{transition:color .3s}
.icon-card:hover .ic-verse{color:var(--fg)}

/* points: active highlight on scroll */
ol.pts li{position:relative;overflow:hidden}
ol.pts li::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--ac);transform:scaleY(0);transform-origin:top;transition:transform .6s cubic-bezier(.6,.1,.2,1)}
ol.pts li.in::before{transform:none}
ol.pts li.in .num::before{background:var(--ac);color:var(--on);transition:background .5s,color .5s}

/* flow: step-through */
.flow div{cursor:pointer;transition:background .45s,color .45s,transform .45s cubic-bezier(.2,.9,.3,1.3),box-shadow .45s}
.flow div.lit{background:var(--ac);color:var(--on);z-index:2}
.flow div.lit::before{color:var(--on)}
.flow div.lit:not(:last-child)::after{border-color:transparent}
.flow div.cur{transform:translateY(-4px);box-shadow:0 14px 30px -12px var(--ac)}
.flowbar{display:flex;align-items:center;gap:10px;margin-top:12px}
.flowbar button{border-radius:999px;padding:6px 14px;font-size:.8rem;font-weight:600;background:var(--chip);color:var(--ac);border:0}
.flowbar button:hover{background:var(--ac);color:var(--on)}
.flowbar i{flex:1;height:3px;border-radius:3px;background:var(--ln);position:relative;overflow:hidden;font-style:normal}
.flowbar i b{position:absolute;inset:0 auto 0 0;width:var(--fp,0%);background:linear-gradient(90deg,var(--ac),var(--gold));transition:width .5s}

/* rings explorer */
.ringx{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:24px;align-items:center}
@container (max-width:640px){.ringx{grid-template-columns:1fr}}
.ringx svg.art{max-width:400px;overflow:visible}
.ringx circle{cursor:pointer;transition:opacity .45s,stroke-width .45s,filter .45s}
.ringx.has circle{opacity:.38}
.ringx.has circle.act{opacity:1;stroke-width:3.5;filter:drop-shadow(0 0 14px var(--ac))}
.ringx text{pointer-events:none;transition:opacity .45s}
.ringx.has text{opacity:.45}.ringx.has text.act{opacity:1}
.rlist{display:grid;gap:10px}
.rlist button{display:grid;grid-template-columns:42px 1fr;gap:14px;align-items:center;text-align:left;padding:14px 16px;border-radius:18px;background:var(--card)}
.rlist button .rn{display:grid;place-items:center;width:42px;height:42px;border-radius:50%;font:700 .9rem/1 var(--f-label);background:color-mix(in srgb,var(--ac) 12%,var(--card));color:var(--ac);transition:background .3s,color .3s}
.rlist button strong{display:block;font:600 1.2rem/1.2 var(--f-display)}
.rlist button span span{display:block;font-size:.85rem;color:var(--mut)}
.rlist button.act{border-color:var(--ac);box-shadow:0 12px 30px -16px var(--ac);transform:translateX(4px)}
.rlist button.act .rn{background:var(--ac);color:var(--on)}

/* compare rows */
.vsg .vr{transition:background .25s}
.vsg .vr.hl{background:color-mix(in srgb,var(--ac) 16%,var(--card))}

/* quick check */
.check{margin-top:44px;border-radius:26px;padding:28px 28px 24px;position:relative;overflow:hidden;isolation:isolate;
background:radial-gradient(420px 220px at 100% 0%,color-mix(in srgb,var(--ac) 30%,transparent),transparent 70%),linear-gradient(160deg,var(--night2),var(--night));color:#eef0ff}
.check small{display:block;font:600 .7rem/1 var(--f-label);letter-spacing:.22em;text-transform:uppercase;color:var(--gold2)}
.check h4{font:600 clamp(1.4rem,3cqi,1.9rem)/1.2 var(--f-display);margin:12px 0 18px}
.check .opts{display:grid;gap:10px}
.check .opts button{display:flex;align-items:center;gap:12px;text-align:left;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14);color:#eef0ff;border-radius:16px;padding:13px 16px;font-size:.98rem}
.check .opts button i{display:grid;place-items:center;flex:none;width:28px;height:28px;border-radius:50%;border:1px solid rgba(255,255,255,.3);font:700 .78rem/1 var(--f-label);font-style:normal}
.check .opts button:hover{background:rgba(255,255,255,.12);transform:translateX(3px)}
.check .opts button.good{background:#1a8a52;border-color:#3fd18a}
.check .opts button.good i{background:#fff;color:#1a8a52;border-color:#fff}
.check .opts button.bad{animation:shake .45s;background:rgba(194,52,77,.35);border-color:#ff8fa6}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
.check .fb{min-height:0;margin-top:14px;font:italic 500 1.1rem/1.45 var(--f-display);color:#dfe1f6}
.check .fb b{font-style:normal;font-family:var(--f-body);color:var(--gold2)}
.check .fb button{margin-left:6px;background:none;border:0;color:var(--gold2);padding:0;text-decoration:underline;font:inherit;font-style:normal}
.check.done{box-shadow:0 0 0 2px #3fd18a inset}
canvas.confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:70}
@media(prefers-reduced-motion:reduce){.js .rv,.js .rv .st{opacity:1!important;transform:none!important}}


/* ===== stage visuals ===== */
.vis{margin:34px 0 0;padding:0}
.vframe{position:relative;border-radius:24px;overflow:hidden;box-shadow:0 30px 60px -34px rgba(10,12,40,.7);background:#0b0e22;line-height:0}
.vframe svg{display:block;width:100%;height:auto}
.vtag{position:absolute;right:12px;bottom:10px;line-height:1;font:600 .62rem/1 var(--f-label);letter-spacing:.14em;text-transform:uppercase;color:#fff;opacity:.7;background:rgba(0,0,0,.35);padding:5px 8px;border-radius:999px}
.vis figcaption{margin:14px 2px 0;font:600 clamp(1.25rem,2.6cqi,1.6rem)/1.25 var(--f-display);color:var(--fg)}
.vctl{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;align-items:center}
.vctl button{border-radius:999px;padding:10px 16px;font-weight:600;font-size:.9rem;min-height:44px}
.vctl button.on{background:var(--ac);color:var(--on);border-color:var(--ac)}
.vctl .pri{background:var(--ac);color:var(--on);border-color:var(--ac)}
.vctl .pri:hover{filter:brightness(1.1);transform:translateY(-1px)}
.vctl button:disabled{opacity:.4;cursor:default;transform:none}
.vinfo{margin-top:12px;display:flex;flex-wrap:wrap;gap:8px 10px;align-items:center;min-height:44px;font-size:.96rem}
.vinfo:empty{display:none}
.vinfo b{font:600 1.2rem/1.2 var(--f-display);color:var(--ac);width:100%}
.vinfo span{flex:1 1 260px}
.vchip{background:var(--chip);color:var(--ac);border:0;border-radius:999px;padding:6px 12px;font-size:.82rem;font-weight:700;min-height:34px}
.vchip:hover{background:var(--ac);color:var(--on)}
.orb{transition:transform 1.2s cubic-bezier(.6,.1,.2,1)}
.orb circle:first-child{animation:pulse2 2.2s ease-in-out infinite}
@keyframes pulse2{50%{opacity:.2}}
/* heavens */
.hv .dim{fill:#04050f;opacity:0;transition:opacity .7s}
.hv.sel .dim{opacity:.55}.hv.sel .dim.on{opacity:0}
.hv .hvl line{stroke:#f3d58a;stroke-dasharray:6 6;opacity:.5}
.hvt{fill:#fff;font:700 15px var(--f-label);letter-spacing:.14em;text-transform:uppercase;paint-order:stroke;stroke:rgba(0,0,0,.45);stroke-width:3px;transition:opacity .5s}
.hv.sel .hvt{opacity:.5}.hv.sel .hvt.on{opacity:1}
/* sin */
#spL,#spR{transition:transform .9s cubic-bezier(.6,.1,.2,1)}
#spBeam,#spFl,#spHalo{transition:opacity .9s}
.sp .spl{fill:#f3d58a;font:700 15px var(--f-label);letter-spacing:.12em;text-anchor:middle;text-transform:uppercase}
.sp .crk{opacity:0;transition:opacity .6s .3s}.sp .crk.on{opacity:1}
.sp .crk text{fill:#ffb3c1;font:600 13px var(--f-body);text-anchor:middle}
.crl{display:grid;gap:8px;width:100%}
.crl>div{display:flex;align-items:center;gap:10px;justify-content:space-between;padding:10px 14px;border-radius:14px;border:1px solid var(--ln);background:var(--card);opacity:.45;transition:opacity .5s,border-color .5s}
.crl>div.on{opacity:1;border-color:#c2344d;color:var(--fg);background:color-mix(in srgb,#c2344d 7%,var(--card))}
.spEnd{display:flex;flex-wrap:wrap;gap:10px;align-items:center;width:100%}
.spEnd[hidden]{display:none}
.sl{display:flex;align-items:center;gap:12px;font:700 .8rem/1 var(--f-label);letter-spacing:.14em;text-transform:uppercase;color:#c2344d;flex:1}
.sl input{flex:1;accent-color:#c2344d;padding:0;border:0;background:none;min-height:44px}
/* tabernacle */
.tb .tbl text{font:600 12px var(--f-body);fill:#3a2a1a;text-anchor:middle}
.tb .veil{transition:transform 1.1s cubic-bezier(.6,.1,.2,1)}
#vT{transform-origin:615px 118px}#vB{transform-origin:615px 262px}
.torn #vT{transform:rotate(-62deg)}.torn #vB{transform:rotate(62deg)}
#tbGlow,#tbFlood{transition:opacity 1.4s .4s}
.torn #tbGlow{opacity:1}.torn #tbFlood{opacity:.8}
.tb .flm{animation:flick 1.6s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:bottom}
@keyframes flick{to{transform:scaleY(.86) scaleX(1.08)}}
.tb .smk{stroke-dasharray:4 4;animation:smk 3s linear infinite}
@keyframes smk{to{stroke-dashoffset:-24}}
/* scale */
#scB,.sc .pan{transition:transform .9s cubic-bezier(.4,1.4,.5,1)}
#scCross{transition:transform .8s cubic-bezier(.5,0,.5,1.3),opacity .3s}
#scDebt{transition:opacity 1s}
#scDebt text{fill:#ffb3c1;font:700 14px var(--f-body);text-anchor:middle}
/* stairs */
.sr .stp{cursor:pointer}
.sr .stp rect:first-child{transition:filter .5s}
.sr .stp.on rect:first-child{filter:brightness(1.45) saturate(1.2)}
.sr .sn{fill:#fff;font:700 20px var(--f-display);text-anchor:middle;opacity:.85}
.sr .st2{fill:#fff3cc;font:600 11.5px var(--f-body);text-anchor:middle;opacity:.6;transition:opacity .4s}
.sr .stp.on .st2{opacity:1}
/* vine */
.vn .br{cursor:pointer;transition:transform 1.1s cubic-bezier(.5,0,.3,1)}
.vn .bs{fill:none;stroke:#6b4a2b;stroke-width:7;stroke-linecap:round;transition:stroke 1s}
.vn .lf{fill:#3f8a4a;stroke:#2a6234;stroke-width:1;transition:fill 1.2s .3s,stroke 1.2s .3s}
.vn .gr circle{fill:#5b2d6e;transition:opacity .8s .3s}
.vn .yl{fill:#3a2a1a;font:700 15px var(--f-label);letter-spacing:.12em;text-transform:uppercase}
.vn .br:hover .bs{stroke:#8a5f36}
.vn .br.cut{transform:translate(0,46px) rotate(14deg)}
.vn .br[data-br="0"].cut,.vn .br[data-br="2"].cut,.vn .br[data-br="4"].cut{transform:translate(0,46px) rotate(-14deg)}
.vn .br.cut .bs{stroke:#9b8058}.vn .br.cut .lf{fill:#b59a5a;stroke:#8a7040}.vn .br.cut .gr circle{opacity:0}
/* ring verse refs */
.rlist .rref{display:inline-block;margin-top:6px;font:700 .74rem/1 var(--f-body);color:var(--ac);background:var(--chip);padding:5px 10px;border-radius:999px}
.vis.plain .ex{margin-top:0}
/* guess */
.guess{margin-top:34px;padding:22px 22px 18px;border-radius:22px;border:2px dashed color-mix(in srgb,var(--ac) 45%,var(--ln));background:color-mix(in srgb,var(--ac) 6%,var(--card))}
.guess small{display:block;font:600 .7rem/1 var(--f-label);letter-spacing:.22em;text-transform:uppercase;color:var(--ac)}
.guess .gq{font:600 clamp(1.3rem,2.8cqi,1.7rem)/1.25 var(--f-display);margin:10px 0 14px}
.gopts{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px}
.gopts button{min-height:52px;font:600 1.15rem/1.2 var(--f-display);border-radius:16px}
.gopts button:hover{border-color:var(--ac);transform:translateY(-2px)}
.gopts button.good{background:#1a8a52;color:#fff;border-color:#1a8a52}
.gopts button.bad{background:color-mix(in srgb,#c2344d 18%,var(--card));border-color:#c2344d;animation:shake .45s}
.guess.done .gopts button:not(.good):not(.bad){opacity:.5}
.grev{margin-top:14px;font:italic 500 1.12rem/1.45 var(--f-display)}
.grev .vchip{font-style:normal}
.grev b{font-style:normal;font-family:var(--f-body);color:var(--ac)}
/* go deeper */
details.deep{margin-top:40px;border:1px solid var(--ln);border-radius:22px;background:var(--soft);overflow:hidden}
details.deep>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:14px;padding:18px 22px;min-height:44px}
details.deep>summary::-webkit-details-marker{display:none}
details.deep>summary b{font:600 1.35rem/1.1 var(--f-display)}
details.deep>summary span{color:var(--mut);font-size:.88rem;flex:1}
details.deep>summary i{font-style:normal;display:grid;place-items:center;width:34px;height:34px;border-radius:50%;background:var(--ac);color:var(--on);transition:transform .3s}
details.deep[open]>summary i{transform:rotate(45deg)}
details.deep>.dbody{padding:0 22px 26px}
details.deep ol.pts{margin-top:6px}
@container (max-width:640px){.tb .tbl text{font-size:21px}.sr .st2{font-size:14px}.sr .sn{font-size:26px}.hvt{font-size:24px}.sp .spl{font-size:22px}.sp .crk text{font-size:17px}.vn .yl{font-size:24px}#scDebt text{font-size:18px}.vtag{font-size:.55rem}}

/* flip cards */
.fhint{margin:-6px 0 14px;color:var(--mut);font-size:.86rem}
.flips{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px}
.flips.six{grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
.flip{perspective:1100px;cursor:pointer;outline:none;border-radius:20px}
.flip:focus-visible{outline:2px solid var(--ac);outline-offset:3px}
.flip .fi{display:grid;height:100%;transition:transform .75s cubic-bezier(.3,.7,.2,1);transform-style:preserve-3d}
@media(hover:hover){.flip:hover .fi{transform:rotateY(180deg)}}
.flip.f .fi,.flip:focus-visible .fi{transform:rotateY(180deg)}
.flip .ff,.flip .fb{grid-area:1/1;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:20px;padding:20px 20px 16px;display:flex;flex-direction:column;gap:6px;min-height:210px}
.flip .ff{background:var(--card);border:1px solid var(--ln);box-shadow:var(--shadow)}
.flip .fb{transform:rotateY(180deg);background:radial-gradient(260px 160px at 100% 0%,color-mix(in srgb,var(--ac) 40%,transparent),transparent 70%),linear-gradient(160deg,var(--night2),var(--night));color:#eef0ff;border:1px solid color-mix(in srgb,var(--ac) 40%,transparent)}
.icw{display:grid;place-items:center;width:54px;height:54px;border-radius:16px;background:color-mix(in srgb,var(--ac) 12%,var(--card));color:var(--ac);margin-bottom:8px;flex:none}
.ico{width:34px;height:34px}
.flip .ff b{font:600 1.3rem/1.2 var(--f-display)}
.flip .pp{font:600 .62rem/1 var(--f-label);letter-spacing:.16em;text-transform:uppercase;color:var(--mut);margin-top:6px}
.flip .fs{font-size:.92rem;color:var(--fg)}
.flip .rf{margin-top:auto;padding-top:10px;font:700 .74rem/1.2 var(--f-body);color:var(--ac)}
.flip .rf i{font-style:normal;display:inline-block;transition:transform .6s}
.flip:hover .rf i{transform:rotate(180deg)}
.flip .rr{font:600 .7rem/1 var(--f-label);letter-spacing:.16em;text-transform:uppercase;color:var(--gold2)}
.flip .fv{font:italic 500 1.04rem/1.45 var(--f-display);color:#f2f3ff;max-height:9.4em;overflow-y:auto;scrollbar-width:thin;padding-right:4px}
.flip .fv.ld{opacity:.6}
.flip .fc{margin-top:auto;display:flex;flex-wrap:wrap;gap:6px}
.flip .fb .vchip{background:rgba(255,255,255,.1);color:var(--gold2)}
.flip .fb .vchip:hover{background:var(--gold2);color:#1b1606}
.fnote{margin:14px 0 0;font:italic 500 1.15rem/1.45 var(--f-display);display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.fnote .vchip{font-style:normal}
/* shadow -> fulfilment */
.shw .slots{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
@container (max-width:640px){.shw .slots{grid-template-columns:1fr}}
.sh{perspective:1100px}
.sh .shi{display:grid;transition:transform .9s cubic-bezier(.3,.7,.2,1);transition-delay:calc(var(--n) * .18s);transform-style:preserve-3d;height:100%}
.shw.new .sh .shi{transform:rotateY(180deg)}
.sh .so,.sh .sn{grid-area:1/1;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:20px;padding:20px;display:flex;flex-direction:column;align-items:flex-start;gap:8px;min-height:200px}
.sh .so{background:var(--soft);border:1px dashed var(--ln);color:var(--mut)}
.sh .so b{font:600 1.2rem/1.25 var(--f-display);color:var(--fg)}
.sh .so .icw{filter:grayscale(.7);opacity:.75}
.sh .sn{transform:rotateY(180deg);background:radial-gradient(240px 140px at 50% 0%,rgba(243,213,138,.35),transparent 70%),linear-gradient(160deg,var(--night2),var(--night));color:#eef0ff;border:1px solid rgba(243,213,138,.45);box-shadow:0 18px 40px -20px rgba(216,169,69,.7)}
.sh .sn .icw{background:rgba(243,213,138,.15);color:var(--gold2)}
.sh .sn b{font:600 1.25rem/1.25 var(--f-display);color:#fff}
.sh .sn>span{font-size:.88rem;color:#d6d9f2}
.sh .shc{display:flex;flex-wrap:wrap;gap:6px;margin-top:auto}
.sh .sn .vchip{background:rgba(255,255,255,.1);color:var(--gold2)}
.shbar{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-top:14px}
.shbar button{border-radius:999px;padding:11px 20px;font-weight:700;min-height:44px}
.shbar .pri{background:var(--ac);color:var(--on);border-color:var(--ac)}
.shw .z{display:none}.shw.new .z{display:inline}.shw.new .a{display:none}
.shn{font:italic 500 1.08rem/1.4 var(--f-display);flex:1 1 260px}
.shn .vchip{font-style:normal}
/* religion vs redemption */
.relig{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@container (max-width:560px){.relig{grid-template-columns:1fr}}
.rgp{border-radius:22px;padding:24px 22px;display:flex;flex-direction:column;align-items:flex-start;gap:8px;position:relative;overflow:hidden}
.rgp b{font:600 1.45rem/1.15 var(--f-display)}
.rgp.mn{background:var(--soft);border:1px solid var(--ln);color:var(--mut)}
.rgp.mn b{color:var(--fg)}
.rgp.mn .icw{color:var(--mut);background:var(--card)}
.rgp.mn:hover .ico{animation:fall 1.4s ease-in-out infinite}
@keyframes fall{0%{transform:translateY(0)}40%{transform:translateY(-8px)}70%,100%{transform:translateY(4px)}}
.rgp.gd{background:radial-gradient(300px 200px at 50% -20%,rgba(243,213,138,.5),transparent 70%),linear-gradient(160deg,var(--night2),var(--night));color:#e5e7fb;border:1px solid rgba(243,213,138,.4)}
.rgp.gd b{color:#fff}.rgp.gd .icw{background:rgba(243,213,138,.15);color:var(--gold2)}
.rgp.gd .ico{animation:descend 2.2s ease-in-out infinite}
@keyframes descend{0%{transform:translateY(-6px);opacity:.4}60%{transform:translateY(3px);opacity:1}100%{transform:translateY(3px);opacity:1}}
.rgp.gd .vchip{background:rgba(255,255,255,.1);color:var(--gold2)}
.rgc{margin:14px 0 0;font:600 1.3rem/1.35 var(--f-display);text-align:center}
.note{margin:12px 0 0;font:italic 600 1.15rem/1.4 var(--f-display);color:var(--ac)}
/* hoverable references in text */
.vref{color:var(--ac);font-weight:600;border-bottom:1px dotted currentColor;cursor:help;white-space:nowrap}
.vref:hover,.vref:focus{background:var(--chip);border-radius:4px;outline:none}
.fb .vref,.sn .vref{color:var(--gold2)}


/* live it */
.live{margin-top:44px;padding:26px 26px 28px;border-radius:28px;background:linear-gradient(170deg,color-mix(in srgb,var(--ac) 10%,var(--card)),var(--card) 60%);border:1px solid color-mix(in srgb,var(--ac) 30%,var(--ln))}
@container (max-width:640px){.live{padding:20px 16px;margin-inline:-6px}}
.lvh{display:flex;gap:14px;align-items:center;margin-bottom:18px}
.lvh .icw{margin:0}
.lvh h3{margin:0;font:600 1.9rem/1.1 var(--f-display)}
.lvh p{margin:4px 0 0;color:var(--mut);font-size:.88rem}
.ltg{display:grid;gap:16px}
.lt{background:var(--card);border:1px solid var(--ln);border-radius:20px;padding:20px;box-shadow:var(--shadow)}
.lt h4{margin:0 0 12px;font:600 1.3rem/1.25 var(--f-display)}
.lt h5{margin:0 0 8px;font:600 .7rem/1 var(--f-label);letter-spacing:.18em;text-transform:uppercase;color:var(--ac)}
.lsub{margin:-4px 0 12px;color:var(--mut);font-size:.9rem;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.lt textarea{width:100%;min-height:96px;border-radius:14px;background:var(--soft);resize:vertical;font:1rem/1.5 var(--f-body);padding:12px 14px}
.lt .pri{background:var(--ac);color:var(--on);border-color:var(--ac);border-radius:999px;font-weight:700;min-height:44px;padding:10px 20px;margin-top:12px}
/* sort */
.sortl{display:grid;gap:8px}
.srt{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:10px;align-items:center;padding:10px 12px;border-radius:14px;border:1px solid var(--ln);background:var(--soft);transition:background .3s,border-color .3s}
@container (max-width:560px){.srt{grid-template-columns:1fr}}
.srt b{font-weight:600}
.sbt{display:flex;gap:6px}.sbt button{border-radius:999px;padding:7px 12px;font-size:.84rem;min-height:40px}
.srt .sres{display:none}
.srt.ok{background:color-mix(in srgb,#1a8a52 12%,var(--card));border-color:#1a8a52}.srt.no{background:color-mix(in srgb,#c2344d 10%,var(--card));border-color:#c2344d}
.srt.ok .sres,.srt.no .sres{display:block}
.srt.ok b::after{content:" ✓";color:#1a8a52}.srt.no b::after{content:" ✗";color:#c2344d}
.lscore{margin:10px 0 0;font:italic 600 1.08rem/1.4 var(--f-display);color:var(--ac)}
/* man of spirit */
.mosl{display:grid;gap:12px}
.mos{display:grid;grid-template-columns:40px minmax(0,1fr);gap:12px}
.mos .mn{display:grid;place-items:center;width:40px;height:40px;border-radius:50%;background:var(--ac);color:var(--on);font:700 1.1rem/1 var(--f-display)}
.mos b{font:600 1.18rem/1.2 var(--f-display)}
.mos p{margin:4px 0 8px;color:var(--mut);font-size:.92rem}
.rate{display:flex;flex-wrap:wrap;gap:6px}.rate button{border-radius:999px;padding:6px 12px;font-size:.82rem;min-height:38px}
/* lenses */
.lens{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.lens button{border-radius:999px;padding:9px 16px;font-weight:600;min-height:44px}
.lens button.act{background:var(--ac);color:var(--on);border-color:var(--ac)}
.lens button.bib{border-color:var(--ac)}
.lensd{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@container (max-width:560px){.lensd{grid-template-columns:1fr}}
.lensd>div{background:var(--soft);border-radius:14px;padding:12px 14px}
.lensd small{display:block;font:600 .64rem/1 var(--f-label);letter-spacing:.16em;text-transform:uppercase;color:var(--mut);margin-bottom:6px}
.lensd b{font:600 1.1rem/1.3 var(--f-display)}
.lensx{grid-column:1/-1;display:flex;gap:8px;background:none!important;padding:0!important}
/* share, grace */
.sharet{font:italic 500 1.12rem/1.55 var(--f-display);margin:0;padding:16px 18px;border-left:3px solid var(--ac);background:var(--soft);border-radius:0 14px 14px 0}
.grr{display:flex;gap:6px;margin:0 0 10px}
.gql{display:block;font-size:.86rem;font-weight:600;color:var(--mut);margin-top:10px}
.gql textarea{margin-top:6px;min-height:60px}
/* believe */
.belc{display:grid;grid-template-columns:1fr 1fr;gap:18px}
@container (max-width:640px){.belc{grid-template-columns:1fr}}
.bl{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px dashed var(--ln);font-size:.94rem;cursor:pointer}
.bl input{width:20px;height:20px;accent-color:var(--ac);flex:none;padding:0}
.bl span{flex:1}
.bl .vchip{font-size:.72rem;padding:4px 9px;min-height:0}
.belo{margin-top:14px;padding:14px 16px;border-radius:14px;background:var(--soft);color:var(--mut);font:italic 500 1.1rem/1.5 var(--f-display)}
.belo.on{background:linear-gradient(160deg,var(--night2),var(--night));color:#f2f3ff}
/* week */
.tagx{font:600 .6rem/1 var(--f-label);letter-spacing:.14em;text-transform:uppercase;border:1px solid var(--ln);border-radius:999px;padding:4px 8px}
.wkb{position:relative;height:10px;border-radius:999px;background:var(--soft);margin:4px 0 14px;overflow:visible}
.wkb i{position:absolute;inset:0 auto 0 0;width:var(--w,0%);border-radius:999px;background:linear-gradient(90deg,var(--ac),var(--gold));transition:width .5s}
.wkb span{position:absolute;right:0;top:-22px;font:700 .8rem/1 var(--f-body);color:var(--ac)}
.fnl{display:grid;gap:8px}
.fn{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:14px;border:1px solid var(--ln);background:var(--soft);cursor:pointer}
.fn input{width:22px;height:22px;accent-color:var(--ac);flex:none;padding:0}
.fn span{flex:1;font-size:.92rem}.fn b{display:block;font:600 1.12rem/1.2 var(--f-display)}
.fn:has(input:checked){border-color:var(--ac);background:color-mix(in srgb,var(--ac) 10%,var(--card))}
/* memory */
.memv{font:italic 500 1.3rem/1.6 var(--f-display);margin:0 0 12px}
.mw{transition:background .3s,color .3s;border-radius:4px}
.mw.h{background:color-mix(in srgb,var(--ac) 22%,var(--soft));color:transparent;cursor:pointer;user-select:none}
.memb{display:flex;flex-wrap:wrap;gap:8px;align-items:center}.memb button{border-radius:999px;padding:8px 14px;font-weight:600;min-height:40px}.memb small{color:var(--mut)}
.jq{margin:0 0 10px;font:italic 500 1.14rem/1.45 var(--f-display);display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.jq .vchip{font-style:normal}
.jsv{display:block;height:1em;color:#1a8a52;font-weight:600;margin-top:6px}
/* notes */
.nts{display:grid;gap:10px}
.nt{background:var(--card);border:1px solid var(--ln);border-radius:16px;padding:14px 16px}
.nt small{font:600 .66rem/1 var(--f-label);letter-spacing:.16em;text-transform:uppercase;color:var(--ac)}
.nt p{margin:6px 0 8px;white-space:pre-wrap}
.live .pri{background:var(--ac);color:var(--on);border-color:var(--ac);border-radius:999px;font-weight:700;min-height:44px;padding:10px 20px;margin-top:12px}
.lclear.warnb{border-color:#c2344d;color:#c2344d}
.lclear{margin-top:12px;border-radius:999px;font-size:.82rem;color:var(--mut)}


/* ===== contact ===== */
.contactb{display:inline-flex;align-items:center;gap:8px;border:0;border-radius:999px;padding:8px 16px 8px 13px;font-weight:700;font-size:.88rem;min-height:38px;
background:linear-gradient(135deg,var(--gold2),var(--gold));color:#1b1606;box-shadow:0 6px 18px -8px rgba(216,169,69,.9)}
.contactb svg{width:17px;height:17px}
.contactb:hover{transform:translateY(-1px);box-shadow:0 10px 22px -8px rgba(216,169,69,1)}
@media(max-width:520px){.contactb span{display:none}.contactb{padding:8px 11px}}
.ctback{position:fixed;inset:0;z-index:80;background:rgba(5,7,20,.55);backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px);opacity:0;pointer-events:none;transition:opacity .3s}
.ctback.open{opacity:1;pointer-events:auto}
.ctp{position:fixed;z-index:81;top:0;right:0;bottom:0;width:min(560px,100%);background:var(--card);box-shadow:-30px 0 80px -20px rgba(0,0,0,.5);overflow-y:auto;
transform:translateX(105%);transition:transform .45s cubic-bezier(.2,.9,.3,1);padding:0 0 calc(30px + env(safe-area-inset-bottom,0px));overscroll-behavior:contain}
.ctp.open{transform:none}
.cthead{position:relative;display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:28px 26px 22px;color:#fff;isolation:isolate;overflow:hidden;

<script>
var D=[
["The Spiritual World","属灵世界","El mundo espiritual","Is there more than what we can see?","眼睛所见之外还有什么？","¿Hay algo más de lo que vemos?",[
["Two worlds: the visible (physical) and the invisible (spiritual). The Bible explains how, when and why all things exist.","两个世界：可见的（物质）和不可见的（属灵）。圣经说明万物如何、何时、为何存在。","Dos mundos: el visible (material) y el invisible (espiritual). La Biblia explica cómo, cuándo y por qué existe todo.","Colossians 1:16;Romans 1:19-20;Hebrews 11:3"],
["God: from everlasting to everlasting, self-existent, the only Ruler, greater than all.","神：从永远到永远、自有永有、独一的主宰、比万有都大。","Dios: eterno, existe por sí mismo, el único Soberano, mayor que todos.","Psalm 90:2;Exodus 3:14;1 Timothy 6:15;John 10:29"],
["Three heavens: the sky; the realm under the devil; the spiritual heaven where the throne is.","三层天：天空；魔鬼掌权的空中；属灵的天，宝座所在。","Tres cielos: el firmamento; el dominio del diablo; el cielo espiritual donde está el trono.","Genesis 1:8;Ephesians 2:2;2 Corinthians 12:2"],
["The universe will end, and hell is real.","宇宙将有终结，地狱是真实的。","El universo tendrá fin, y el infierno es real.","2 Peter 3:7-10;Matthew 25:41;Revelation 20:14-15"]]],
["What Is Man?","人是什么？","¿Qué es el hombre?","Who am I, really?","真正的“我”是谁？","¿Quién soy realmente?",[
["Two beings: the visible “me” (flesh, from dust, it expires) and the invisible “me” (spirit, eternal). The spirit is the true me.","两个存在：看得见的“我”（肉体，出于尘土，会朽坏）和看不见的“我”（灵，永存）。灵才是真正的我。","Dos seres: el “yo” visible (carne, del polvo, caduca) y el “yo” invisible (espíritu, eterno). El espíritu es el verdadero yo.","Genesis 2:7;Genesis 1:27"],
["Life after death: Hades, Abraham’s side (OT) and Paradise (NT).","死后的生命：阴间、亚伯拉罕的怀里（旧约）与乐园（新约）。","La vida después de la muerte: el Hades, el seno de Abraham (AT) y el Paraíso (NT).","Luke 8:26-31"],
["Resurrection: Christ is the firstfruit; the saints rise at His second coming; the rest after 1,000 years.","复活：基督是初熟的果子；圣徒在祂再来时复活；其余的人在一千年后。","Resurrección: Cristo es las primicias; los santos resucitan en su segunda venida; los demás después de mil años.","1 Corinthians 15:23;Revelation 20:4-5;Revelation 20:12-15"],
["The man of spirit: “I am a soul! This is my flesh!” Live for eternal life, obey Christ’s word, put the kingdom first.","属灵的人：“我是灵魂！这是我的肉体！”为永生而活，听从基督的话，先求神的国。","El hombre espiritual: “¡Soy un alma! ¡Esta es mi carne!” Vive para la vida eterna, obedece la palabra de Cristo, pon primero el reino.","Matthew 6:25-33;Luke 9:59-62;Romans 8:12-13"]]],
["Sin","罪","El pecado","What went wrong between us and God?","我们与神之间出了什么问题？","¿Qué salió mal entre Dios y nosotros?",[
["The Bible’s definition: sin is separation from God. (Other views: greed, social disorder, a corrupt heart.)","圣经的定义：罪就是与神分离。（其他看法：贪欲、破坏社会秩序、内心败坏。）","Definición bíblica: el pecado es la separación de Dios. (Otras visiones: codicia, desorden social, corazón corrupto.)","1 John 3:8"],
["Origin: the devil sinned first in heaven, then became the father of lies and the first murderer.","起源：魔鬼最先在天上犯罪，后来成为说谎者的父和最初的杀人者。","Origen: el diablo pecó primero en el cielo; luego fue padre de mentira y el primer homicida.","Isaiah 14:12-15;John 8:44;1 John 3:12"],
["Adam’s sin brought death: separation from God, among people, and between flesh and soul.","亚当犯罪带来死亡：与神分离、人与人分离、肉体与灵魂分离。","El pecado de Adán trajo muerte: separación de Dios, entre las personas y entre carne y alma.","Genesis 3:17;Genesis 4:8"],
["Original sin is passed on; sins we commit ourselves are not inherited.","原罪会遗传；自己所犯的罪不会遗传。","El pecado original se transmite; los pecados cometidos personalmente no se heredan.","Revelation 12:9"]]],
["Redemption","救赎","La redención","How was the price of sin paid?","罪的代价是如何偿还的？","¿Cómo se pagó el precio del pecado?",[
["Redemption means paying the price of sin, paying on someone’s behalf, and buying back. Its purpose: forgiveness, cleansing, life.","救赎是偿还罪的代价、代人偿还、并赎回。目的：赦罪、洁净、得生命。","Redención es pagar el precio del pecado, pagar en lugar de otro y rescatar. Su fin: perdón, limpieza, vida.","Leviticus 5:6;Exodus 12:3-13;Hebrews 9:18-22;Leviticus 17:11"],
["In the Old Testament: sin offerings once a year, peace offerings at every occasion, through the priests and sanctuary.","旧约中：每年一次的赎罪祭、每逢场合的平安祭，由祭司和圣所执行。","En el Antiguo Testamento: ofrenda por el pecado una vez al año, ofrenda de paz en cada ocasión, por medio de sacerdotes y santuario.","Leviticus 16:30;Leviticus 16:33-34"],
["Completed in Jesus: the eternal sanctuary, high priest and sacrifice. His blood purified the heavenly sanctuary.","在耶稣里成全：永远的圣所、大祭司和祭物。祂的血洁净了天上的圣所。","Cumplida en Jesús: santuario, sumo sacerdote y sacrificio eternos. Su sangre purificó el santuario celestial.","Hebrews 9:1-3;Hebrews 9:23"],
["The first Adam became a living being; the last Adam is a life-giving spirit. Christianity is not a religion of retribution but faith by grace.","首先的亚当成为有生命的人；末后的亚当成为叫人活的灵。基督教不是报应的宗教，而是因恩典而有的信。","El primer Adán fue un ser viviente; el último Adán es espíritu que da vida. El cristianismo no es una religión de retribución sino fe por gracia.","1 Corinthians 15:45;Ephesians 1:7;1 Peter 1:18-19"]]],
["Grace","恩典","La gracia","What did God freely give?","神白白赐给我们什么？","¿Qué nos dio Dios gratuitamente?",[
["General grace (nature, for all) and special grace (the only begotten Son, for all who believe).","普遍恩典（大自然，给所有人）与特殊恩典（独生子，给所有相信的人）。","Gracia general (la naturaleza, para todos) y gracia especial (el Hijo unigénito, para todos los que creen).","John 3:16"],
["Redemption was done by the Son at the cross for all; forgiveness comes from the Father today to those who believe.","救赎是子在十字架上为众人成就的；赦免是父今日赐给相信之人的。","La redención la hizo el Hijo en la cruz por todos; el perdón lo da el Padre hoy a los que creen.","Ephesians 1:7;Ephesians 2:8"],
["The Law only condemns; the greatest gift is the forgiveness of sin.","律法只是定罪；最大的礼物是罪得赦免。","La Ley solo condena; el mayor regalo es el perdón del pecado.","Romans 3:19-20;Hebrews 10:17-18;1 Corinthians 15:56"],
["Purpose: Jesus alone is my boast. Testify of grace: healing, answered prayer, a changed life, thanks.","目的：唯有耶稣是我的夸耀。见证恩典：医治、祷告蒙应允、生命改变、感恩。","Propósito: solo Jesús es mi orgullo. Testifica la gracia: sanidad, oraciones contestadas, vida transformada, gratitud.","Ephesians 2:9;Ephesians 1:6;2 Corinthians 5:17;John 14:13"]]],
["Faith","信心","La fe","How do I receive it?","我如何领受？","¿Cómo lo recibo?",[
["Self-confidence is subjective, with no guarantee. Faith is objective, based on God’s word: obey, and His promise is 100%.","自信是主观的，没有保证。信心是客观的，建立在神的话上：顺服，神的应许就是百分之百。","La confianza en uno mismo es subjetiva, sin garantía. La fe es objetiva, basada en la palabra de Dios: obedece y su promesa es 100 %.","Hebrews 11:3"],
["Its objects: God, His word, Jesus Christ, His words, the name of Yeshua, and the gospel.","信心的对象：神、神的话、耶稣基督、祂的话、耶书亚的名、福音。","Sus objetos: Dios, su palabra, Jesucristo, sus palabras, el nombre de Yeshúa y el evangelio.","John 6:29;John 20:28;1 Timothy 2:5;John 12:48"],
["The steps: repentance, receive, confession, baptism, the Holy Spirit, obedience, sanctification.","步骤：悔改、接受、认信、受洗、圣灵、顺服、成圣。","Los pasos: arrepentimiento, recibir, confesión, bautismo, Espíritu Santo, obediencia, santificación.","Acts 2:1-4"],
["Born again happens once, through Christ’s works (salvation). Sanctification continues, through obedience (reward).","重生只有一次，借着基督的工作（得救）。成圣是持续的，借着顺服（得奖赏）。","El nuevo nacimiento ocurre una vez, por las obras de Cristo (salvación). La santificación continúa, por obediencia (recompensa).","1 Corinthians 12:4-7"]]],
["The Church Life","教会生活","La vida de iglesia","What now?","接下来呢？","¿Y ahora qué?",[
["The church: called out, gathered and chosen. The body of Christ, the temple of God.","教会：被召出、聚集、被拣选。基督的身体，神的殿。","La iglesia: llamada, reunida y escogida. El cuerpo de Cristo, el templo de Dios.","Ephesians 1:22-23;Colossians 1:24;1 Corinthians 3:16"],
["My soul depends on it: the body and members, the vine and branches, the flock and sheep.","我的灵魂靠它得生命：身体与肢体、葡萄树与枝子、羊群与羊。","Mi alma depende de ella: cuerpo y miembros, vid y pámpanos, rebaño y ovejas.","Matthew 16:16-18;John 15:1-8;Acts 20:28-31"],
["Mission: go and make disciples, baptize, teach them to obey, lead them to receive the Holy Spirit.","使命：去使人作门徒、施洗、教导遵守、带领他们领受圣灵。","Misión: ir y hacer discípulos, bautizar, enseñar a obedecer, guiarlos a recibir el Espíritu Santo.","Matthew 28:19-20;Acts 13:1-3"],

var RB=['There is a visible world and an invisible one, and one God who made both.|有可见的世界，也有不可见的世界，一位神创造了两者。|Hay un mundo visible y uno invisible, y un solo Dios que creó ambos.','I am a soul. The flesh is only my clothing; the spirit is the true me.|我是灵魂。肉体只是衣服，灵才是真正的我。|Soy un alma. La carne es solo mi ropa; el espíritu es el verdadero yo.','Sin is separation from God. It began with Satan, entered through Adam, and every person is born under it.|罪就是与神分离。它始于撒旦，借亚当进入，每个人生来就在罪下。|El pecado es separación de Dios. Comenzó con Satanás, entró por Adán y todo hombre nace bajo él.','Someone had to pay the price of sin. Jesus paid it once for all with His own blood.|罪的代价必须有人偿还。耶稣用自己的血一次永远地偿还了。|Alguien debía pagar el precio del pecado. Jesús lo pagó una vez para siempre con su propia sangre.','Forgiveness is a free gift, already paid for. I only need to receive it.|赦免是白白的礼物，代价已付清，我只需领受。|El perdón es un regalo gratuito, ya pagado. Solo debo recibirlo.','Faith means receiving what Jesus did, then obeying His word to the end.|信心就是领受耶稣所成就的，并顺服祂的话直到底。|La fe es recibir lo que Jesús hizo y obedecer su palabra hasta el fin.','Faith life is church life: I belong to Christ’s body and live in it.|信仰生活就是教会生活：我属于基督的身体，并活在其中。|La vida de fe es la vida de iglesia: pertenezco al cuerpo de Cristo y vivo en él.'];
var QA=[['In your own words, what is the truth?|用你自己的话，什么是真理？|En tus propias palabras, ¿qué es la verdad?','If life is an airplane, where is it heading?|如果人生是一架飞机，它要飞向哪里？|Si la vida es un avión, ¿hacia dónde va?'],['Who am I, really?|真正的我是谁？|¿Quién soy realmente?','Where do I go after I die?|死后我去哪里？|¿A dónde voy cuando muera?'],['In your own words, what is sin?|用你自己的话，什么是罪？|En tus propias palabras, ¿qué es el pecado?','Is a newborn baby spiritually alive or dead?|新生婴儿的灵是活的还是死的？|¿Está un recién nacido espiritualmente vivo o muerto?'],['What is the greatest love anyone can show?|一个人能表现的最大的爱是什么？|¿Cuál es el mayor amor que alguien puede mostrar?','Could a lamb pay for a human life? Who could?|一只羔羊能偿还人的生命吗？谁能？|¿Podría un cordero pagar por una vida humana? ¿Quién podría?'],['What is the biggest gift you have ever received?|你收到过最大的礼物是什么？|¿Cuál es el mayor regalo que has recibido?','Are you forgiven? When, and how do you know?|你被赦免了吗？什么时候？你怎么知道？|¿Estás perdonado? ¿Cuándo y cómo lo sabes?'],['Which is easier: keeping 613 commandments or believing?|哪个更容易：遵守613条诫命，还是相信？|¿Qué es más fácil: guardar 613 mandamientos o creer?','What do I put my trust in today?|我今天把信靠放在什么上？|¿En qué pongo mi confianza hoy?'],['“I believe in God, I don’t need church.” What do you think?|“我信神，不需要教会。”你怎么看？|«Creo en Dios, no necesito iglesia». ¿Qué piensas?','What kind of church is God leading me to?|神要带我去什么样的教会？|¿A qué tipo de iglesia me guía Dios?']];
var M=[
['A story: the airplane~You are born on a luxurious airplane with everything you need. You explore its pools and its views, but rarely ask: where is this airplane heading?|一个故事：飞机~你生在一架豪华的飞机上，一切所需俱全。你探索泳池和风景，却很少问：这架飞机要飞向哪里？|Una historia: el avión~Naces en un avión de lujo con todo lo necesario. Exploras sus piscinas y vistas, pero rara vez preguntas: ¿hacia dónde va este avión?','Creation or evolution?~Three views: progressive creation (many creation events over millions of years), theistic evolution (God guiding life over billions of years) and atheistic evolution (life appears by chance, then mutation and selection).|创造还是进化？~三种看法：渐进创造（数百万年间多次创造）、有神进化（神引导生命进化数十亿年）、无神进化（生命偶然出现，再靠突变和自然选择）。|¿Creación o evolución?~Tres visiones: creación progresiva (muchos actos creativos en millones de años), evolución teísta (Dios guía la vida por miles de millones de años) y evolución atea (la vida surge al azar y luego mutación y selección).'],
['Do I have life?~A person can go many days without food or water, but not without breathing. Yet life (zoë) is more than breath: Jesus is the author of life (Acts 3:15; John 1:4).|我有生命吗？~人可以许多天不吃不喝，却不能不呼吸。但生命（zoë）不只是气息：耶稣是生命的创始者（徒3:15；约1:4）。|¿Tengo vida?~Se puede pasar muchos días sin comer ni beber, pero no sin respirar. Aun así la vida (zoë) es más que aliento: Jesús es el autor de la vida (Hch 3:15; Jn 1:4).','Eat the Word~The flesh lives on bread; the spirit lives on God’s word. Obeying it keeps us in His life (Matt 4:4; John 12:50).|吃神的话~肉体靠饼活着，灵靠神的话活着。顺服神的话，我们就留在祂的生命里（太4:4；约12:50）。|Come la Palabra~La carne vive de pan; el espíritu vive de la palabra de Dios. Obedecerla nos mantiene en su vida (Mt 4:4; Jn 12:50).'],
['Meet “Mr. Nice Guy”~Being nice does not decide heaven or hell. God’s standard is not good behavior but separation from Him, like cut roses that look fresh but are already dying.|认识“好好先生”~好人不等于进天堂。神的标准不是行为好坏，而是是否与祂分离，就像剪下的玫瑰看似新鲜，其实已在枯萎。|Conoce al «buen tipo»~Ser amable no decide el cielo o el infierno. La norma de Dios no es la buena conducta sino la separación de Él, como rosas cortadas que parecen frescas pero ya mueren.','Living in the mud~In a sinful world the patterns of sin (Gal 5:19-21; 2 Tim 3:2-5) feel normal, like someone so used to the mud that they no longer feel dirty.|活在泥里~在罪恶的世界里，罪的样式显得很平常（加5:19-21；提后3:2-5），就像住惯了泥地的人不觉得自己脏。|Viviendo en el barro~En un mundo de pecado, sus patrones (Gá 5:19-21; 2 Ti 3:2-5) parecen normales, como quien se acostumbra al barro y ya no se siente sucio.'],
['The Passover lamb~Redemption has always meant a substitute: the lamb’s blood on the doorposts spared Israel’s firstborn (Exod 12:3-13). It points to Jesus.|逾越节的羔羊~救赎一直是有替代者：羔羊的血涂在门框上，以色列的长子得以存活（出12:3-13）。这指向耶稣。|El cordero de la Pascua~La redención siempre implicó un sustituto: la sangre del cordero en los postes libró a los primogénitos de Israel (Éx 12:3-13). Apunta a Jesús.','Why every year?~Animal blood could never cleanse people perfectly or forever (Heb 10:1-8), so offerings were repeated yearly. Only blood entered the Most Holy Place, because the life is in the blood (Lev 17:11).|为什么每年一次？~牲畜的血不能使人永远完全洁净（来10:1-8），所以每年重复。只有血能进至圣所，因为生命在血中（利17:11）。|¿Por qué cada año?~La sangre de animales nunca limpió perfecta ni eternamente (He 10:1-8), por eso se repetía cada año. Solo la sangre entraba al Lugar Santísimo, porque la vida está en la sangre (Lv 17:11).','The Creator died for creation~Psalm 22 describes the cross a thousand years earlier. Jesus said “It is finished”: there is nothing left for us to pay.|创造者为受造者死~诗篇22篇在一千年前就描述了十字架。耶稣说“成了”：我们已没有什么可偿还。|El Creador murió por la creación~El Salmo 22 describe la cruz mil años antes. Jesús dijo «Consumado es»: ya no queda nada por pagar.'],
['Priceless, not worthless~Grace is too costly to put a price on, so God gave it without a price. It cost the life of God. Faith is how I catch the gift; without grace, faith has nothing to receive.|无价，不是没价值~恩典太宝贵，无法定价，所以神白白赐下，代价是神的生命。信心是接住礼物的手；没有恩典，信心就无物可接。|Sin precio, no sin valor~La gracia es demasiado costosa para ponerle precio, por eso Dios la dio gratis. Costó la vida de Dios. La fe es la mano que recibe; sin gracia, la fe no tiene qué recibir.','Death-row clemency~Like a prisoner told on execution day that he is pardoned, the gospel tells sinners under the Law: your sins are forgiven (Matt 9:2).|死囚得赦免~就像死囚在行刑当天听到被赦免，福音向律法之下的罪人宣告：你的罪赦了（太9:2）。|Indulto en el corredor de la muerte~Como un preso al que el día de su ejecución le anuncian el indulto, el evangelio dice a los pecadores bajo la Ley: tus pecados son perdonados (Mt 9:2).'],
['The delivery at the door~Someone rings the bell with a gift. You cannot see his face clearly, but you trust his word and open the door. Receiving is opening the door; confession is signing for the package.|门口的包裹~有人按门铃送来礼物。你看不清他的脸，却信他的话，开了门。接受就是开门，认信就是签收。|La entrega en la puerta~Alguien toca el timbre con un regalo. No ves bien su cara, pero confías en su palabra y abres. Recibir es abrir la puerta; confesar es firmar la entrega.','Where does faith come from?~Jesus is the author and finisher of faith (Heb 12:2). Faith comes from heaven and must be received as God reveals it, like soil receiving rain (Gal 3:23-24; Matt 13).|信心从哪里来？~耶稣是信心的创始者和完成者（来12:2）。信心从天而来，要照神所启示的领受，像土壤接受雨水（加3:23-24；太13）。|¿De dónde viene la fe?~Jesús es el autor y consumador de la fe (He 12:2). La fe viene del cielo y se recibe como Dios la revela, como la tierra recibe la lluvia (Gá 3:23-24; Mt 13).'],
['Attending is not belonging~A branch must stay attached to the vine. A soul that decides to follow Christ should be joined to the church quickly (John 15:1-8).|参加不等于归属~枝子必须连在葡萄树上。决志跟随基督的人应尽快归入教会（约15:1-8）。|Asistir no es pertenecer~El pámpano debe permanecer unido a la vid. Quien decide seguir a Cristo debe unirse pronto a la iglesia (Jn 15:1-8).','Gathering is the secret~Faith is kept by gathering (Heb 10:25). Worship, prayer and the Holy Spirit’s gifts happen in the gathering, and a church that works to gather is a strong church.|聚会是秘诀~信心靠聚会得以持守（来10:25）。敬拜、祷告和圣灵的恩赐都发生在聚会中，努力聚会的教会就是有力的教会。|Reunirse es el secreto~La fe se conserva reuniéndose (He 10:25). La adoración, la oración y los dones del Espíritu ocurren en la reunión; una iglesia que se esfuerza por reunirse es fuerte.']
];
var W=['Unity~66 books, 40+ authors, 1,500 years, 3 languages, one story: God’s plan to redeem us through Jesus.|统一~66卷书，40多位作者，跨越1500年，3种语言，却是同一个故事：神借耶稣救赎人类的计划。|Unidad~66 libros, más de 40 autores, 1.500 años, 3 idiomas, una sola historia: el plan de Dios para redimirnos por Jesús.','Prophecy~Jesus’ birth, death and resurrection were foretold (Isa 53, Mic 5:2, Ps 22), as were fallen empires (Dan 2) and Israel’s return (Ezek 36–37).|预言~耶稣的降生、受死、复活早有预言（赛53、弥5:2、诗22），列国兴衰（但2）和以色列复国（结36–37）也已应验。|Profecía~El nacimiento, muerte y resurrección de Jesús fueron anunciados (Is 53, Miq 5:2, Sal 22), igual que la caída de imperios (Dn 2) y el regreso de Israel (Ez 36–37).','Evidence~The Dead Sea Scrolls show faithful copying; archaeology confirms places like Jericho and Nineveh.|证据~死海古卷显示抄本传承极准确；考古印证了耶利哥、尼尼微等地。|Evidencia~Los Rollos del Mar Muerto muestran una copia fiel; la arqueología confirma lugares como Jericó y Nínive.','Its own claim~The Bible says all Scripture is God-breathed (2 Tim 3:16).|自身的宣告~圣经说自己都是神所默示的（提后3:16）。|Su propia afirmación~La Biblia dice que toda la Escritura es inspirada por Dios (2 Ti 3:16).'];
