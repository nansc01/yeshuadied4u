<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Yeshua Died for You</title>
<style>
:root{
--bg:#fdfbf6;--fg:#1a1c2e;--mut:#5f6480;--card:#fff;--ln:#e8e4d9;
--ac:#3b3a8f;--on:#fff;--chip:#eceaf8;--soft:#f4f2ec;
color-scheme:light;box-sizing:border-box;
padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){
--bg:#0e1120;--fg:#eceefa;--mut:#a0a6c4;--card:#191d33;--ln:#2a2f50;
--on:#0e1120;--chip:#232849;--soft:#161a2e;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e1120;--fg:#eceefa;--mut:#a0a6c4;--card:#191d33;--ln:#2a2f50;--on:#0e1120;--chip:#232849;--soft:#161a2e;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:70px}
body{margin:0;color:var(--fg);font:17px/1.6 system-ui,-apple-system,"Segoe UI","PingFang SC","Noto Sans CJK SC","Microsoft YaHei",sans-serif;
background:
 radial-gradient(900px 400px at 85% -120px,color-mix(in srgb,var(--ac) 22%,transparent),transparent),
 radial-gradient(700px 360px at 5% 5%,color-mix(in srgb,var(--ac) 12%,transparent),transparent),
 var(--bg);
background-attachment:fixed;transition:background .4s}
.w{max-width:820px;margin:0 auto;padding:14px 16px 60px}
button,select,input{font:inherit;color:var(--fg);background:var(--card);border:1px solid var(--ln);border-radius:12px;padding:9px 13px}
button{cursor:pointer;transition:transform .14s,background .2s,color .2s}
button:hover{transform:translateY(-1px)}
.on{background:var(--ac);color:var(--on);border-color:var(--ac)}

/* top bar */
.top{position:sticky;top:0;z-index:40;margin:0 -16px 10px;padding:8px 16px;
background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--ln)}
.row{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:8px;background:none;border:0;padding:4px 0;font-size:1.05rem;font-weight:700;font-family:Georgia,"Songti SC",serif;color:var(--fg)}
.brand .cross{display:grid;place-items:center;width:30px;height:30px;border-radius:9px;background:var(--ac);color:var(--on);font-size:.95rem;flex:none}
.mini{padding:6px 10px;font-size:.85rem;border-radius:999px}
.steps{display:flex;gap:5px;margin-top:8px;overflow-x:auto;scrollbar-width:none}
.steps::-webkit-scrollbar{display:none}
.steps button{flex:1 0 auto;min-width:36px;padding:7px 0;border-radius:999px;font-weight:700;font-size:.9rem;text-align:center;position:relative}
.steps .done::after{content:"";position:absolute;top:3px;right:6px;width:6px;height:6px;border-radius:50%;background:var(--ac)}
.steps .on.done::after{background:var(--on)}

/* home */
.hero{padding:26px 0 10px}
.eyebrow{display:inline-block;background:var(--chip);color:var(--ac);font-size:.78rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:5px 12px;border-radius:999px}
h1{font-family:Georgia,"Songti SC","Noto Serif SC",serif;font-size:2.5rem;line-height:1.12;margin:14px 0 10px;letter-spacing:-.02em}
.lede{color:var(--mut);font-size:1.12rem;max-width:34em;margin:0 0 18px}
.cta{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:30px}
.cta .go{background:var(--ac);color:var(--on);border:0;font-size:1.05rem;font-weight:700;padding:14px 24px;border-radius:14px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.tile{display:block;text-align:left;padding:0;border:1px solid var(--ln);border-radius:18px;overflow:hidden;background:var(--card)}
.tile .band{height:6px;background:var(--tc)}
.tile .in{padding:15px 16px}
.tile .no{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:9px;background:var(--tc);color:#fff;font-weight:800;font-size:.85rem;margin-bottom:8px}
.tile h3{margin:0 0 4px;font-size:1.08rem;font-family:Georgia,"Songti SC",serif}
.tile p{margin:0;color:var(--mut);font-size:.92rem}
.tile .tick{float:right;color:var(--tc);font-weight:800}

/* stage */
.sheet{background:var(--card);border:1px solid var(--ln);border-radius:22px;overflow:hidden;
box-shadow:0 14px 40px color-mix(in srgb,var(--ac) 14%,transparent)}
.head{padding:22px 24px 18px;background:linear-gradient(135deg,color-mix(in srgb,var(--ac) 20%,var(--card)),color-mix(in srgb,var(--ac) 6%,var(--card)))}
.head .k{display:flex;align-items:center;gap:8px;color:var(--ac);font-size:.78rem;font-weight:800;letter-spacing:.09em;text-transform:uppercase}
.head h2{font-family:Georgia,"Songti SC","Noto Serif SC",serif;font-size:2rem;margin:8px 0 6px;line-height:1.15}
.head .q{font-size:1.12rem;color:var(--ac);font-style:italic;margin:0}
.body{padding:20px 24px 26px}
.rem{display:flex;gap:12px;background:var(--ac);color:var(--on);border-radius:16px;padding:15px 17px;margin:0 0 22px;font-size:1.02rem;font-weight:600}
.rem span:first-child{font-size:1.3rem;line-height:1.2}
ol.pts{list-style:none;padding:0;margin:0 0 6px;counter-reset:p}
ol.pts li{counter-increment:p;display:flex;gap:14px;padding:13px 0;border-top:1px solid var(--ln)}
ol.pts li:first-child{border-top:0;padding-top:0}
.num{flex:none}
.num::before{content:counter(p);display:grid;place-items:center;width:30px;height:30px;border-radius:10px;background:color-mix(in srgb,var(--ac) 16%,var(--card));color:var(--ac);font-weight:800;font-size:.9rem}
.v{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.v button{background:var(--chip);color:var(--ac);border:0;border-radius:999px;padding:4px 11px;font-size:.86rem;font-weight:600}
.v button:hover{background:var(--ac);color:var(--on)}

/* blocks */
.ex{margin-top:26px}
.ex h3{display:flex;align-items:center;gap:8px;font-size:.95rem;margin:0 0 10px;color:var(--ac);text-transform:uppercase;letter-spacing:.06em}
.flow{display:flex;flex-wrap:wrap;gap:18px}
.flow div{flex:1 1 120px;background:color-mix(in srgb,var(--ac) 10%,var(--card));border-radius:14px;padding:11px 13px;position:relative;font-size:.9rem}
.flow div:not(:last-child)::after{content:"\2192";position:absolute;right:-15px;top:50%;transform:translateY(-50%);color:var(--ac);font-weight:800}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px}
.cards>div{background:var(--soft);border:1px solid var(--ln);border-radius:16px;padding:14px 15px;font-size:.92rem}
.cards b{display:block;color:var(--ac);margin-bottom:5px}
.lb{display:block;color:var(--mut);font-size:.7rem;text-transform:uppercase;letter-spacing:.06em;margin-top:7px}
.vsg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.vh{padding:10px 12px;border-radius:12px;font-weight:700;text-align:center;background:var(--chip);color:var(--ac)}
.vh1{background:var(--ac);color:var(--on)}
.vr{padding:10px 12px;border-radius:12px;border:1px solid var(--ln);background:var(--soft);font-size:.9rem}
.vr1{border-color:var(--ac);background:color-mix(in srgb,var(--ac) 11%,var(--card))}
.stairs div{padding:11px 15px;border-radius:13px;margin-bottom:6px;font-size:.92rem;display:flex;gap:11px;align-items:center}
.stairs b{display:grid;place-items:center;width:25px;height:25px;border-radius:50%;background:var(--card);color:var(--ac);font-size:.8rem;flex:none}
.tl{border-left:3px solid var(--ac);margin-left:9px}
.tl div{position:relative;padding:7px 0 11px 20px;font-size:.92rem}
.tl div::before{content:"";position:absolute;left:-10px;top:12px;width:14px;height:14px;border-radius:50%;background:var(--ac);border:3px solid var(--card)}
.tl .now{font-weight:800;color:var(--ac)}
.stories{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:10px}
.story{background:var(--soft);border:1px solid var(--ln);border-left:4px solid var(--ac);border-radius:14px;padding:14px 15px;font-size:.92rem}
.story b{display:block;color:var(--ac);margin-bottom:6px}
.ask{background:var(--ac);color:var(--on);border-radius:18px;padding:4px 18px}
.ask div{padding:12px 0;border-bottom:1px solid color-mix(in srgb,var(--on) 25%,transparent);font-size:.96rem}
.ask div:last-child{border:0}
svg.art{display:block;width:100%;max-width:430px;margin:4px auto}
.rings text{text-anchor:middle;fill:var(--fg);font-family:inherit}
.rg0{fill:color-mix(in srgb,var(--ac) 10%,var(--card));stroke:var(--ac);stroke-width:1.5}
.rg1{fill:color-mix(in srgb,var(--ac) 24%,var(--card));stroke:var(--ac);stroke-width:1.5}
.rg2{fill:color-mix(in srgb,var(--ac) 42%,var(--card));stroke:var(--ac);stroke-width:1.5}
.t1{font-size:15px;font-weight:700}.t2{font-size:12px}
.tabs .z{fill:var(--card);stroke:var(--ac);stroke-width:1.5}
.tabs .h{fill:color-mix(in srgb,var(--ac) 18%,var(--card));stroke:var(--ac)}
.tabs .m{fill:color-mix(in srgb,var(--ac) 40%,var(--card));stroke:var(--ac)}
.tabs .vl{stroke:var(--ac);stroke-width:4;stroke-dasharray:4 3}
.tabs text{fill:var(--fg);font-size:11px;text-anchor:middle;font-family:inherit}
.tabs .s{font-size:10px;fill:var(--mut)}
.hint{color:var(--mut);font-size:.85rem;margin:8px 0 0}

.nav{display:flex;justify-content:space-between;gap:10px;margin-top:18px}
.nav button{font-weight:600}
.nav .next{background:var(--ac);color:var(--on);border-color:var(--ac)}

/* verse panel */
.back{position:fixed;inset:0;background:rgba(5,8,20,.5);z-index:50;display:none}
.back.open{display:block}
.panel{position:fixed;z-index:51;left:50%;transform:translateX(-50%);bottom:0;width:min(560px,100%);
max-height:82vh;overflow:auto;background:var(--card);border:1px solid var(--ln);border-radius:22px 22px 0 0;
padding:18px 20px calc(22px + env(safe-area-inset-bottom,0px));display:none}
.panel.open{display:block}
@media(min-width:640px){.panel{bottom:auto;top:50%;transform:translate(-50%,-50%);border-radius:22px}}
.panel h4{margin:0;font-size:1.25rem;font-family:Georgia,"Songti SC",serif;color:var(--ac)}
.panel .x{position:absolute;top:12px;right:14px;border:0;background:var(--soft);border-radius:50%;width:32px;height:32px;padding:0}
.vtext{background:var(--soft);border-radius:14px;padding:14px 16px;margin:12px 0;font-size:1.02rem;white-space:pre-wrap}
.vsrc{color:var(--mut);font-size:.8rem;margin:-6px 0 12px}
.vlinks{display:flex;flex-wrap:wrap;gap:7px}
.vlinks a{text-decoration:none;background:var(--chip);color:var(--ac);border-radius:999px;padding:7px 13px;font-size:.88rem;font-weight:600}
.vlinks a:hover{background:var(--ac);color:var(--on)}
.tgl{display:flex;gap:6px;margin-bottom:4px}
.tgl button{padding:5px 11px;font-size:.82rem;border-radius:999px}
small.ft{display:block;color:var(--mut);margin-top:26px;font-size:.8rem;text-align:center}
@keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.fade{animation:in .35s ease}

.srch{display:flex;gap:8px;margin:0 0 10px}
.srch input{flex:1;min-width:0;border-radius:12px}
.res{margin-top:4px}
.res button{display:block;width:100%;text-align:left;background:var(--soft);border:1px solid var(--ln);border-left:4px solid var(--ac);border-radius:14px;padding:12px 14px;margin-bottom:8px;font-size:.93rem}
.res b{display:block;color:var(--ac);margin-bottom:3px;font-size:.86rem}
.sug{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.sug button{background:var(--chip);color:var(--ac);border:0;border-radius:999px;padding:6px 12px;font-size:.85rem}
.set label{display:block;font-size:.85rem;color:var(--mut);margin:12px 0 4px}
.set input,.set select{width:100%}
.warn{background:color-mix(in srgb,#c2344d 12%,var(--card));border-left:4px solid #c2344d;border-radius:12px;padding:11px 13px;font-size:.86rem;margin-top:12px}
.ok{color:#1a8a52;font-weight:600;font-size:.86rem}
.bad{color:#c2344d;font-weight:600;font-size:.86rem}
</style></head><body>

 <div class="top">

 </div>

<script>
var D=[
["The Spiritual World","属灵世界","El mundo espiritual","Is there more than what we can see?","眼睛所见之外还有什么？","¿Hay algo más de lo que vemos?",[
["Two worlds: the visible (physical) and the invisible (spiritual). The Bible explains how, when and why all things exist.","两个世界：可见的（物质）和不可见的（属灵）。圣经说明万物如何、何时、为何存在。","Dos mundos: el visible (material) y el invisible (espiritual). La Biblia explica cómo, cuándo y por qué existe todo.","Colossians 1:16;Romans 1:19-20;Hebrews 11:3"],
["God: from everlasting to everlasting, self-existent, the only Ruler, greater than all.","神：从永远到永远、自有永有、独一的主宰、比万有都大。","Dios: eterno, existe por sí mismo, el único Soberano, mayor que todos.","Psalm 90:2;Exodus 3:14;1 Timothy 6:15;John 10:29"],
["Three heavens: the sky; the realm under the devil; the spiritual heaven where the throne is.","三层天：天空；魔鬼掌权的空中；属灵的天，宝座所在。","Tres cielos: el firmamento; el dominio del diablo; el cielo espiritual donde está el trono.","Genesis 1:8;Ephesians 2:2;2 Corinthians 12:2"],
["The universe will end, and hell is real.","宇宙将有终结，地狱是真实的。","El universo tendrá fin, y el infierno es real.","2 Peter 3:7-10;Matthew 25:41;Revelation 20:14-15"]]],
["What Is Man?","人是什么？","¿Qué es el hombre?","Who am I, really?","真正的“我”是谁？","¿Quién soy realmente?",[
["Two beings: the visible “me” (flesh, from dust, it expires) and the invisible “me” (spirit, eternal). The spirit is the true me.","两个存在：看得见的“我”（肉体，出于尘土，会朽坏）和看不见的“我”（灵，永存）。灵才是真正的我。","Dos seres: el “yo” visible (carne, del polvo, caduca) y el “yo” invisible (espíritu, eterno). El espíritu es el verdadero yo.","Genesis 2:7;Genesis 1:27"],
["Life after death: Hades, Abraham’s side (OT) and Paradise (NT).","死后的生命：阴间、亚伯拉罕的怀里（旧约）与乐园（新约）。","La vida después de la muerte: el Hades, el seno de Abraham (AT) y el Paraíso (NT).","Luke 8:26-31"],
["Resurrection: Christ is the firstfruit; the saints rise at His second coming; the rest after 1,000 years.","复活：基督是初熟的果子；圣徒在祂再来时复活；其余的人在一千年后。","Resurrección: Cristo es las primicias; los santos resucitan en su segunda venida; los demás después de mil años.","1 Corinthians 15:23;Revelation 20:4-5;Revelation 20:12-15"],
["The man of spirit: “I am a soul! This is my flesh!” Live for eternal life, obey Christ’s word, put the kingdom first.","属灵的人：“我是灵魂！这是我的肉体！”为永生而活，听从基督的话，先求神的国。","El hombre espiritual: “¡Soy un alma! ¡Esta es mi carne!” Vive para la vida eterna, obedece la palabra de Cristo, pon primero el reino.","Matthew 6:25-33;Luke 9:59-62;Romans 8:12-13"]]],
["Sin","罪","El pecado","What went wrong between us and God?","我们与神之间出了什么问题？","¿Qué salió mal entre Dios y nosotros?",[
["The Bible’s definition: sin is separation from God. (Other views: greed, social disorder, a corrupt heart.)","圣经的定义：罪就是与神分离。（其他看法：贪欲、破坏社会秩序、内心败坏。）","Definición bíblica: el pecado es la separación de Dios. (Otras visiones: codicia, desorden social, corazón corrupto.)","1 John 3:8"],
["Origin: the devil sinned first in heaven, then became the father of lies and the first murderer.","起源：魔鬼最先在天上犯罪，后来成为说谎者的父和最初的杀人者。","Origen: el diablo pecó primero en el cielo; luego fue padre de mentira y el primer homicida.","Isaiah 14:12-15;John 8:44;1 John 3:12"],
["Adam’s sin brought death: separation from God, among people, and between flesh and soul.","亚当犯罪带来死亡：与神分离、人与人分离、肉体与灵魂分离。","El pecado de Adán trajo muerte: separación de Dios, entre las personas y entre carne y alma.","Genesis 3:17;Genesis 4:8"],
["Original sin is passed on; sins we commit ourselves are not inherited.","原罪会遗传；自己所犯的罪不会遗传。","El pecado original se transmite; los pecados cometidos personalmente no se heredan.","Revelation 12:9"]]],
["Redemption","救赎","La redención","How was the price of sin paid?","罪的代价是如何偿还的？","¿Cómo se pagó el precio del pecado?",[
["Redemption means paying the price of sin, paying on someone’s behalf, and buying back. Its purpose: forgiveness, cleansing, life.","救赎是偿还罪的代价、代人偿还、并赎回。目的：赦罪、洁净、得生命。","Redención es pagar el precio del pecado, pagar en lugar de otro y rescatar. Su fin: perdón, limpieza, vida.","Leviticus 5:6;Exodus 12:3-13;Hebrews 9:18-22;Leviticus 17:11"],
["In the Old Testament: sin offerings once a year, peace offerings at every occasion, through the priests and sanctuary.","旧约中：每年一次的赎罪祭、每逢场合的平安祭，由祭司和圣所执行。","En el Antiguo Testamento: ofrenda por el pecado una vez al año, ofrenda de paz en cada ocasión, por medio de sacerdotes y santuario.","Leviticus 16:30;Leviticus 16:33-34"],
["Completed in Jesus: the eternal sanctuary, high priest and sacrifice. His blood purified the heavenly sanctuary.","在耶稣里成全：永远的圣所、大祭司和祭物。祂的血洁净了天上的圣所。","Cumplida en Jesús: santuario, sumo sacerdote y sacrificio eternos. Su sangre purificó el santuario celestial.","Hebrews 9:1-3;Hebrews 9:23"],
["The first Adam became a living being; the last Adam is a life-giving spirit. Christianity is not a religion of retribution but faith by grace.","首先的亚当成为有生命的人；末后的亚当成为叫人活的灵。基督教不是报应的宗教，而是因恩典而有的信。","El primer Adán fue un ser viviente; el último Adán es espíritu que da vida. El cristianismo no es una religión de retribución sino fe por gracia.","1 Corinthians 15:45;Ephesians 1:7;1 Peter 1:18-19"]]],
["Grace","恩典","La gracia","What did God freely give?","神白白赐给我们什么？","¿Qué nos dio Dios gratuitamente?",[
["General grace (nature, for all) and special grace (the only begotten Son, for all who believe).","普遍恩典（大自然，给所有人）与特殊恩典（独生子，给所有相信的人）。","Gracia general (la naturaleza, para todos) y gracia especial (el Hijo unigénito, para todos los que creen).","John 3:16"],
["Redemption was done by the Son at the cross for all; forgiveness comes from the Father today to those who believe.","救赎是子在十字架上为众人成就的；赦免是父今日赐给相信之人的。","La redención la hizo el Hijo en la cruz por todos; el perdón lo da el Padre hoy a los que creen.","Ephesians 1:7;Ephesians 2:8"],
["The Law only condemns; the greatest gift is the forgiveness of sin.","律法只是定罪；最大的礼物是罪得赦免。","La Ley solo condena; el mayor regalo es el perdón del pecado.","Romans 3:19-20;Hebrews 10:17-18;1 Corinthians 15:56"],
["Purpose: Jesus alone is my boast. Testify of grace: healing, answered prayer, a changed life, thanks.","目的：唯有耶稣是我的夸耀。见证恩典：医治、祷告蒙应允、生命改变、感恩。","Propósito: solo Jesús es mi orgullo. Testifica la gracia: sanidad, oraciones contestadas, vida transformada, gratitud.","Ephesians 2:9;Ephesians 1:6;2 Corinthians 5:17;John 14:13"]]],
["Faith","信心","La fe","How do I receive it?","我如何领受？","¿Cómo lo recibo?",[
["Self-confidence is subjective, with no guarantee. Faith is objective, based on God’s word: obey, and His promise is 100%.","自信是主观的，没有保证。信心是客观的，建立在神的话上：顺服，神的应许就是百分之百。","La confianza en uno mismo es subjetiva, sin garantía. La fe es objetiva, basada en la palabra de Dios: obedece y su promesa es 100 %.","Hebrews 11:3"],
["Its objects: God, His word, Jesus Christ, His words, the name of Yeshua, and the gospel.","信心的对象：神、神的话、耶稣基督、祂的话、耶书亚的名、福音。","Sus objetos: Dios, su palabra, Jesucristo, sus palabras, el nombre de Yeshúa y el evangelio.","John 6:29;John 20:28;1 Timothy 2:5;John 12:48"],
["The steps: repentance, receive, confession, baptism, the Holy Spirit, obedience, sanctification.","步骤：悔改、接受、认信、受洗、圣灵、顺服、成圣。","Los pasos: arrepentimiento, recibir, confesión, bautismo, Espíritu Santo, obediencia, santificación.","Acts 2:1-4"],

var RB=['There is a visible world and an invisible one, and one God who made both.|有可见的世界，也有不可见的世界，一位神创造了两者。|Hay un mundo visible y uno invisible, y un solo Dios que creó ambos.','I am a soul. The flesh is only my clothing; the spirit is the true me.|我是灵魂。肉体只是衣服，灵才是真正的我。|Soy un alma. La carne es solo mi ropa; el espíritu es el verdadero yo.','Sin is separation from God. It began with Satan, entered through Adam, and every person is born under it.|罪就是与神分离。它始于撒旦，借亚当进入，每个人生来就在罪下。|El pecado es separación de Dios. Comenzó con Satanás, entró por Adán y todo hombre nace bajo él.','Someone had to pay the price of sin. Jesus paid it once for all with His own blood.|罪的代价必须有人偿还。耶稣用自己的血一次永远地偿还了。|Alguien debía pagar el precio del pecado. Jesús lo pagó una vez para siempre con su propia sangre.','Forgiveness is a free gift, already paid for. I only need to receive it.|赦免是白白的礼物，代价已付清，我只需领受。|El perdón es un regalo gratuito, ya pagado. Solo debo recibirlo.','Faith means receiving what Jesus did, then obeying His word to the end.|信心就是领受耶稣所成就的，并顺服祂的话直到底。|La fe es recibir lo que Jesús hizo y obedecer su palabra hasta el fin.','Faith life is church life: I belong to Christ’s body and live in it.|信仰生活就是教会生活：我属于基督的身体，并活在其中。|La vida de fe es la vida de iglesia: pertenezco al cuerpo de Cristo y vivo en él.'];
var QA=[['In your own words, what is the truth?|用你自己的话，什么是真理？|En tus propias palabras, ¿qué es la verdad?','If life is an airplane, where is it heading?|如果人生是一架飞机，它要飞向哪里？|Si la vida es un avión, ¿hacia dónde va?'],['Who am I, really?|真正的我是谁？|¿Quién soy realmente?','Where do I go after I die?|死后我去哪里？|¿A dónde voy cuando muera?'],['In your own words, what is sin?|用你自己的话，什么是罪？|En tus propias palabras, ¿qué es el pecado?','Is a newborn baby spiritually alive or dead?|新生婴儿的灵是活的还是死的？|¿Está un recién nacido espiritualmente vivo o muerto?'],['What is the greatest love anyone can show?|一个人能表现的最大的爱是什么？|¿Cuál es el mayor amor que alguien puede mostrar?','Could a lamb pay for a human life? Who could?|一只羔羊能偿还人的生命吗？谁能？|¿Podría un cordero pagar por una vida humana? ¿Quién podría?'],['What is the biggest gift you have ever received?|你收到过最大的礼物是什么？|¿Cuál es el mayor regalo que has recibido?','Are you forgiven? When, and how do you know?|你被赦免了吗？什么时候？你怎么知道？|¿Estás perdonado? ¿Cuándo y cómo lo sabes?'],['Which is easier: keeping 613 commandments or believing?|哪个更容易：遵守613条诉命，还是相信？|¿Qué es más fácil: guardar 613 mandamientos o creer?','What do I put my trust in today?|我今天把信靠放在什么上？|¿En qué pongo mi confianza hoy?'],['“I believe in God, I don’t need church.” What do you think?|“我信神，不需要教会。”你怎么看？|«Creo en Dios, no necesito iglesia». ¿Qué piensas?','What kind of church is God leading me to?|神要带我去什么样的教会？|¿A qué tipo de iglesia me guía Dios?']];
var M=[
['A story: the airplane~You are born on a luxurious airplane with everything you need. You explore its pools and its views, but rarely ask: where is this airplane heading?|一个故事：飞机~你生在一架豪华的飞机上，一切所需俱全。你探索泳池和风景，却很少问：这架飞机要飞向哪里？|Una historia: el avión~Naces en un avión de lujo con todo lo necesario. Exploras sus piscinas y vistas, pero rara vez preguntas: ¿hacia dónde va este avión?','Creation or evolution?~Three views: progressive creation (many creation events over millions of years), theistic evolution (God guiding life over billions of years) and atheistic evolution (life appears by chance, then mutation and selection).|创造还是进化？~三种看法：渐进创造（数百万年间多次创造）、有神进化（神引导生命进化数十亿年）、无神进化（生命偶然出现，再靠突变和自然选择）。|¿Creación o evolución?~Tres visiones: creación progresiva (muchos actos creativos en millones de años), evolución teísta (Dios guía la vida por miles de millones de años) y evolución atea (la vida surge al azar y luego mutación y selección).'],
['Do I have life?~A person can go many days without food or water, but not without breathing. Yet life (zoë) is more than breath: Jesus is the author of life (Acts 3:15; John 1:4).|我有生命吗？~人可以许多天不吃不喝，却不能不呼吸。但生命（zoë）不只是气息：耶稣是生命的创始者（徒3:15；约1:4）。|¿Tengo vida?~Se puede pasar muchos días sin comer ni beber, pero no sin respirar. Aun así la vida (zoë) es más que aliento: Jesús es el autor de la vida (Hch 3:15; Jn 1:4).','Eat the Word~The flesh lives on bread; the spirit lives on God’s word. Obeying it keeps us in His life (Matt 4:4; John 12:50).|吃神的话~肉体靠饼活着，灵靠神的话活着。顺服神的话，我们就留在祂的生命里（太4:4；约12:50）。|Come la Palabra~La carne vive de pan; el espíritu vive de la palabra de Dios. Obedecerla nos mantiene en su vida (Mt 4:4; Jn 12:50).'],
['Meet “Mr. Nice Guy”~Being nice does not decide heaven or hell. God’s standard is not good behavior but separation from Him, like cut roses that look fresh but are already dying.|认识“好好先生”~好人不等于进天堂。神的标准不是行为好坏，而是是否与祂分离，就像剪下的玫瑰看似新鲜，其实已在枯萎。|Conoce al «buen tipo»~Ser amable no decide el cielo o el infierno. La norma de Dios no es la buena conducta sino la separación de Él, como rosas cortadas que parecen frescas pero ya mueren.','Living in the mud~In a sinful world the patterns of sin (Gal 5:19-21; 2 Tim 3:2-5) feel normal, like someone so used to the mud that they no longer feel dirty.|活在泥里~在罪恶的世界里，罪的样式显得很平常（加5:19-21；提后3:2-5），就像住惯了泥地的人不觉得自己脏。|Viviendo en el barro~En un mundo de pecado, sus patrones (Gá 5:19-21; 2 Ti 3:2-5) parecen normales, como quien se acostumbra al barro y ya no se siente sucio.'],
['The Passover lamb~Redemption has always meant a substitute: the lamb’s blood on the doorposts spared Israel’s firstborn (Exod 12:3-13). It points to Jesus.|逾越节的羔羊~救赎一直是有替代者：羔羊的血涂在门框上，以色列的长子得以存活（出12:3-13）。这指向耶稣。|El cordero de la Pascua~La redención siempre implicó un sustituto: la sangre del cordero en los postes libró a los primogénitos de Israel (Éx 12:3-13). Apunta a Jesús.','Why every year?~Animal blood could never cleanse people perfectly or forever (Heb 10:1-8), so offerings were repeated yearly. Only blood entered the Most Holy Place, because the life is in the blood (Lev 17:11).|为什么每年一次？~牲畜的血不能使人永远完全洁净（来10:1-8），所以每年重复。只有血能进至圣所，因为生命在血中（利17:11）。|¿Por qué cada año?~La sangre de animales nunca limpió perfecta ni eternamente (He 10:1-8), por eso se repetía cada año. Solo la sangre entraba al Lugar Santísimo, porque la vida está en la sangre (Lv 17:11).','The Creator died for creation~Psalm 22 describes the cross a thousand years earlier. Jesus said “It is finished”: there is nothing left for us to pay.|创造者为受造者死~诗篇22篇在一千年前就描述了十字架。耶稣说“成了”：我们已没有什么可偿还。|El Creador murió por la creación~El Salmo 22 describe la cruz mil años antes. Jesús dijo «Consumado es»: ya no queda nada por pagar.'],
['Priceless, not worthless~Grace is too costly to put a price on, so God gave it without a price. It cost the life of God. Faith is how I catch the gift; without grace, faith has nothing to receive.|无价，不是没价值~恩典太宝贵，无法定价，所以神白白赐下，代价是神的生命。信心是接住礼物的手；没有恩典，信心就无物可接。|Sin precio, no sin valor~La gracia es demasiado costosa para ponerle precio, por eso Dios la dio gratis. Costó la vida de Dios. La fe es la mano que recibe; sin gracia, la fe no tiene qué recibir.','Death-row clemency~Like a prisoner told on execution day that he is pardoned, the gospel tells sinners under the Law: your sins are forgiven (Matt 9:2).|死囚得赦免~就像死囚在行刑当天听到被赦免，福音向律法之下的罪人宣告：你的罪赦了（太9:2）。|Indulto en el corredor de la muerte~Como un preso al que el día de su ejecución le anuncian el indulto, el evangelio dice a los pecadores bajo la Ley: tus pecados son perdonados (Mt 9:2).'],
['The delivery at the door~Someone rings the bell with a gift. You cannot see his face clearly, but you trust his word and open the door. Receiving is opening the door; confession is signing for the package.|门口的包裹~有人按门铃送来礼物。你看不清他的脸，却信他的话，开了门。接受就是开门，认信就是签收。|La entrega en la puerta~Alguien toca el timbre con un regalo. No ves bien su cara, pero confías en su palabra y abres. Recibir es abrir la puerta; confesar es firmar la entrega.','Where does faith come from?~Jesus is the author and finisher of faith (Heb 12:2). Faith comes from heaven and must be received as God reveals it, like soil receiving rain (Gal 3:23-24; Matt 13).|信心从哪里来？~耶稣是信心的创始者和完成者（来12:2）。信心从天而来，要照神所启示的领受，像土壤接受雨水（加3:23-24；太13）。|¿De dónde viene la fe?~Jesús es el autor y consumador de la fe (He 12:2). La fe viene del cielo y se recibe como Dios la revela, como la tierra recibe la lluvia (Gá 3:23-24; Mt 13).'],
['Attending is not belonging~A branch must stay attached to the vine. A soul that decides to follow Christ should be joined to the church quickly (John 15:1-8).|参加不等于归属~枝子必须连在葡萄树上。决志跟随基督的人应尽快归入教会（约15:1-8）。|Asistir no es pertenecer~El pámpano debe permanecer unido a la vid. Quien decide seguir a Cristo debe unirse pronto a la iglesia (Jn 15:1-8).','Gathering is the secret~Faith is kept by gathering (Heb 10:25). Worship, prayer and the Holy Spirit’s gifts happen in the gathering, and a church that works to gather is a strong church.|聚会是秘诀~信心靠聚会得以持守（来10:25）。敬拜、祷告和圣灵的恩赐都发生在聚会中，努力聚会的教会就是有力的教会。|Reunirse es el secreto~La fe se conserva reuniéndose (He 10:25). La adoración, la oración y los dones del Espíritu ocurren en la reunión; una iglesia que se esfuerza por reunirse es fuerte.']
];
var W=['Unity~66 books, 40+ authors, 1,500 years, 3 languages, one story: God’s plan to redeem us through Jesus.|统一~66卷书，40多位作者，跨越1500年，3种语言，却是同一个故事：神借耶稣救赎人类的计划。|Unidad~66 libros, más de 40 autores, 1.500 años, 3 idiomas, una sola historia: el plan de Dios para redimirnos por Jesús.','Prophecy~Jesus’ birth, death and resurrection were foretold (Isa 53, Mic 5:2, Ps 22), as were fallen empires (Dan 2) and Israel’s return (Ezek 36–37).|预言~耶稣的降生、受死、复活早有预言（赛53、弥5:2、诗22），列国兴衰（但2）和以色列复国（结36–37）也已应验。|Profecía~El nacimiento, muerte y resurrección de Jesús fueron anunciados (Is 53, Miq 5:2, Sal 22), igual que la caída de imperios (Dn 2) y el regreso de Israel (Ez 36–37).','Evidence~The Dead Sea Scrolls show faithful copying; archaeology confirms places like Jericho and Nineveh.|证据~死海古卷显示抄本传承极准确；考古印证了耶利哥、尼尼微等地。|Evidencia~Los Rollos del Mar Muerto muestran una copia fiel; la arqueología confirma lugares como Jericó y Nínive.','Its own claim~The Bible says all Scripture is God-breathed (2 Tim 3:16).|自身的宣告~圣经说自己都是神所默示的（提后3:16）。|Su propia afirmación~La Biblia dice que toda la Escritura es inspirada por Dios (2 Ti 3:16).'];

['cards','Is evolution science?|进化论是科学吗？|¿Es ciencia la evolución?',['Same evidence~Both views read the same evidence through different starting assumptions.|同样的证据~两种观点看的是同一批证据，只是起始假设不同。|Misma evidencia~Ambas leen la misma evidencia desde supuestos distintos.','Unobservable past~Both make claims about a past nobody can observe or repeat.|无法观察的过去~两者都在谈论无法观察、无法重复的过去。|Pasado inobservable~Ambas hablan de un pasado que nadie puede observar ni repetir.','Open puzzles~Life from non-life, the information in DNA, irreducible complexity.|未解的难题~非生命如何产生生命、DNA中的信息、不可简化的复杂性。|Enigmas abiertos~Vida desde la no vida, la información del ADN, la complejidad irreducible.']]],

else{url=AB+path;opt={headers:{'api-key':KEY}}}
return fetch(url,opt).then(function(r){
if(r.ok)return r.json();
return r.text().then(function(t){var m='';try{var j=JSON.parse(t);m=j.message||j.error||''}catch(x){m=(t||'').slice(0,90)}
var e=new Error((m||('HTTP '+r.status)));e.code=r.status;e.api=1;throw e})})
.catch(function(e){if(e&&e.api)throw e;var n=new Error('NET');n.code=0;throw n})}
